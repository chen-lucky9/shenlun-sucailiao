<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行测单题复盘</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 820px; margin: 0 auto; padding: 20px 16px 80px; background: #faf7f1; color: #2b2620; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .muted { color: #8a8175; font-size: 13px; }
    .card { background: #fff; border: 1px solid #e6dfd2; border-radius: 12px; padding: 16px; margin: 14px 0; }
    input[type=file] { display: block; margin: 8px 0; }
    button { background: #a8322d; color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.ghost { background: #fff; color: #2b2620; border: 1px solid #d8cfbe; }
    textarea { width: 100%; box-sizing: border-box; min-height: 110px; padding: 10px 12px; border: 1px solid #d8cfbe; border-radius: 8px; font-size: 14px; font-family: inherit; line-height: 1.6; resize: vertical; }
    img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: none; }
    .status { padding: 10px 12px; border-radius: 8px; font-size: 14px; margin: 10px 0; }
    .status.ok { background: #e8f5e9; color: #1b5e20; }
    .status.warn { background: #fff8e1; color: #7a5b00; }
    .status.err { background: #fdecea; color: #a8322d; }
    .status.info { background: #e8f0fe; color: #1a56db; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    #chat { display: flex; flex-direction: column; gap: 12px; margin: 12px 0; }
    .msg { max-width: 92%; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e6dfd2; }
    .msg.user { align-self: flex-end; background: #f6e7e4; border: 1px solid #eccfca; }
    .chat-input { display: flex; gap: 8px; }
    .chat-input textarea { flex: 1; min-height: 52px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>行测单题复盘</h1>
  <p class="muted">上传题目截图 → 识别 → 确认文字 → 按三轮复盘法对话。由 DeepSeek 驱动。 ｜ <a href="/mistakes.html" style="color:#a8322d">错题本 →</a></p>
  <div id="status" class="status info">正在检测后端…</div>

  <div class="card">
    <div class="row">
      <input type="file" id="file" accept="image/*" capture="environment" />
      <button id="recognize" disabled>识别题目</button>
      <button id="recheck" class="ghost">重新检测服务</button>
    </div>
    <img id="preview" alt="预览" />
    <p class="muted" style="margin-top:10px">识别结果（可修改；粘贴文字也可以直接开始）：</p>
    <textarea id="question" placeholder="识别出的题干/选项会出现在这里，也可以直接粘贴文字…"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="start" disabled>开始复盘</button>
    </div>
  </div>

  <div id="classify-card" class="card hidden">
    <div class="row">
      <span class="muted">题型：</span>
      <select id="cls-module">
        <option>言语理解与表达</option>
        <option>判断推理</option>
        <option>数量关系</option>
        <option>资料分析</option>
        <option>常识判断</option>
        <option>未分类</option>
      </select>
      <input id="cls-type" placeholder="具体题型（如 增长率）" />
      <span id="cls-tags" class="muted"></span>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="m-correct" placeholder="正确答案" />
      <input id="m-user" placeholder="我的答案" />
      <select id="m-error">
        <option value="">错因（可选）</option>
        <option>A 知识缺口</option>
        <option>B 题型识别错误</option>
        <option>C 方法选择错误</option>
        <option>D 步骤执行错误</option>
        <option>E 信息读取错误</option>
        <option>F 时间与取舍错误</option>
        <option>G 状态与注意力错误</option>
      </select>
      <select id="m-mastery">
        <option>未掌握</option>
        <option>初步掌握</option>
        <option>已形成迁移</option>
      </select>
    </div>
    <textarea id="m-summary" placeholder="复盘摘要（可粘贴一句话诊断/纠错动作）" style="min-height:60px;margin-top:8px"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="save-mistake">加入错题本</button>
      <a href="/mistakes.html" style="color:#a8322d;font-size:13px">查看错题本 →</a>
    </div>
  </div>

  <div id="chat"></div>

  <div id="input-area" class="card hidden">
    <div class="chat-input">
      <textarea id="input" placeholder="回答模型的问题（想到什么说什么，不用组织语言）…"></textarea>
      <button id="send">发送</button>
      <button id="continue" class="ghost">继续</button>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    let b64 = '', mime = 'image/jpeg';
    let question = '';
    let history = [];
    let started = false;
    let busy = false;

    function setStatus(msg, type = 'info') {
      const el = $('#status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    async function checkServer() {
      setStatus('正在检测后端…', 'info');
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 5000);
        const r = await fetch('/api/ai/vision/info', { signal: ctrl.signal, cache: 'no-store' });
        clearTimeout(timer);
        const j = await r.json();
        if (j.enabled) setStatus('后端已连接，视觉模型：' + (j.model || '未知'), 'ok');
        else setStatus('后端已连接，但未配置 VISION_API_KEY / VISION_MODEL（识别会返回 503）', 'warn');
      } catch (e) {
        setStatus('无法连接后端：请确认 npm start 正在运行（http://127.0.0.1:3000）', 'err');
      }
    }

    function loadImage(f) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('浏览器无法解码这张图片（可能是 HEIC 或损坏文件）'));
        img.src = URL.createObjectURL(f);
      });
    }

    $('#file').onchange = async () => {
      const f = $('#file').files[0];
      if (!f) return;
      try {
        const img = await loadImage(f);
        const max = 1600;
        let w = img.width, h = img.height;
        if (Math.max(w, h) > max) {
          const s = max / Math.max(w, h);
          w = Math.round(w * s); h = Math.round(h * s);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        b64 = dataUrl.split(',')[1];
        mime = 'image/jpeg';
        $('#preview').src = dataUrl;
        $('#preview').style.display = 'block';
        $('#recognize').disabled = false;
        setStatus('图片已就绪，点「识别题目」', 'info');
      } catch (e) {
        b64 = '';
        $('#recognize').disabled = true;
        setStatus('读取图片失败：' + e.message, 'err');
      }
    };

    $('#recognize').onclick = async () => {
      if (!b64) return;
      $('#recognize').disabled = true;
      setStatus('识别中…', 'info');
      try {
        const r = await fetch('/api/ai/vision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: b64, mime, prompt: '请识别图片中的行测题目，原样输出题干和选项，不要作答。' }),
        });
        const j = await r.json();
        if (j.error) { setStatus('识别失败：' + j.error, 'err'); return; }
        question = (j.text || '').trim();
        $('#question').value = question;
        $('#start').disabled = !question;
        setStatus('识别完成，请核对/修改文字后开始复盘', 'ok');
        classifyQuestion();
      } catch (e) {
        setStatus('识别请求失败：' + e.message, 'err');
      } finally {
        $('#recognize').disabled = false;
      }
    };

    $('#question').oninput = () => {
      question = $('#question').value.trim();
      $('#start').disabled = !question;
    };

    function addMsg(role, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + role;
      el.textContent = text;
      $('#chat').appendChild(el);
      window.scrollTo(0, document.body.scrollHeight);
      return el;
    }

    async function callReview(historyToSend) {
      const r = await fetch('/api/ai/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, history: historyToSend }),
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      return j.reply || '';
    }

    $('#start').onclick = async () => {
      if (busy) return;
      question = $('#question').value.trim();
      if (!question) return;
      busy = true;
      $('#start').disabled = true;
      history = [];
      $('#chat').innerHTML = '';
      setStatus('正在生成复盘…', 'info');
      const placeholder = addMsg('assistant', '思考中…');
      try {
        const reply = await callReview([]);
        placeholder.textContent = reply;
        history.push({ role: 'assistant', content: reply });
        started = true;
        $('#input-area').classList.remove('hidden');
        setStatus('复盘已开始，请回答模型的问题', 'ok');
      } catch (e) {
        placeholder.textContent = '生成失败：' + e.message;
        setStatus('复盘失败：' + e.message, 'err');
      } finally {
        busy = false;
        $('#start').disabled = false;
      }
    };

    $('#send').onclick = async () => {
      if (busy || !started) return;
      const text = $('#input').value.trim();
      if (!text) return;
      busy = true;
      $('#send').disabled = true;
      $('#input').value = '';
      addMsg('user', text);
      history.push({ role: 'user', content: text });
      const placeholder = addMsg('assistant', '思考中…');
      try {
        const reply = await callReview(history);
        placeholder.textContent = reply;
        history.push({ role: 'assistant', content: reply });
      } catch (e) {
        placeholder.textContent = '请求失败：' + e.message;
      } finally {
        busy = false;
        $('#send').disabled = false;
      }
    };

    $('#recheck').onclick = checkServer;

    $('#continue').onclick = () => {
      if (busy || !started) return;
      $('#input').value = '请继续输出剩余部分。';
      $('#send').click();
    };

    async function classifyQuestion() {
      if (!question) return;
      $('#classify-card').classList.remove('hidden');
      $('#cls-tags').textContent = '识别题型中…';
      try {
        const r = await fetch('/api/ai/classify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const j = await r.json();
        if (j.error) { $('#cls-tags').textContent = '题型识别不可用：' + j.error; return; }
        if (j.module) $('#cls-module').value = j.module;
        if (j.type) $('#cls-type').value = j.type;
        $('#cls-tags').textContent = (j.tags || []).join(' / ');
      } catch (e) {
        $('#cls-tags').textContent = '题型识别失败：' + e.message;
      }
    }

    $('#save-mistake').onclick = async () => {
      const q = $('#question').value.trim();
      if (!q) { setStatus('题目为空', 'err'); return; }
      const body = {
        module: $('#cls-module').value,
        question_type: $('#cls-type').value.trim(),
        question_text: q,
        correct_answer: $('#m-correct').value.trim(),
        user_answer: $('#m-user').value.trim(),
        error_type: $('#m-error').value,
        mastery: $('#m-mastery').value,
        summary: $('#m-summary').value.trim(),
        tags: ($('#cls-tags').textContent || '').split('/').map((s) => s.trim()).filter(Boolean),
      };
      try {
        const r = await fetch('/api/mistakes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const j = await r.json();
        if (j.error) throw new Error(j.error);
        setStatus('已加入错题本 #' + j.id, 'ok');
      } catch (e) {
        setStatus('加入错题本失败：' + e.message, 'err');
      }
    };

    checkServer();
  </script>
</body>
</html>
