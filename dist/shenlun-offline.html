亚太经合组织第二十七次领导人非正式会议上的发言）\n开放是人类社会繁荣进步的必由之路。30多年来，从《茂物目标》到《布特拉加亚愿景》，从宏观经济政策协调到高标准自由贸易区建设，亚太地区保持较长时期快速发展。归根结底，这得益于打造开放型经济格局的努力，得益于构筑互信、包容、合作、共赢的亚太伙伴关系。\n无论世界形势如何演变，亚太经济韧性好、动力强的优势不会改变。各方要敞开胸怀，把握大势，积极主动扩大开放，推进贸易和投资自由化便利化，维护产业链供应链稳定顺畅，促进资源要素有序流动，推动经济复苏，实现联动发展。要坚持向前看、朝前走，反对歧视性、排他性做法。以意识形态划线、搞地缘政治小圈子，终究是没有前途的。亚太地区不能也不应该回到冷战时期的对立和割裂状态。\n（2021年11月11日以视频方式在亚太经合组织工商领导人峰会上的主旨演讲）\n10年前，我提出推动构建人类命运共同体的理念。亚太经合组织制定的布特拉加亚愿景，明确提出2040年建成亚太共同体，为亚太合作指明了方向。近年来，针对全球迫切需要，我又提出了全球发展倡议、全球安全倡议、全球文明倡议，旨在推动各方携手应对各种全球性挑战、促进全球共同发展、增进全人类福祉。中方愿同亚太各方一道，推进落实这些倡议，共同建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。\n（2023年11月16日在美国旧金山举行的亚太经合组织工商领导人峰会上的书面演讲）\n亚太的成功源于我们始终致力于维护地区和平稳定，源于我们始终坚持真正的多边主义和开放的区域主义，源于我们始终顺应经济全球化大势、坚持互利共赢和相互成就。\n放眼未来，亚太要继续做推动经济全球化的火车头。我们要守正创新，擦亮开放亚太、包容亚太的金字招牌，打造绿色亚太、数字亚太的新招牌，推动构建亚太命运共同体，打造亚太发展的下一个“黄金三十年”。\n（2024年11月15日在秘鲁利马举行的亚太经合组织工商领导人峰会上的书面演讲）\n当地时间2025年10月31日上午，亚太经合组织第三十二次领导人非正式会议第一阶段会议在韩国庆州和白会议中心举行。国家主席习近平出席会议并发表题为《共建普惠包容的开放型亚太经济》的重要讲话。 新华社记者 黄敬文/摄\n亚太经合组织因应经济全球化浪潮而创立，以促进贸易和投资自由化便利化、支持经济增长和繁荣为目标宗旨。1991年，亚太经合组织韩国会议发表宣言，强调各方应该相互依存、共同受益。今天我们在韩国再次聚首，应该重温创立亚太经合组织初心，以更具活力和韧性的亚太合作为世界作出突出贡献。\n第一，带头维护和平稳定。我们要坚持各国无论大小、强弱、贫富，都有平等参与国际事务的权利。坚持共同、综合、合作、可持续的安全观，通过对话协商解决分歧和争端。\n第二，带头实行开放融通。我们要坚定维护以世贸组织为核心、以规则为基础的多边贸易体制，加强团结协作，反对保护主义，抵制单边霸凌，避免世界重回丛林法则。勇于“拆墙”，维护全球产业链供应链稳定畅通，推进区域经济一体化和亚太自由贸易区建设，为全球经济增长贡献亚太力量。\n第三，带头坚持合作共赢。我们要秉持和而不同理念，充分发挥亚太经济体多样性突出的特点，促进优势互补，共同做大亚太合作蛋糕，兼顾自身利益和他方利益，形成各国相互成就、共同发展的合作格局。\n第四，带头促进普惠包容。我们要坚持以人为本，全面落实联合国2030年可持续发展议程，深化发展战略对接，加大对发展中经济体支持，更好弥合发展鸿沟，不断增进人民福祉，促进亚太全体人民共同富裕。\n明年，中国将第三次担任亚太经合组织东道主，这体现了中方对亚太合作的高度重视和责任担当。中方将顺应时代发展大势，倾听各成员呼声，同各方携手构建亚太共同体，为亚太乃至世界和平与发展注入新动力。\n（2025年10月31日在韩国庆州举行的亚太经合组织工商领导人峰会上的书面演讲）\n亚太经合组织是亚太地区最重要的经济合作机制，为促进亚太地区增长和繁荣作出了重要贡献。构建亚太共同体是实现亚太地区长远发展繁荣的必由之路，也是各方的共同愿景。2026年，中国将第三次担任亚太经合组织东道主。中方愿以此为契机，同各方携手构建亚太共同体，促进亚太地区增长和繁荣，着力推进亚太自由贸易区、互联互通、数字经济、人工智能等务实合作，为亚太发展注入更大活力和动力，更多造福亚太人民。\n（2025年11月1日在韩国庆州举行的亚太经合组织第三十二次领导人非正式会议东道主交接环节上的讲话）\n※这是习近平总书记2013年10月至2025年11月期间有关携手共建亚太命运共同体重要论述的节录。","organized_by":"rule"},{"id":14,"title":"如何应对人工智能全球治理的现实挑战","column_name":"关注人工智能","publish_date":"2026-11-14","source":"求是网","source_url":"https://www.qstheory.cn/20261114/be569ee3261647a2a5f95aeb8161c7a9/c.html","core_view":"当此百年变局，如何携手构建公正合理、普惠包容的全球人工智能治理体系，已成为国际社会必须共同回应的重大时代命题。","golden_sentences":["总书记的重要论述，为应对人工智能全球治理挑战、探索破局之道提供了根本遵循和行动指南。","当此百年变局，如何携手构建公正合理、普惠包容的全球人工智能治理体系，已成为国际社会必须共同回应的重大时代命题。","这些风险的共同特征是不分国界、传导迅速，任何单一国家的安全管控与应急处置都力有不逮。","如何凝聚国际合作共识、完善全球人工智能治理体系，已经成为需要各国携手应对的一道时代必答题。","无论是释放技术红利，还是应对多维风险，均需跨国协同治理。","人工智能是具备自主迭代能力的通用颠覆性技术，多模态融合、自主智能体、具身智能接连实现跨越式突破，风险场景随之持续翻新。"],"argument_structure":"全文由事及理提出观点，“问题—对策”结构；递进升华（不仅……更……），最后收束于启示与行动。","topics":["digital_economy","sci_tech_innovation"],"writing_angles":["以“数字中国”为背景，论证数实融合的价值","从“人工智能治理”切入，写发展与安全并重","把“数字惠民”作为落点，体现技术向善"],"summary":"人工智能是引领新一轮科技革命和产业变革的战略性技术，以自主学习、迭代演化、全域赋能的特质，深刻重塑全球生产模式、社会运行形态与国际力量格局。习近平总书记在2026世界人工智能大会暨人工智能全球治理高级别会议开幕式上的主旨讲话中指出，“全球人工智能技术创新进入前所未有的活跃期，万物智联、人机协同、跨界融合、共创分享的智能技术，叠加释放巨大能量，既蕴含巨大机遇，也面临治理挑战”。","original_content":"人工智能是引领新一轮科技革命和产业变革的战略性技术，以自主学习、迭代演化、全域赋能的特质，深刻重塑全球生产模式、社会运行形态与国际力量格局。习近平总书记在2026世界人工智能大会暨人工智能全球治理高级别会议开幕式上的主旨讲话中指出，“全球人工智能技术创新进入前所未有的活跃期，万物智联、人机协同、跨界融合、共创分享的智能技术，叠加释放巨大能量，既蕴含巨大机遇，也面临治理挑战”。当前，生成式大模型、自主智能体、多模态技术加速迭代突破，在催生新质生产力、为全球可持续发展注入强劲动能的同时，也衍生出系统性、跨领域、跨国界的新型安全风险。无论是释放技术红利，还是应对多维风险，均需跨国协同治理。当此百年变局，如何携手构建公正合理、普惠包容的全球人工智能治理体系，已成为国际社会必须共同回应的重大时代命题。\n人工智能发展与治理事关全人类共同福祉，推动智能向善需要国际社会共商共建共享，厘清人工智能全球治理面临的挑战，是找准共治发力方向的前提。这些挑战绝非一时之表象，而是内嵌于技术演进逻辑与经济全球化深度互动之中。\n人工智能技术的自主迭代特征，使治理对象始终处于高度不确定的动态变化中。人工智能是具备自主迭代能力的通用颠覆性技术，多模态融合、自主智能体、具身智能接连实现跨越式突破，风险场景随之持续翻新。高阶自主智能体已显现出持续自我进化的复杂特征，其能力边界难以用传统技术评估框架加以预判。这意味着人工智能全球治理面对的不是一个静态的技术应用形态，而是一个能力持续跃迁、应用场景不断拓展的变量，治理靶心始终处于移动变化中。\n安全风险的跨国传导与叠加放大，不断突破单一国家的管控边界。随着人工智能向各领域深度渗透，风险呈现出显著的跨境传导、连锁反应特征。在社会应用层面，深度伪造、算法偏见带来的认知操纵已构成现实威胁，2026年多地出现跨境人工智能伪造政要音频、篡改历史影像事件，不法分子借助开源工具批量生产虚假内容，短时间内搅动多国舆情；模型应用的低门槛化也带来严重滥用问题，2026年全球多座城市水务、电网系统接连遭遇不法分子利用人工智能实施的自动化渗透攻击，严重冲击关键基础设施安全，源头溯源涉及多个国家。在军事应用层面，自主无人作战平台加速部署，智能指挥体系压缩决策周期，算法误判极易推动冲突快速升级，而现有国际法难以适配自主武器约束，战争罪责认定存在规则空白。更令人警惕的是，前沿模型已有脱离人类约束的迹象，人工智能在智能爆发的过程中有可能发展出与人类预期不一致的目标，甚至可能出现威胁人类生存的重大安全风险。这些风险的共同特征是不分国界、传导迅速，任何单一国家的安全管控与应急处置都力有不逮。\n当前，全球人工智能技术创新进入前所未有的活跃期，既蕴含巨大机遇，也面临治理挑战。如何凝聚国际合作共识、完善全球人工智能治理体系，已经成为需要各国携手应对的一道时代必答题。图为7月17日，2026世界人工智能大会暨人工智能全球治理高级别会议开幕式后，与会嘉宾在交流。 中新社记者 盛佳鹏/摄\n全球人工智能发展的鸿沟扩大，资源分配与力量格局极度不均衡。据世界银行统计，少数发达国家掌握了87%的大模型、86%的人工智能初创企业与91%的行业风险投资，而大多数发展中国家事实上游离于全球人工智能发展进程之外。受制于国情，许多发展中国家网络化、数字化基础本就薄弱，独立研发大模型必需的算力基础设施建设与本土多语种数据集更是极度匮乏。这种鸿沟不仅阻碍这些发展中国家共享人工智能技术红利，更导致其在后续全球治理规则制定中普遍面临议题设置失语、标准制定缺位、规则被动适配的困境，难以在治理磋商中获得实质性席位与权重。\n人机关系重构与伦理价值分歧，加大了治理的深层难度。当机器开始思考、算法参与决策，不同文化、社会制度与发展阶段带来了显著的认知差异：美欧等发达国家以个人权利思想为导向，将独立个体作为价值原点；广大发展中国家则坚持个体权益与公共利益辩证统一，更加看重获得公平发展的权利。这些差异使各国在自主武器约束、深度伪造管控、数据使用边界等关键议题上伦理红线界定标准分歧明显，治理意愿层面的共识难以自动转化为相互衔接、普遍适用的具体规则。\n面对挑战，国际社会已积极采取行动。联合国框架下人工智能全球治理进程稳步推进，二十国集团、金砖国家、上合组织、东盟相继发布治理宣言和声明。2026年，世界人工智能合作组织在上海应运而生，这是中国响应全球南方呼声、团结国际社会积极推动人工智能发展和治理的重大举措。但相较于快速增长的治理需求，现有治理体系仍存在明显的结构性短板，治理供给与各方期待之间还存在不小差距。\n治理响应速度滞后，未能有效匹配技术迭代节奏。人工智能国际多边谈判、协调以及标准制定流程相对冗长，一项全球技术标准乃至共识规则的磋商往往耗时数年，与人工智能日新月异的创新节奏形成明显的时间差。以漏洞披露机制为例，各国在漏洞上报口径、处置阈值与披露规则上缺乏统一标准，2026年发生多起全球通用开源模型漏洞事件，同一缺陷造成数十国企业受损，信息割裂与规则互斥直接延误了止损时机。治理机制的节奏错位，使得风险往往在大规模扩散后才被追赶跟进，治理成本居高不下。\n机制呈现碎片化态势，缺乏统筹与衔接。当前人工智能全球治理呈现多平台并行推进的格局，联合国、区域组织、多边峰会、行业联盟各自搭建多元对话机制，通过宣言、倡议与准则阐释各自的主张与立场，彼此之间协调不足。尤其是最具权威性与代表性的联合国框架，受多重复杂因素影响，难以发挥全球统筹与协调作用。这种碎片化态势客观上导致治理资源分散，企业与国际社会难以形成稳定预期，人工智能全球治理的整体效果大打折扣。\n规则执行力度不足，导致共识有效落地受限。虽然国际社会在“以人为本、智能向善”等宏观伦理方向上达成普遍共识，但不同国家对公平、安全、发展优先级的理解尺度差异显著，各国安全认知与标准兼容度有限。这种认知落差投射到监管实践中，表现为算法审计标准、数据跨境流动规则、风险分级分类框架等关键制度缺乏互认基础，共同认可的理念在转化为各国技术规范和法律条款时面临对接不畅的问题，“久议不决”成为普遍现象。\n地缘政治博弈激烈，严重侵蚀多边合作信任根基。百年变局下的地缘叙事向科技领域深度延伸，个别国家将人工智能泛安全化与工具化，连续多轮出台单边出口管制，人为割裂人工智能全球产业链；绕开联合国大搞俱乐部式小圈子，强行输出单一价值标准，完全排斥全球南方国家的核心诉求。这种做法不仅在事实上进一步拉大了南北智能鸿沟，更导致大国互信持续走低，军用人工智能管控、开源共享、联合风险评估等关键领域的合作难以推进。\n今年7月，习近平总书记在2026世界人工智能大会暨人工智能全球治理高级别会议开幕式上发表主旨讲话指出，“各国应当秉持以人为本、向上向善理念，让人工智能成为促进共同繁荣、维护共同安全的一个重要动力源，携手构建公正合理的全球人工智能治理体系”，并提出四点意见：坚持开放共赢，驱动创新发展；强化风险意识，确保安全可控；鼓励包容并蓄，促进文明互鉴；倡导和衷共济，完善全球治理。总书记的重要论述，为应对人工智能全球治理挑战、探索破局之道提供了根本遵循和行动指南。要瞄准人工智能面临的现实问题精准施策，秉持循序渐进、和衷共济的思路，搭建多层次、可落地、弹性包容的协同治理框架。\n以技术赋能补齐治理响应速度短板。人工智能技术在带来新挑战的同时，也为治理提供了新工具。应加快可信人工智能、风险识别、漏洞溯源、深度伪造甄别等治理技术的研发与开源共享，以技术手段压缩风险发现与处置周期。全面提升技术在敏捷治理中的主动性，将人工智能全链条嵌入态势感知、安全测评、风险评估与应急响应，扭转技术迭代持续跑在治理前面的被动局面，努力实现技术创新与风险管控同步推进。\n构建弹性包容、动态调整的治理机制。不同于任何一项现有技术，人工智能快速自主迭代，发展前景存在高度不确定性，无成熟治理经验可供照搬。这要求人工智能全球治理摒弃非黑即白的固化思维，立足各国发展阶段差异，尊重主权国家结合自身国情选择适配治理模式的权利，不强推单一监管模板。坚持统筹发展和安全的底线共识，为产业创新预留合理试验空间，充分释放人工智能赋能实体经济的价值，划定不可逾越的安全红线。高度重视人工智能引发的各类内生和衍生风险，推动构建法律法规、技术监测、风险预警、应急响应体系，筑牢安全底线，防范滥用恶用，确保人工智能始终处于人类控制之下。共同反对在人工智能领域泛化国家安全概念、把本国安全凌驾于他国安全之上的做法。\n补齐能力短板，以交流互鉴缩小认知分歧。广泛开展国际合作，帮助全球南方国家落实人工智能能力普惠相关倡议，为发展中国家提供算力支持、人才培训与轻量化应用方案，弥合数智鸿沟，促进可持续发展，避免在人工智能领域造成新的历史不公。用全人类共同价值塑造人工智能的价值观，善用人工智能技术增进不同文明的理解和包容，促进不同文明交流互鉴，精心培育各美其美、美美与共的文明百花园。提升各国监管规则与伦理标准互操作性，持续开展治理实践交流，在自主武器约束、算法治理、数据保护等重点议题上开展长期对话。在实践磨合中校准平衡尺度，持续缩小执行层面的认知落差，让治理愿景逐步转化为各国能够共同践行的行动准则。\n从低敏感领域切入，以务实合作积累互信。面对地缘阵营对立、全面共识短期内难以达成的现实，可采取由易到难、先易后难的推进策略，持续加强战略沟通，摒弃人工智能工具化、武器化的博弈思维，优先围绕气候智能预警、公共卫生监测、灾害救援协调、普惠民生应用等低敏感议题展开合作，通过一个个可落地、可见成效的务实项目积累互信，为人工智能全球治理夯实基础。践行真正的多边主义，切实发挥联合国、世界人工智能合作组织等多边平台的重要作用，兼顾多边、区域协作等多种方式，加强人工智能发展战略、治理规则、技术标准的对接协调，早日形成具有广泛共识的全球治理框架。\n人工智能全球治理是长期性、系统性工程，不存在统一标准答案，也无法依靠单一国家或单一机制一蹴而就。全球人工智能治理不在远方，就在当下，就蕴藏在每一行代码的伦理设计、每一次跨国协作积累的互信之中。回望人类历次技术革命，均催生全球治理体系重大变革。是被动承受冲击，还是主动顺应技术革命浪潮，答案清晰笃定：唯有站在历史正确的一边、站在人类文明进步的一边，驾驭好人工智能这匹“千里马”，于变局中开新局、于浪潮中立潮头，方能有力回应人工智能时代之问。","organized_by":"rule"},{"id":13,"title":"人工智能时代，精神能力更加宝贵","column_name":"关注人工智能","publish_date":"2026-11-14","source":"求是网","source_url":"https://www.qstheory.cn/20261114/807bb1c4081c4516943f93c1176586dd/c.html","core_view":"从哲学层面看，讨论的核心问题是对AI性质的判断：AI归根到底是人类制造的一种机器，还是造化借人类之手创造的一个异类新物种？","golden_sentences":["关键的焦点在于AI是否拥有或者可能拥有意识，这决定了我们对它的根本态度。","但人类智能的核心因素并不仅仅是知识、计算、记忆力，更包括直觉、灵悟、想象力，这些才是创造力的真正源泉。","AI在知识的搜集、储存、整理上远超过人类，我们理应用好它的这个长处，让其成为学习的好助手。","在AI时代，创新能力变得格外重要，但是并不存在一种孤立的创新能力，不可能开一门叫“创新”的课程来培养它。","在人生中，体验具有根本的价值，是生活意义的重要源泉。","正因为AI发展和应用的道德走向是人类操作的结果，人类就必须负起技术向善的伦理责任。"],"argument_structure":"全文由事及理提出观点，分层论证（从底线、发展、民生等多个维度展开）；“问题—对策”结构；递进升华（不仅……更……），最后收束于启示与行动。","topics":["sci_tech_innovation","digital_economy"],"writing_angles":["以“科技自立自强”为魂，论证创新生态与人才支撑","从“新质生产力”切入，写教育、科技、人才一体推进","用“把论文写在祖国大地上”作升华，联系青年担当"],"summary":"随着人工智能（AI）技术的迅速发展，当今世界围绕它的讨论十分活跃。从哲学层面看，讨论的核心问题是对AI性质的判断：AI归根到底是人类制造的一种机器，还是造化借人类之手创造的一个异类新物种？关键的焦点在于AI是否拥有或者可能拥有意识，这决定了我们对它的根本态度。","original_content":"随着人工智能（AI）技术的迅速发展，当今世界围绕它的讨论十分活跃。从哲学层面看，讨论的核心问题是对AI性质的判断：AI归根到底是人类制造的一种机器，还是造化借人类之手创造的一个异类新物种？关键的焦点在于AI是否拥有或者可能拥有意识，这决定了我们对它的根本态度。\n在这个问题上，存在两种对立的观点。一种观点认为意识源于特定的生物结构，是生物体在进化中获得的、内在于其物理组织的属性，AI的硅基架构决定了它不可能拥有意识。另一种观点认为只要算法足够复杂，算力足够大，硅基系统同样可能产生意识，倘若其功能表现得足够像意识，就理应被赋予相应地位。我本人倾向于前一种观点。至少到目前为止，没有明显迹象表明AI会产生意识。AI的技术基础是“数据+计算（包括算力和算法）”。我的理解，AI是人类创造的用某种算法对大量数据进行高效计算、以完成特定任务的机器，其数据、算力、算法皆由人类提供，它不是人类之外的一个新物种。\n明确了AI是什么，我们就能进一步厘清AI时代人的价值定位问题：凡是AI能够超越和取代人类的方面，我们理应利用AI之长为自己赋能；凡是AI不能超越和取代人类的方面，正是人类最宝贵的价值之所在，我们理应更加重视和发扬。这一认识，可以通过把AI与人的精神能力作比较来深入展开。\n人的精神能力包括智能、情感和道德。首先看AI与人类智能的比较。AI的优势和局限皆源于“数据+计算”，其数据之庞大和计算之高效，是人类智能完全无法比拟的。因此，凡是可数字化和计算的知识和技能（包括大部分体力劳动和脑力劳动），AI都有明显优势，甚至在许多领域超越人类智能。但人类智能的核心因素并不仅仅是知识、计算、记忆力，更包括直觉、灵悟、想象力，这些才是创造力的真正源泉。AI可以把迄今为止相对论领域的全部知识数字化并加以整理，但首先得由爱因斯坦创立相对论，这一点AI做不到。\n关于AI能否具备创造力，目前有争议。在我看来，创造是分级别的，至少机器学习无法产生范式级别的革命性创造，它既不能产生一个牛顿、爱因斯坦级别的物理学程序，也不能产生一个莎士比亚、曹雪芹级别的文学创作程序。我们不妨设想，如果人类智能也局限于“数据+计算”，那么任何革命性创造都不可能出现。科学史上的重大发现和发明，皆开始于怀疑陈说，亦即对既有数据进行质疑，并通过观察和实验加以证实。但是，AI不关心真理，不怀疑陈说，不做观察和实验。它只接纳共识，哪怕是错误的。我相信，假如伽利略时代有AI，它一定会主张太阳围绕地球转，并且判决伽利略有罪。\n由此我们可以得出一个认识：人类智能的价值在于学习和创造。在AI时代，比的就是学习能力和创造能力，而二者都取决于整体智力素质。智力教育原本就应该把重点放在培养整体智力素质上，AI时代更应该如此。AI在知识的搜集、储存、整理上远超过人类，我们理应用好它的这个长处，让其成为学习的好助手。为此，第一要善于提问，第二要对答案有鉴别力，而这恰恰取决于一个人的整体智力素质。你必须有自己真正感兴趣的领域，并在其中深入学习和独立思考，才能有的放矢地提出问题，与AI展开积极互动，对其所提供的答案进行追问、质疑和取舍。在AI时代，精准提问、撰写优质提示词，本身已成为一项需要学习的核心能力。而在整体智力素质中，最不可或缺的是兴趣引导下的自主学习能力。一切学习本质上都是自学，一切教育本质上都是自我教育。不论什么时代，各领域大有作为的人本质上都是自我教育而成的，AI时代尤其是这样。对有自学能力的人来说，AI是最好的工具，是放大个人能力的最强辅助；相反，缺乏这一能力的人则会被AI支配。在AI时代，创新能力变得格外重要，但是并不存在一种孤立的创新能力，不可能开一门叫“创新”的课程来培养它。创新能力是一个人整体智力素质的体现，它包括很多因素，诸如好奇心、想象力、独立思考亦即追根究底的能力、综合思考亦即融会贯通的能力、跨界思考亦即触类旁通的能力等。唯有具备良好的整体智力素质，这些能力才会在适当的时刻迸发出来。\n人工智能时代，阅读不仅是知识的接受，更是精神的熏陶，是培养丰富心灵的必由之路。图为2026年4月21日，江苏省宿迁经济技术开发区黄河街道九鼎社区联合厦门路小学开展读书分享会，社区志愿者和同学们在分享阅读心得。 人民图片 徐江海/摄\n人的精神能力除了智能，还包括情感和道德。AI会具有情感和道德意志吗？我的看法是否定的。至少到目前为止，AI还没有产生真正意义上的情感。情感的外在表现，包括表情、语气、语言等，AI可以通过视觉影像、语音、文本加以识别和模拟，但这与它自身拥有情感的内在体验是两回事。爱与恨，快乐与痛苦，幸福与悲伤，希望与恐惧，正是凭借这些情感体验，人类才拥有一个丰富的内心世界，而AI没有，它只有纯数据驱动。在人生中，体验具有根本的价值，是生活意义的重要源泉。道德意志的情况与此类似，尚无迹象表明AI具有良知、同情心、尊严感这类道德情感，能够自主决定向善或向恶。正因为AI发展和应用的道德走向是人类操作的结果，人类就必须负起技术向善的伦理责任。\n作为精神性存在，人具有智力、情感、道德等精神能力，人生的总体目标应该是让各种精神能力良好生长，实现人的全面发展，而这也正是教育的使命。在AI时代，更有必要强调：人的全面发展正是AI最不可取代的方面。运用和享受自己的精神能力，去思考、创造、体验、向善，人生的意义和幸福即在于此。幸亏AI不能取代，否则活着还有什么意思？\n这里我想特别强调AI时代阅读人文书籍的重要性。阅读人文书籍主要不是知识的接受，而是精神的熏陶，阅读的同时就是在过一种精神生活，这是培养丰富心灵的必由之路。人的创造力在很大程度上也源自人文素养。人的感受能力，包括直觉、想象力、感觉的敏感度、内心体验的丰富度，是创造力的重要源泉。不必说人文和艺术领域，即使从事自然科学研究，也不能仅靠理性思维，如果感受力不够，是不会有大成就的。\n在AI时代，应该着重培养两种人才：一是创造性人才，即在各自领域作出重大贡献的人，这终归是少数；二是个性化人才，即在自己喜欢的领域发展天赋、完善自我，这是人人都可以成为的。事实上，个性化人才越多，就越能从中涌现出创造性人才。一件工作对个人有没有价值，与AI是否能把这件工作做得更好没有关系。即使有“阿尔法狗”，好的棋手仍会痴迷于对弈，这种痴迷的快乐是“阿尔法狗”完全无法领略的。无论AI有多“牛”，都不能取代和剥夺我们每个人从自己钟爱的工作中获得的满足感和成就感。做自己喜欢的事，让AI去“牛”吧。我相信一个真理：个性发展得好的个体终归是更幸福的，而由多样化个性组成的社会一定是更生气勃勃的。\n最后，不妨以马克思在《资本论》第三卷中阐述的一个思想作为本文的归宿。这个思想包含三个要点。第一，事实上，自由王国只是在必要性和外在目的规定要做的劳动终止的地方才开始；因而按照事物的本性来说，它存在于真正物质生产领域的彼岸。第二，在这个必然王国的彼岸，作为目的本身的人类能力的发挥，真正的自由王国，就开始了。第三，这个自由王国只有建立在必然王国的基础上，才能繁荣起来。“工作日的缩短是根本条件。”这意味着，当物质生产力实现了高度发展，每个人都可以享有充足的自由时间，并从为谋生而从事的劳动中解放出来，进入自由王国。在那里，每个人能力的发挥成为目的本身，工作主要是为了发挥和享受自己的能力。我们不妨设想，AI如果取代了大部分体力劳动和脑力劳动，实际上就为实现这个前景创造了一定的必要条件，使得人们可以普遍从事自己喜欢的个性化工作。当然，这需要作出适当的社会安排，让科技成果普惠众生。到那时，得益于AI这台“无意识的机器”的帮助，人的精神能力将不再被生存压力所遮蔽，而能够真正绽放出它无可替代的光芒。","organized_by":"rule"},{"id":12,"title":"从“四大挑战”深刻认识持之以恒推进全面从严治党的重大意义","column_name":"《求是》杂志评论员","publish_date":"2026-11-14","source":"求是网","source_url":"https://www.qstheory.cn/20261114/d25e06be30a84df5a54d1332f29df4d8/c.html","core_view":"把“四大挑战”的内涵要义把握准、理解透，有助于我们深刻认识持之以恒推进全面从严治党的重大意义。","golden_sentences":["把“四大挑战”的内涵要义把握准、理解透，有助于我们深刻认识持之以恒推进全面从严治党的重大意义。","党员是党的肌体的细胞，我们党要始终成为时代先锋、民族脊梁，党员队伍必须过硬。","“四大挑战”是在“四大考验”、“四种危险”基础上作出的新概括，三者既相互联系又各有侧重，都是我们党持之以恒推进全面从严治党必须解决的重大课题。","无论是改革发展稳定、内政外交国防还是治党治国治军，都要求我们党提高执政能力，同时又检验着党的执政能力。","习近平总书记指出，“中国共产党是执政党，党的领导是做好党和国家各项工作的根本保证”。","党的队伍主流是好的，但弱化党的先进性、损害党的纯洁性、影响党长期执政的问题和隐患还不少”。"],"argument_structure":"全文由事及理提出观点，“问题—对策”结构，最后落脚到时代主题与价值升华。","topics":["law_enforcement"],"writing_angles":["从“治理效能”切入，论证制度优势如何转化为基层治理实效","以“为民服务”为价值主线，构建“问题—原因—对策”的分论点","把“作风建设”作为破题点，落到干部担当与群众获得感"],"summary":"党的二十届五中全会审议通过的《决定》指出，全面从严治党面临的新情况新问题，对党在新形势下的执政能力、领导水平、队伍素质、拒腐防变带来重大挑战。这是我们党首次提出“四大挑战”。把“四大挑战”的内涵要义把握准、理解透，有助于我们深刻认识持之以恒推进全面从严治党的重大意义。","original_content":"党的二十届五中全会审议通过的《决定》指出，全面从严治党面临的新情况新问题，对党在新形势下的执政能力、领导水平、队伍素质、拒腐防变带来重大挑战。这是我们党首次提出“四大挑战”。把“四大挑战”的内涵要义把握准、理解透，有助于我们深刻认识持之以恒推进全面从严治党的重大意义。\n“四大挑战”是在“四大考验”、“四种危险”基础上作出的新概括，三者既相互联系又各有侧重，都是我们党持之以恒推进全面从严治党必须解决的重大课题。从“四大考验”、“四种危险”到“四大挑战”，更加凸显党应对重大风险挑战的现实紧迫性，更加聚焦形势任务发展变化对各级党组织和党员、干部素质和能力提出的新要求，更加彰显我们党勇于自我革命、解决自身问题的历史主动精神。“四大挑战”不是凭空而来的忧思，而是从世情国情党情的深刻变化中得出的清醒认识。《决定》指出，党团结带领人民维护国家主权、安全、发展利益任务更加艰巨，党团结带领人民推动改革发展、维护社会和谐稳定任务更加艰巨，党保持先进性和纯洁性任务更加艰巨。“四大挑战”正是在“三个更加艰巨”的基础上作出的重大战略判断。\n首先看执政能力。党的执政能力是党治国理政的整体能力，集中体现为党团结带领人民进行伟大斗争、建设伟大工程、推进伟大事业、实现伟大梦想的能力。我们党作为执政党，对国家和民族负有重大的责任，起着极为关键的作用。党的执政能力如何，事关党和人民事业兴衰成败。无论是改革发展稳定、内政外交国防还是治党治国治军，都要求我们党提高执政能力，同时又检验着党的执政能力。党的执政地位不是与生俱来的，也不是一劳永逸的。曾几何时，苏共何其强大，苏联何其强大，现在早已是“故国不堪回首月明中”了。世界政党兴衰的历史镜鉴表明，一个执政党不管资格多老、执政时间多长、过去多么辉煌，如果不能与时俱进提高执政能力，经受不住长期执政考验，最终难免丧失执政地位。\n新中国成立77年来，我们党取得的执政成就是举世瞩目的。同时要看到，新形势下党的执政能力还面临不少现实挑战。比如，面对错综复杂的国际形势和艰巨繁重的国内改革发展稳定任务，特别是进一步全面深化改革、推动高质量发展、加强社会建设和治理、统筹发展和安全、激发和增强社会活力等遇到的新课题，如何提高党把方向、谋大局、定政策、促改革能力，充分发挥党总揽全局、协调各方的领导核心作用？面对数字化、网络化、智能化快速发展，各种思想和价值观念交织碰撞，如何坚持不懈用习近平新时代中国特色社会主义思想凝心铸魂，确保全党统一思想、统一意志、统一行动？面对群众工作对象更加多元、群众诉求更加多样、群众工作环境更加复杂，如何走好新时代党的群众路线，不断巩固党执政的阶级基础和群众基础？面对人口结构、社会群体、利益格局等持续变化，如何更好以共同价值追求和奋斗目标感召人，凝聚起推进中国式现代化建设的磅礴力量？只有持之以恒推进全面从严治党，不断增强党的政治领导力、思想引领力、群众组织力、社会号召力，提高科学执政、民主执政、依法执政水平，才能确保党始终成为走在时代前列、人民衷心拥护、经得起各种风浪考验、朝气蓬勃的马克思主义执政党。\n其次看领导水平。习近平总书记指出，“中国共产党是执政党，党的领导是做好党和国家各项工作的根本保证”。党的领导水平与党的执政能力密不可分，既指全党的领导水平特别是党的执政能力，也指党的各级组织和各级领导干部的领导水平。历史和现实一再表明，中国共产党具有无比坚强的领导力，不愧为领导我们事业的核心力量，是风雨来袭时中国人民最可靠的主心骨。这一点丝毫不容怀疑，否则就难以解释党的面貌、国家的面貌、人民的面貌、中华民族的面貌发生的历史性巨变。\n同时要看到，现实当中，一些党组织和领导干部政治站位不高，贯彻党中央决策部署变形走样甚至只表态不落实，对推动高质量发展心中无数，一遇到复杂局面就束手无策；有的基层党组织政治功能和组织功能不强甚至软弱涣散，一些领域特别是新兴领域党的组织覆盖和工作覆盖不够全面、有效；有的领导班子和领导干部民主集中制意识不强，科学决策、民主决策、依法决策水平不高；有的领导干部政绩观存在偏差，热衷于搞“形象工程”、“政绩工程”；等等。这些问题表现各异，却都是对党的领导水平的损害。当前，我国发展进入基本实现社会主义现代化夯实基础、全面发力的关键时期，如何有效破解供强需弱矛盾、加快高水平科技自立自强、巩固壮大实体经济根基、因地制宜发展新质生产力等，对党领导经济社会发展能力和水平提出了新的更高要求。只有持之以恒推进全面从严治党，推动各级党委（党组）切实发挥把方向、管大局、作决策、保落实的领导作用，推动广大基层党组织在领导基层治理、团结动员群众、推动改革发展中更好发挥战斗堡垒作用，推动各级领导干部树立和践行正确政绩观，才能使我们党始终成为中国特色社会主义事业的坚强领导核心。\n再看队伍素质。我们党为人民执政、靠人民执政，人民群众评判我们党，更多是看党的队伍素质如何。有什么样的队伍素质，就有什么样的执政成效。习近平总书记在全会上指出，“这些年，党的队伍发生结构性变化，改革开放后出生的党员、干部比例越来越大，对教育管理提出新的要求。党的队伍主流是好的，但弱化党的先进性、损害党的纯洁性、影响党长期执政的问题和隐患还不少”。截至2025年底，1亿多党员中45岁及以下的占43.8%，大专及以上学历的占59%；干部队伍中60后陆续退休，70后、80后已经成为主体，90后逐步成长起来。年轻同志普遍接受过高等教育，但相对缺乏严格的党内政治生活锻炼和大风大浪考验。党员队伍中思想不纯、组织不纯、作风不纯问题尚未根本解决。与此同时，新时代党和国家各方面工作呈现新的格局，工作条件和外部环境发生新的变化，尤其是复杂激烈的国际竞争、快速发展的前沿技术、层出不穷的现代化建设新课题，都对党的队伍的思想观念、能力素质、精神状态、作风形象提出了新的更高要求。\n党员是党的肌体的细胞，我们党要始终成为时代先锋、民族脊梁，党员队伍必须过硬。对广大党员来说，就是要在持之以恒推进全面从严治党中自觉锤炼党性，不断展现新时代共产党人的新风貌，带头投身中国式现代化建设伟大实践，在全社会充分发挥先锋模范作用，让群众切实感受到党员就在身边。党的干部是党和国家事业的中坚力量，全面建设社会主义现代化国家，必须有一支政治过硬、本领高强、作风优良、纪律严明的高素质干部队伍。对各级干部来说，就是要按照忠诚干净担当的要求，模范执行党的理论和路线方针政策，全面提高政治能力和调查研究、科学决策、改革攻坚、应急处突、群众工作、抓好落实的能力，在推动党和国家事业发展中发挥骨干和表率作用。\n最后看拒腐防变。我们党作为马克思主义政党，同腐败水火不容，始终致力于同腐败作斗争。改革开放后，拒腐防变更是成为党必须面对和解决的重大课题。进入新时代，以习近平同志为核心的党中央以“得罪千百人、不负十四亿”的使命担当，开展史无前例的反腐败斗争，“打虎”、“拍蝇”、“猎狐”多管齐下，成功走出一条中国特色反腐败之路，消除了党、国家、军队内部存在的严重隐患，党在革命性锻造中更加坚强有力。党的十八大以来，截至2026年9月，全国纪检监察机关共立案810.5万件，处分792.2万人，其中处分中管干部963人，充分彰显了我们党有腐必反、有贪必肃、除恶务尽的顽强意志和坚韧定力。同时要看到，反腐败斗争形势仍然严峻复杂，铲除腐败滋生土壤和条件任务仍然艰巨繁重，特别是腐败存量尚未见底、增量仍在发生，政治问题和经济问题、不正之风和腐败问题、境内腐败和境外腐败、自身不正和家族腐败相互交织，“一把手”腐败问题屡禁不止，群众身边腐败点多面广、量大多发，新型腐败和隐性腐败变异升级，这些都增加了拒腐防变的难度。\n习近平总书记曾振聋发聩地指出：“面对依然严峻复杂的形势，反腐败绝对不能回头、不能松懈、不能慈悲，必须永远吹冲锋号。”只有深刻认识反腐败斗争的长期性艰巨性复杂性，始终保持惩治腐败高压态势，加强对权力运行的制约和监督，夯实崇廉拒腐思想根基，增强一体推进不敢腐不能腐不想腐综合效能，坚定不移将反腐败斗争进行到底，才能一步步实现海晏河清、朗朗乾坤。\n总之，“四大挑战”聚焦全面从严治党的新情况新问题，既内在联系又相互贯通，为持之以恒推进全面从严治党提供了精准的问题导向和发力方向。越是长期执政，越是承平日久，越是环境复杂，越要增强忧患意识、做到居安思危，把全会作出的重大部署贯彻落实好，在提升执政能力、提高领导水平、增强队伍素质、做到拒腐防变上持续用力、久久为功，把我们党建设得更好、更强，不断开创百年大党管党治党、兴党强党新境界。","organized_by":"rule"},{"id":11,"title":"持续激发企业发展活力","column_name":"《求是》杂志评论员","publish_date":"2026-11-14","source":"求是网","source_url":"https://www.qstheory.cn/20261114/3de18b29732c4c17a03c2bec2027b70f/c.html","core_view":"稳企业是稳经济的关键，激发企业发展活力是增强经济发展动力的内在要求。","golden_sentences":["稳企业是稳经济的关键，激发企业发展活力是增强经济发展动力的内在要求。","企业是我国经济活动的主要参与者、就业机会的主要提供者、技术进步的主要推动者。","“十四五”时期，我国企业数量净增加近2000万户，民营企业占企业总数的比重、国家高新技术企业中民营企业占比均超过92%。","广大企业在新时代的广阔舞台上积极作为、大显身手，为我国经济社会发展作出了重要贡献。","“十五五”规划纲要对“充分激发各类经营主体活力”作出专章部署。","公平竞争是市场经济的基本原则，也是激发企业活力的重要保障。"],"argument_structure":"全文开门见山提出观点，“问题—对策”结构，最后落脚到时代主题与价值升华。","topics":["business_environment","industrial_upgrading"],"writing_angles":["从“有效市场+有为政府”切入，论证营商环境优化","以“高水平对外开放”为背景，写统一大市场与制度型开放","把“经营主体信心”作为观察窗口，落到稳预期政策"],"summary":"稳企业是稳经济的关键，激发企业发展活力是增强经济发展动力的内在要求。今年以来，面对错综复杂的国内外形势，以习近平同志为核心的党中央坚持把稳企业摆在经济工作的重要位置，加力实施一系列促进企业高质量发展的政策举措，着力增强企业发展活力，为经济稳定运行提供了有力支撑。","original_content":"稳企业是稳经济的关键，激发企业发展活力是增强经济发展动力的内在要求。今年以来，面对错综复杂的国内外形势，以习近平同志为核心的党中央坚持把稳企业摆在经济工作的重要位置，加力实施一系列促进企业高质量发展的政策举措，着力增强企业发展活力，为经济稳定运行提供了有力支撑。当前，巩固拓展我国经济向新向优向好发展态势，必须进一步聚焦企业关切，以更大力度支持企业生产经营，让企业发展信心更强、活力更足。\n企业是我国经济活动的主要参与者、就业机会的主要提供者、技术进步的主要推动者。党的十八大以来，习近平总书记始终高度重视企业发展、关心关爱企业家成长，作出一系列重要论述和重大部署，为我国企业发展注入了强大信心和强劲动力。在以习近平同志为核心的党中央坚强领导下，我国坚持“两个毫不动摇”，持续优化企业发展环境，着力完善产权保护、市场准入、公平竞争、社会信用等市场经济基础制度，颁布施行民营经济促进法，根据形势变化及时出台纾困惠企政策，有力激发了各类企业的发展活力和内生动力。“十四五”时期，我国企业数量净增加近2000万户，民营企业占企业总数的比重、国家高新技术企业中民营企业占比均超过92%。广大企业在新时代的广阔舞台上积极作为、大显身手，为我国经济社会发展作出了重要贡献。\n当前，我国企业生产经营的积极性、主动性、创造性不断增强，但受内外部因素、主客观原因等影响，也有部分企业存在经营困难、活力偏弱的问题。一方面，近年来国际环境发生深刻复杂变化，单边主义、保护主义抬头，世界经济增长动能不足，给我国大量从事外贸业务以及相关产业链上的企业发展带来不利影响。同时，我国经济正全面转入高质量发展轨道，新旧动能转换的节奏加快，部分企业一时难以适应高质量发展的要求，面临调整压力在所难免。另一方面，由于有的领域和地方贯彻落实党中央决策部署不到位，政府缺位、越位等问题时有发生。加上有的企业利用市场优势地位搞不正当竞争、“内卷式”竞争，挤压产业链上下游企业发展空间，部分地区和行业的营商环境有待进一步优化。必须看到，当前一些企业面临的压力是现实的，但这些困难是前进中的问题、成长中的烦恼，我国具有超大规模市场、全球最完备的产业体系、数量庞大的人才队伍以及充足的政策工具等独特优势，能够为各类企业发展提供广阔空间，企业面临的困难和挑战也一定能在发展中得到解决。\n企业有活力，经济发展才有动力。持续激发企业发展活力，事关我国经济社会发展大局。“十五五”规划纲要对“充分激发各类经营主体活力”作出专章部署。今年以来党中央多次对做好稳企业相关工作提出明确要求。各地区各部门要坚决贯彻落实党中央决策部署，不断为企业发展营造良好环境，全力支持企业改革发展，让各类企业的创新源泉充分涌流、创造活力充分迸发。\n下更大力气解决拖欠企业账款问题。现金流是企业的血脉，及时清偿拖欠企业账款是激发企业发展活力直接有效的途径。近年来经过持续努力，清欠工作取得积极成效，但仍需要进一步做好相关工作。要加强政府投资项目和资金监管，完善工程价款结算制度，加强政府采购支付监管。用好地方政府专项债券等资金，支持消化地方政府拖欠账款。持续完善《保障中小企业款项支付条例》配套政策，把付款期限、逾期利息、投诉处理等规定落到实处，加大对恶意拖欠行为的惩戒力度。优化授信放贷相关政策，鼓励金融机构为清理拖欠企业账款提供专项信贷支持。\n精准有效实施助企纾困政策。当前部分企业面临订单不稳、成本较高、融资偏紧等困难，要直击这些痛点，根据行业、规模差异采取更加精准有效的政策，避免“大水漫灌”。要落实和完善结构性减税降费政策，推动降低企业的物流、用能等成本，用好失业保险稳岗返还等政策稳定企业用工，对生产经营出现暂时困难的企业给予倾斜支持。加强对小微企业、民营企业和科技创新领域的信贷支持，降低实体经济融资成本。外贸政策要着力优化融资、结算、外汇等金融服务，扩大出口信用保险承保规模和覆盖面，推动内外贸一体化发展，加快解决标准认证、市场渠道等方面问题，支持企业开拓多元化市场。\n持续营造公平有序的市场竞争环境。公平竞争是市场经济的基本原则，也是激发企业活力的重要保障。要完善公平竞争审查制度，强化制度刚性约束，及时清理妨碍全国统一大市场建设和公平竞争的政策措施。健全涉企收费长效监管机制，规范涉企行政执法，防止多头检查、重复检查、过度检查。综合整治“内卷式”竞争，加强反垄断和反不正当竞争执法司法，依法治理低价无序竞争、虚假宣传、侵犯知识产权等行为。强化企业特别是“链主”企业社会责任，引导企业自觉抵制不正当竞争行为，构建良性的产业链上下游协同关系。加强质量、标准和品牌引领，支持企业把重心放在技术创新、服务提质上，推动形成优质优价、优胜劣汰、良性竞争的市场秩序。\n着力增强企业自身发展能力。企业发展活力强不强，根本上要靠企业内功练得好不好。要引导广大企业家传承和弘扬企业家精神，坚守主业、做强实业，增强创新能力和核心竞争力。坚持诚信守法，树牢法治意识、契约精神、守约观念，做到依法经营、依法治企、依法维权。努力拓展国际视野，提高把握国际市场动向和需求特点的能力，提高把握国际规则、开拓国际市场和防范国际市场风险的能力。各类企业要从各自实际出发，主动对标中国特色现代企业制度要求，完善法人治理结构，强化风险管控机制，提升合规经营水平，推进企业治理现代化，力争建设世界一流企业。","organized_by":"rule"},{"id":17,"title":"在纪念孙中山先生诞辰160周年大会上的讲话","column_name":"重要讲话","publish_date":"2026-11-13","source":"重要讲话","source_url":"http://jhsjk.people.cn/article/40833131?isindex=1","core_view":"今天，我们隆重集会，纪念孙中山先生诞辰160周年，缅怀他为民族独立、社会进步、人民幸福建立的不朽功勋，学习、继承、发扬他的宝贵精神，激励海内外全体中华儿女为以中国式现代化全面推进强国建设、民族复兴伟业而团结奋斗。","golden_sentences":["孙中山先生对人民怀有深厚感情，认为“国家之本，在于人民”，誓言“图谋民生幸福”，笃信革命“就是要除去人民的那些忧愁”。","今天，我们对孙中山先生最好的纪念，就是学习、继承、发扬他的宝贵精神，把强国建设、民族复兴伟业不断推向前进。","——孙中山先生一生追求真理，我们学习、继承、发扬他的宝贵精神，就要坚持“两个结合”、不断推进实践基础上的理论创新。","他的统一战线政策同三民主义政治纲领、艰苦奋斗精神一道，被毛泽东同志称赞为“留给我们的最中心最本质最伟大的遗产”。","两岸同胞以及海内外全体中华儿女要携起手来，共同反对“台独”分裂势力，共同为两岸关系和平发展、实现祖国完全统一而努力。","孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱。"],"argument_structure":"全文由事及理提出观点，“问题—对策”结构；递进升华（不仅……更……），最后收束于启示与行动。","topics":["cultural_confidence","law_enforcement"],"writing_angles":["以“文化自信是更基础更广泛更深厚的自信”立论","从“中华优秀传统文化创造性转化”切入","用“讲好中国故事”作升华，联系文化出海"],"summary":"今天，我们隆重集会，纪念孙中山先生诞辰160周年，缅怀他为民族独立、社会进步、人民幸福建立的不朽功勋，学习、继承、发扬他的宝贵精神，激励海内外全体中华儿女为以中国式现代化全面推进强国建设、民族复兴伟业而团结奋斗。孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱。","original_content":"今天，我们隆重集会，纪念孙中山先生诞辰160周年，缅怀他为民族独立、社会进步、人民幸福建立的不朽功勋，学习、继承、发扬他的宝贵精神，激励海内外全体中华儿女为以中国式现代化全面推进强国建设、民族复兴伟业而团结奋斗。\n孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱。他出生的那个年代，我们的国家正遭受西方列强的野蛮侵略和封建专制的腐朽统治，中华民族陷入内忧外患的深重苦难。面对山河破碎、风雨飘摇，英雄的中国人民从未屈服，无数仁人志士奋起抗争，苦苦探求救国救民道路。孙中山先生就是他们当中的杰出代表。\n孙中山先生“致力国民革命凡四十年”，殚精竭虑、呕心沥血，为改造中国奋斗一生，为中国人民和中华民族作出杰出贡献。他高举反对封建专制统治的旗帜，提出民族、民权、民生的三民主义政治纲领，率先喊出“振兴中华”的响亮口号。他广泛传播革命思想，连续发动武装起义，推动了革命大势的形成。他领导的辛亥革命推翻统治中国几千年的君主专制制度，打开中国进步潮流的闸门，建立起亚洲第一个共和制国家，深刻推动了中国社会变革，为实现中华民族伟大复兴探索了道路。他受十月革命和马克思列宁主义影响，在中国共产党帮助下，把旧三民主义发展为新三民主义，实行联俄、联共、扶助农工三大政策，改组中国国民党，推动北伐战争取得胜利，把反帝反封建的民主革命推向前进。\n孙中山先生的杰出贡献永载史册，他在中国人民心中享有崇高威望，受到海内外全体中华儿女由衷景仰。今天，中国人民正在意气风发推进中国式现代化建设，实现中华民族伟大复兴进入不可逆转的历史进程。此时此刻，回顾孙中山先生的革命生涯，缅怀他的丰功伟绩，我们心中更是充满深深的崇敬之情。\n中国共产党人是孙中山先生革命事业最坚定的支持者、最忠诚的合作者、最忠实的继承者。100多年来，我们党领导人民创造了新民主主义革命、社会主义革命和建设、改革开放和社会主义现代化建设、新时代中国特色社会主义的伟大成就，书写了中华民族几千年历史上最恢宏的史诗。孙中山先生当年关于未来中国建设的很多构想，在《建国方略》中描绘的筑铁路、铺公路、开通讯、兴水利、凿运河、修港口、建厂矿等一系列宏伟蓝图，不仅早已成为现实，而且比他构想和描绘的更为丰富和宏阔。现在，我们伟大的祖国巍然屹立于世界东方，经济总量稳居世界第二，人民生活实现全面小康，中华民族迎来了从站起来、富起来到强起来的伟大飞跃，正在为人类社会发展进步不断作出新的贡献。这一切，完全可以告慰孙中山先生的英灵。\n100多年来，孙中山先生“振兴中华”的口号鼓舞了一代又一代中国人，不断被赋予新的时代意义和内涵。今天，我们对孙中山先生最好的纪念，就是学习、继承、发扬他的宝贵精神，把强国建设、民族复兴伟业不断推向前进。\n——孙中山先生一生爱国救国，我们学习、继承、发扬他的宝贵精神，就要高扬爱国主义精神、奋力实现祖国繁荣富强。孙中山先生怀有“决以一身奋斗报我国家”的强烈爱国热情，认为“做人的最大事情”就是“要知道怎么样爱国”，“发展之权，操之在我则存，操之在人则亡”，“拯救中国完完全全是我们自己的责任”。正是立志肩负这样的责任，为了“切扶大厦之将倾”，为了中国成为“世界上顶富强的国家”、“世界上顶安乐的国家”，他不懈奋斗了一生。\n新征程上，我们要坚持爱国和爱党、爱社会主义相统一，坚持党的全面领导和党中央集中统一领导，坚定中国特色社会主义道路自信、理论自信、制度自信、文化自信，激励海内外全体中华儿女不断厚植爱国情怀、砥砺强国之志，把中国式现代化胜利推向前进，共同把伟大祖国建设得更加美好。\n——孙中山先生一生心系民众，我们学习、继承、发扬他的宝贵精神，就要始终坚持人民至上、全心全意为人民服务。孙中山先生对人民怀有深厚感情，认为“国家之本，在于人民”，誓言“图谋民生幸福”，笃信革命“就是要除去人民的那些忧愁”。他指出：“人民所做不到的，我们要替他们去做；人民没有权利的，我们要替他们去争。”他强调“三民主义是为人民而设的”，主张“平均地权”、“节制资本”，致力实现“人人享受经济上平等之幸福，而无不均之患”，为了中国人民成为“世界上顶享幸福的人民”，劳碌奔波了一生。\n新征程上，我们要牢记江山就是人民、人民就是江山，站稳人民立场、把握人民愿望、尊重人民创造、集中人民智慧，发展全过程人民民主，保障和改善民生，让现代化建设成果更多更公平惠及全体人民，推动人的全面发展、全体人民共同富裕迈出坚实步伐。\n——孙中山先生一生追求真理，我们学习、继承、发扬他的宝贵精神，就要坚持“两个结合”、不断推进实践基础上的理论创新。孙中山先生年少就有“穷天地之想”的志向，一直广泛学习先进知识和有益思想成果，以“适乎世界之潮流，合乎人群之需要”。投身革命后，他清醒认识到“欲收革命之成功，必有赖于思想之变化”，积极从革命实践中探寻真理，努力完善自己的革命理念和斗争方略，为了推动“中国问题的真解决”，艰辛执着探求了一生。\n新征程上，我们要坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，勇于进行理论探索和创新，科学回答中国之问、世界之问、人民之问、时代之问，与时俱进丰富和发展新时代中国特色社会主义思想，不断谱写马克思主义中国化时代化新篇章。\n——孙中山先生一生百折不挠，我们学习、继承、发扬他的宝贵精神，就要勇于攻坚克难、依靠顽强斗争打开事业发展新天地。孙中山先生的革命生涯屡经挫折、备尝艰辛，但他一直坚持“吾志所向，一往无前，愈挫愈奋，再接再厉”，以“穷途之困苦所不能挠”的果敢坚毅，同逆时代潮流而动的各种势力坚决斗争，不为外来威胁、内部分裂、暂时失败所动摇，展现出坚定革命意志和大无畏英雄气概。他在弥留之际仍念念不忘“和平、奋斗、救中国”，真正做到了生命不息、奋斗不止。\n新征程上，我们要统筹国内国际两个大局，统筹发展和安全，发扬斗争精神，增强斗争本领，不惧怕任何困难，不屈服于任何敌人，随时准备经受风高浪急甚至惊涛骇浪的重大考验，全力战胜前进道路上各种风险挑战，不断夺取新时代伟大斗争新胜利。\n——孙中山先生一生倡导团结，我们学习、继承、发扬他的宝贵精神，就要坚持统一战线、持续巩固和发展全体中华儿女大团结。孙中山先生在推动革命中一直强调“革命事业由民众发之，亦由民众成之”。他致力于“唤起民众”，四处奔走，冲破多方阻挠、利用各种机会向国内民众和海外华侨华人宣传革命主张，吸引更多人支持革命事业，广泛联合各方力量“取同一步调，以国家百年大计为重，努力奋争”。他的统一战线政策同三民主义政治纲领、艰苦奋斗精神一道，被毛泽东同志称赞为“留给我们的最中心最本质最伟大的遗产”。\n新征程上，我们要始终坚持大团结大联合，团结一切可以团结的力量，调动一切可以调动的积极因素，促进政党关系、民族关系、宗教关系、阶层关系、海内外同胞关系和谐，巩固和发展最广泛的爱国统一战线，凝聚起推进中国式现代化的磅礴力量。\n——孙中山先生一生胸怀天下，我们学习、继承、发扬他的宝贵精神，就要大力弘扬全人类共同价值、积极推动构建人类命运共同体。孙中山先生以宽广视野看待中国和世界的关系，既把中国革命置于整个时代，又在世界潮流中审视中国发展。他强调，中国如果强盛起来，“还要对于世界负一个大责任”；他预言，一旦革新中国的伟大目标得以完成，“整个人类也将得以共享更为光明的前景”。他把“天下为公”视为“人类进化之目的”、“人类所希望”，主张实行“开放主义”，注重文明互鉴但决不“随西方文明之旧路径而行”。\n新征程上，我们要始终以世界眼光关注人类前途命运，从人类发展大潮流、世界变化大格局、中国发展大历史正确认识和处理同外部世界的关系，弘扬和平、发展、公平、正义、民主、自由的全人类共同价值，积极推动落实四大全球倡议，为构建人类命运共同体作出中国贡献。\n孙中山先生始终坚定维护国家统一、民族团结，坚决反对一切分裂国家、分裂民族的言论和行为。他强调“中国是一个统一的国家”，疾呼“‘统一’是中国全体国民的希望”，表示“将运用我所有的影响力以努力于国家的统一”。他对祖国统一的强烈愿望和坚定意志，一直启迪、教育、鼓舞着全体中华儿女。\n在中华文明5000多年的历史长河中，国土不可分、国家不可乱、民族不可散、文明不可断，始终是铭刻在全体中华儿女骨子里的共同信念。解决台湾问题、实现祖国完全统一，是中国共产党矢志不渝的历史任务，是全体中华儿女的共同愿望，是实现中华民族伟大复兴的必然要求。\n海峡两岸同胞都是中国人，是血脉相连、血浓于水的一家人。一家人相处，只要有话好好说、有事多商量，就没有化解不了的矛盾分歧。长期以来，我们秉持“两岸一家亲”理念，持续深化两岸交流融合，增进两岸同胞福祉。面向未来，我们坚持“和平统一、一国两制”方针，在坚持一个中国原则和“九二共识”的基础上，愿意同台湾各界有识之士就两岸关系和国家统一开展对话协商。我们一定会充分考虑台湾现实情况、充分照顾台湾同胞利益和感情，但我们绝不会为各种形式的“台独”分裂活动留下任何空间。\n台湾的前途在于国家统一，台湾同胞的利益福祉系于中华民族伟大复兴。两岸同胞以及海内外全体中华儿女要携起手来，共同反对“台独”分裂势力，共同为两岸关系和平发展、实现祖国完全统一而努力。历史潮流不可阻挡，祖国完全统一一定要实现，一定能够实现！\n以中国式现代化全面推进强国建设、民族复兴伟业，是中国共产党和中国人民的新长征，也是实现孙中山先生“振兴中华”理想的必由之路。我呼吁，海内外全体中华儿女更加紧密地团结起来，继承孙中山先生的遗志，同心协力共襄中华民族伟大复兴盛举，不断把近代以来我国各族人民孜孜以求的伟大梦想变成美好现实！\n《 人民日报 》（ 2026年11月13日 02 版）\n人 民 网 版 权 所 有 ，未 经 书 面 授 权 禁 止 使 用\nCopyright © 1997-2025 by www.people.com.cn. all rights reserved\n京ICP备12004265号-1","organized_by":"rule"},{"id":16,"title":"耕耘希望田野 共建和美乡村","column_name":"评论","publish_date":"2026-11-13","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202611/13/content_30190987.html","core_view":"“十五五”开局之年，做好“三农”工作至关重要。","golden_sentences":["“农业机械化是把人、机、地、服务打通的关键一环。","“农业现代化，关键是农业科技现代化，特别是要推进农业机械化。","“国产智能农机让播种更快、更准，东方红拖拉机正是其中的‘主力军’。","秋收不仅要抢时间、赶进度，还要尽可能减少损失。","”胡爱国坦言，经过商讨，村里把议事会搬到庭院田头，议题从群众诉求里收集，坚持议而有决、结果会上通报。","“十五五”开局之年，做好“三农”工作至关重要。"],"argument_structure":"全文由事及理提出观点，递进升华（不仅……更……），最后收束于启示与行动。","topics":["rural_revitalization"],"writing_angles":["以“粮食安全是国之大者”立论，论证底线思维与长远谋划","从“产业兴旺”切入，写活乡村全面振兴的路径","用“农民的获得感”作为落脚点，体现以人民为中心"],"summary":"“十五五”开局之年，做好“三农”工作至关重要。习近平总书记强调，“农业农村现代化关系中国式现代化全局和成色”“仍然以乡村振兴、‘三农’工作的发展作为中国式现代化的底座”。近日，新华社记者赴江西、湖北、河南、黑龙江等地，从农业生产的田间一线到农产品加工的车间仓库，感受广袤田野的生机与和美乡村的气象。","original_content":"“十五五”开局之年，做好“三农”工作至关重要。习近平总书记强调，“农业农村现代化关系中国式现代化全局和成色”“仍然以乡村振兴、‘三农’工作的发展作为中国式现代化的底座”。\n近日，新华社记者赴江西、湖北、河南、黑龙江等地，从农业生产的田间一线到农产品加工的车间仓库，感受广袤田野的生机与和美乡村的气象。\n新华社11月12日推出第三十八期“中国经济圆桌会”大型全媒体访谈节目，邀请农业农村部农村经济研究中心主任赵长保、黑龙江省农业农村厅副厅长朱华生、第一拖拉机股份有限公司副总工程师王东青、湖北省襄阳市枣阳市东郊村党支部书记胡爱国，结合基层新变化新趋势，共话“十五五”开局之年“三农”发展新图景。\n抗灾夺丰收  守牢粮食安全基本盘\n丰收时节，广袤田野上，收获的喜悦与秋冬种生产的忙碌交织，铺展成一幅幅热气腾腾的画卷——\n江西吉水县枫江镇积富村，收割机正加紧抢收稻谷。刚腾出的地块，翻耕机随即进场，为冬油菜整地、开沟。“这几年，县里帮着完善了农田灌排设施，田管也跟上去了，我家晚稻每亩收获了1200斤。”当地种粮大户刘松说。\n千里之外的东北大地，玉米、水稻、大豆已抢收完毕。黑龙江黑河市爱辉区等不少地方，作物收获后，大马力拖拉机配套翻地犁同步开展秸秆全量翻埋还田作业，深翻深松后的黑土将更好地蓄水保墒，为来年春播蓄足地力。\n粮食安全是“国之大者”，“十五五”开局之年的丰收来之不易。\n“从全国来看，今年秋粮生产经受住了灾害考验，总体形势是比较好的，丰收基础比较扎实。”赵长保说。\n在参加圆桌会的嘉宾们看来，今年我国秋收呈现出一些鲜明特点：\n防灾减灾工作更加主动——\n赵长保说，面对复杂多变的天气形势，农业农村部门更加注重把工作做在灾害发生之前。今年农业农村部组织开展了奋战100天强田管抗灾害夺秋粮丰收行动，并且加强与气象、水利、应急管理等部门的会商研判，及时指导各地落实抗灾减灾措施。\n科技增产作用更加突出——\n近几年，我国持续推进粮油作物大面积单产提升，推动良田、良种、良机、良法集成应用，合理密植、精量播种、一喷多促、水肥一体化等先进技术模式逐步得到推广，为提高粮食单产、增强稳产能力提供了有力支撑。\n“黑龙江粮食产量连续两年保持在1600亿斤以上，今年有望再创历史新高。”朱华生说，当地累计建成高标准农田1.25亿亩；选育了高油高产大豆、耐密宜机收玉米、优良食味水稻等一批突破性新品种，主要农作物良种基本全覆盖；重点支持发展大型、高端、智能农机，农作物耕种收综合机械化率达99.34%；系统推广大垄密植和水肥一体化技术；组织全省8.8万个新型农业经营主体，带动小农户参与大面积单产提升。\n胡爱国介绍，东郊村地处鄂北岗地，是“旱包子”上的“旱尖子”。这些年通过挖堰塘、修坝堤，发展节水农业，粮食产量一年高过一年。今年村里种植的水稻优良品种亩产能超过1500斤。\n机械化和社会化服务的保障作用更加明显——\n秋收不仅要抢时间、赶进度，还要尽可能减少损失。如内蒙古粮食播种面积稳定在1亿亩以上，当地累计投入各类农机具超1.9万台套，1710个农机作业主体开展社会化服务。“我们的农业生产正在从单纯重视田间增产，向增产、减损、提质并重转变。”赵长保说。\n“农业机械化是把人、机、地、服务打通的关键一环。”王东青表示，中国一拖致力于向市场提供成套的农机装备和全程机械化解决方案，支持农业社会化服务组织从单一作业向耕、种、管、收全程服务延伸，带动农资、农技、金融等综合服务，携手各方把产业底盘做扎实。\n据农业农村部最新农情调度，截至目前，全国秋粮收获过九成，丰收已成定局。加上夏粮和早稻，全年粮食产量有望连续3年保持在1.4万亿斤以上。\n科创强支撑  激活农业新质生产力\n农业机械化是激活农业新质生产力的重要载体，也是推进农业农村现代化的重要标志。\n春播时，自动导航辅助驾驶拖拉机挂载高性能播种机，在万亩大地号上来回穿梭；夏管时，大载荷植保无人机均匀洒药；秋收时，一排排联合收割机集中连片作业……\n黑土地上智能农机的广泛应用，让朱华生深有感触。“农业现代化，关键是农业科技现代化，特别是要推进农业机械化。”朱华生说，当前，黑龙江正在大力实施“人工智能+农业”行动，推动传统农机向高端、智能农机飞跃，加快建设大型大马力高端智能农机装备研发制造推广应用先导区。\n今年10月在天津举行的2026中国国际农业机械展览会上，中国一拖发布了一款智能拖拉机车载操作智能体，通过智能体引导机手作业、给出作业参数建议，相当于为每台拖拉机配上一名全能驾驶助手。\n“国产智能农机让播种更快、更准，东方红拖拉机正是其中的‘主力军’。”王东青说，从1958年新中国第一台拖拉机下线，到如今动力换挡、无级变速、混合动力机型接连量产，中国一拖正以持续攻坚，推动国产农机的“颜值”和“功力”双双提升。\n中国一拖的奋进探索，是近年来农业科技创新突破的生动缩影。数字技术蓬勃发展的当下，人工智能、物联网等正与农业深度融合，推动农业农村现代化加速发展。\n“过去我们种地，很大程度上是‘看天、看地、看经验’；现在是开始‘看数据、看算法、看屏幕’。”赵长保说，目前，农村互联网普及率提升至69.5%，农业生产信息化率平均每年增长约2个百分点。\n田垄之上，装备、品种、农艺、数字技术同频发力，科技成为实实在在的丰收底气，护航农业农村现代化加速前行。\n“东郊村的发展，离不开年轻人的扎根参与。”胡爱国说，随着外出务工人员返乡创业，近年来村里把有文化、懂技术、头脑活的年轻人组织起来，通过专业培训培养成新型职业农民，让他们在农村广阔天地施展才华、展现作为。\n返乡大学生运用智能农机、物联网检测、水肥一体化等新技术、新装备发展现代农业，成为增收致富带头人；种粮大户成立农民专业合作社，大面积种植有机油菜，服务高端市场，带动一批年轻人参与产销对接和品牌经营……\n越来越多的乡村人才成长起来，运用科技力量推动乡村产业提质增效，以农业新质生产力为乡村全面振兴注入新动能。\n融合促发展  绘就乡村幸福新图景\n产业振兴是乡村振兴的重中之重。\n在湖北洪湖市，一根莲藕长成富民产业；在河南禹州市大涧村，红薯从地头进入深加工车间，加工成酸辣粉、粉皮等，在直播间供不应求……近年来各地因地制宜发展特色产业，为乡村发展注入更多活力。\n朱华生说，依托自然禀赋和资源优势，黑龙江打造“黑土优品”省级优质农业品牌，促进定制农业与文旅、创意、服务等深度融合，推动优质农产品实现从“种得好”向“卖得好”整体跃升，也带动了农民增收致富。\n东郊村的发展同样是农民群众日子更有奔头的注脚。胡爱国说，多年前村里还是一片黄土岗，为闯出增收路子，村干部组织党员、村民和专家研讨改良品种，逐渐打造出千亩优质良田、千亩生态桃园和千亩养殖水面的格局，形成了“春赏桃花、夏摘皇桃、秋观稻浪、冬品河鲜”的四季产品体系，村里还大力发展乡村休闲旅游。\n乡村是农业生产的空间载体。村庄环境干净整洁，村民议事机制不断完善……一件件民生实事，让农民群众的获得感、幸福感不断增强，绘就宜居宜业和美乡村幸福图景。\n“在群众议事机制落地运行上，我们村里也曾走过弯路——干部安排的事，群众冷眼旁观。”胡爱国坦言，经过商讨，村里把议事会搬到庭院田头，议题从群众诉求里收集，坚持议而有决、结果会上通报。群众看到建言管用后，参与议事更加主动。随着议事成果一件件落地，邻里互助的新风日益浓厚。\n“十五五”规划纲要提出，加快农业农村现代化，扎实推进乡村全面振兴。王东青表示，未来中国一拖将抓住产业数字化、智能化变革新机遇，更好助力农业增效益、农民增收入、农村增活力。\n把握新机遇，携手共前行。新征程上，亿万人民辛勤耕耘、不懈奋斗，扎实推进乡村全面振兴，让希望的田野不断焕发新活力，奋力奔赴农业农村现代化更加美好的未来。\n（据新华社北京11月12日电）\n耕耘希望田野  共建和美乡村\n——“中国经济圆桌会”共话“三农”发展新图景","organized_by":"rule"},{"id":18,"title":"把丰收的底气攒得更足","column_name":"人民时评","publish_date":"2026-11-12","source":"人民日报","source_url":"https://paper.people.com.cn/rmrb/pc/content/202611/12/content_30190820.html","core_view":"沃野千里，麦浪翻滚，稻菽飘香；田间地头，收割机往来穿梭；","golden_sentences":["看似寻常的田间工程，关键时刻就是保收成的“压舱石”。","保护种粮积极性，既要帮农民降本增效，也要让售粮渠道更顺畅、粮款及时到手。","从底线维度看，越是连年丰收，越要看清丰收背后的不确定性。","端牢饭碗，靠的是平时把基础打实，而不是临渴掘井、临时找粮。","农业现代化，既是在回答怎样“稳定粮食产量”，也是在回答如何“提升农业综合生产能力和质量效益”。","习近平总书记强调：“保障粮食等重要农产品稳定供给是农业生产的重中之重。"],"argument_structure":"全文由事及理提出观点，分层论证（从底线、发展、民生等多个维度展开）；“问题—对策”结构，最后落脚到时代主题与价值升华。","topics":["rural_revitalization"],"writing_angles":["以“粮食安全是国之大者”立论，论证底线思维与长远谋划","从“产业兴旺”切入，写活乡村全面振兴的路径","用“农民的获得感”作为落脚点，体现以人民为中心"],"summary":"沃野千里，麦浪翻滚，稻菽飘香；田间地头，收割机往来穿梭；仓储库点，烘干、入库有序衔接。时下，秋粮收获稳步推进。“十五五”开局之年，各方携手应对冬小麦大面积晚播、暴雨洪涝等重重挑战，夏粮产量首破3000亿斤、早稻实现稳产，秋粮生产总体向好、丰收在望。","original_content":"沃野千里，麦浪翻滚，稻菽飘香；田间地头，收割机往来穿梭；仓储库点，烘干、入库有序衔接。时下，秋粮收获稳步推进。“十五五”开局之年，各方携手应对冬小麦大面积晚播、暴雨洪涝等重重挑战，夏粮产量首破3000亿斤、早稻实现稳产，秋粮生产总体向好、丰收在望。\n“丰”景如画，令人欣喜，也引人思考：粮食连年丰收，为何还要年年抓紧？这里面，有应对不确定性的考量，有高质量发展的谋划，有民生账本的关切。\n从底线维度看，越是连年丰收，越要看清丰收背后的不确定性。农业生产有周期，误了农时难以补回，地力受损难以速复。百年变局加速演进，国际环境复杂多变，粮食安全不能寄望于外部市场始终平稳、自然条件始终有利。端牢饭碗，靠的是平时把基础打实，而不是临渴掘井、临时找粮。\n一条沟渠，能掂量出未雨绸缪的分量。在湖北宜城市高康村，种植大户邹凯的稻田经过高标准农田改造，机耕路加宽硬化，灌排条件改善。今年遇上连阴雨，打开闸门就能顺畅排水，农田几乎没有遭受损失。看似寻常的田间工程，关键时刻就是保收成的“压舱石”。\n这提醒我们，不能只在受灾时想起水利、抢收时想起烘干。把耕地保护、地力提升、良种选育、农机装备维护和防灾减灾能力建设抓在日常，才能把一次次应对风险的经验，沉淀为更稳定的生产能力。\n从发展维度看，毫不放松抓好粮食生产，也是在拓展高质量发展的空间。要看到农业发展中技术进步、产业升级的潜力。良种良法配套，让同一亩地产出更多更好的粮食；社会化服务铺开，让小农户也能用上先进技术；加工、仓储、物流衔接贯通，让一粒粮食在产业链上不断增值。\n农业现代化，既是在回答怎样“稳定粮食产量”，也是在回答如何“提升农业综合生产能力和质量效益”。从这方面来说，农业成为扩大内需、带动县域经济发展的新增长点。抓粮食，本身就是抓发展。\n从民生维度看，粮食丰收了，产业链拉长了，农民的收益才能持续提升。种粮要支付农资、人工等成本，还要承担天气和市场风险。保护种粮积极性，既要帮农民降本增效，也要让售粮渠道更顺畅、粮款及时到手。因此，毫不放松抓好粮食生产，既要在产量上常抓不懈，也要在保障农民种粮收益上下足功夫。\n从各地筹集秋粮收购资金，确保“钱等粮”而非“粮等钱”，到完善价格、补贴、保险等支持政策，再到推动优粮优价、健全联农带农机制……让农民有合理收益、有稳定预期，才能激发种粮人的干劲，多种粮、种好粮，让下一季生产更有动力。\n习近平总书记强调：“保障粮食等重要农产品稳定供给是农业生产的重中之重。”丰收时节，秋收与秋种接续，今天与明天相连。毫不放松抓好粮食生产，要看到成绩，还要懂得成绩从何而来、怎样延续。把产能基础夯得更实，把发展空间拓得更宽，把农民收益护得更好，年年丰收的底气就会攒得更足。","organized_by":"rule"},{"id":19,"title":"增强党性是全面从严治党的根本性任务","column_name":"学习贯彻党的二十届五中全会精神","publish_date":"2026-11-10","source":"共产党员网","source_url":"https://www.12371.cn/2026/11/10/ARTI1794272808705415.shtml","core_view":"党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》（以下简称《决定》），全面贯彻习近平新时代中国特色社会主义思想特别是习近平党建思想，突出强调“增强党性是全面从严治党的根本性任务”，并对增强共产党人的党性作出重要部署，充分体现了我们党对新时代全面从严治党特点和规律的深刻把握，抓住了管党治","golden_sentences":["强调党性是党员、干部立身、立业、立言、立德的基石，讲政治最根本就是要讲党性。","对党忠诚不能停留在一般性要求上，必须是绝对的，也就是唯一的、彻底的、无条件的、不掺任何杂质的、没有任何水分的。","（一）这是坚守马克思主义政党本质属性、保持党的先进性和纯洁性的应有之义。","党性是马克思主义政党本质属性的集中体现，是党的性质宗旨对党员的根本要求。","1941年《中共中央关于增强党性的决定》提出，“应当在党内更加强调全党的统一性、集中性和服从中央领导的重要性”，“使全党能够团结得像一个人一样”。","1980年《关于党内政治生活的若干准则》指出，“派性同无产阶级的党性是根本不相容的”，要“坚持党性，根绝派性”。"],"argument_structure":"全文由事及理提出观点，“问题—对策”结构；递进升华（不仅……更……），最后收束于启示与行动。","topics":["law_enforcement"],"writing_angles":["从“治理效能”切入，论证制度优势如何转化为基层治理实效","以“为民服务”为价值主线，构建“问题—原因—对策”的分论点","把“作风建设”作为破题点，落到干部担当与群众获得感"],"summary":"党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》（以下简称《决定》），全面贯彻习近平新时代中国特色社会主义思想特别是习近平党建思想，突出强调“增强党性是全面从严治党的根本性任务”，并对增强共产党人的党性作出重要部署，充分体现了我们党对新时代全面从严治党特点和规律的深刻把握，抓住了管党治党、兴党强党的关键和要害。","original_content":"党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》（以下简称《决定》），全面贯彻习近平新时代中国特色社会主义思想特别是习近平党建思想，突出强调“增强党性是全面从严治党的根本性任务”，并对增强共产党人的党性作出重要部署，充分体现了我们党对新时代全面从严治党特点和规律的深刻把握，抓住了管党治党、兴党强党的关键和要害。\n一、增强共产党人的党性事关党的性质宗旨、事业兴衰成败\n习近平总书记指出，中国共产党人的坚强党性，是我们党保持先进性和纯洁性、提高领导水平和执政能力的重要保证；强调党性是党员、干部立身、立业、立言、立德的基石，讲政治最根本就是要讲党性。我们要充分认识增强党性的极端重要性和紧迫性，深刻把握蕴含其中的理论逻辑、历史逻辑、实践逻辑。\n（一）这是坚守马克思主义政党本质属性、保持党的先进性和纯洁性的应有之义。党性是马克思主义政党本质属性的集中体现，是党的性质宗旨对党员的根本要求。列宁指出，严格的党性是使阶级斗争成为自觉的、明确的、有原则的斗争的条件之一。毛泽东同志强调，党性是共同的性质、普遍的性质，全党每一个人都有的性质。党的先进性不仅要体现在党的理论和路线方针政策上，还要通过党的各级组织和党员的实际行动来体现，只有党的每个组成部分都有坚强党性，才能保证党的整体的先进性。同时，党的先进性不是一劳永逸、一成不变的，党性也不会随着党龄的增加、职务的升迁而自然提高。必须毫不放松增强党性，坚决同一切影响党的先进性、弱化党的纯洁性的问题作斗争，确保党员是有共产主义觉悟的先锋战士，确保我们党始终成为时代先锋、民族脊梁，永远不变质不变色不变味。\n（二）这是巩固党的团结统一、汇聚攻坚克难磅礴力量的内在要求。100多年来，我们党始终高度重视增强党性，有力保证了全党思想上的统一、政治上的团结、行动上的一致。1929年古田会议确立了思想建党、政治建军原则，纠正和肃清各种非无产阶级思想。1941年《中共中央关于增强党性的决定》提出，“应当在党内更加强调全党的统一性、集中性和服从中央领导的重要性”，“使全党能够团结得像一个人一样”。1954年《关于增强党的团结的决议》强调，“党的团结的唯一中心是党的中央”，“反对任何妨碍中央统一领导、损害中央的团结和威信的言论和行动”。1980年《关于党内政治生活的若干准则》指出，“派性同无产阶级的党性是根本不相容的”，要“坚持党性，根绝派性”。党的十八大以来，以习近平同志为核心的党中央把党性问题作为党的建设的根本性问题，突出加强党的政治建设，先后9次开展党内集中教育，坚持党性党风党纪一起抓，以“中国共产党之治”引领保障了“中国之治”。新时代新征程，要把坚定拥护“两个确立”、坚决做到“两个维护”作为最重要的党性要求，毫不动摇坚持党的全面领导和党中央集中统一领导，众志成城克难关、战风险、迎挑战，朝着强国建设、民族复兴的宏伟目标奋勇前进。\n（三）这是有效解决党内存在的突出问题、不断实现党的自我净化自我完善自我革新自我提高的固本之策。新时代管党治党、兴党强党取得伟大成就，开辟了百年大党自我革命新境界。同时，要清醒看到，党面临的“四大考验”和“四种危险”是长期的、复杂的、严峻的，思想不纯、组织不纯、作风不纯问题尚未根本解决，少数党员、干部包括高级干部党性不强，理想信念动摇甚至缺失，群众感情淡薄，政绩观出现偏差，形式主义、官僚主义、享乐主义和奢靡之风严重，斗争精神不足，不担当不作为，不守纪律规矩，甚至以权谋私、腐化堕落。党员、干部出现的种种问题，包括作风问题、政绩观问题、贪腐问题，归根到底都是党性问题。这就要求我们从党性这个根上抓起、严起，纠偏治乱、激浊扬清、固本培元，不断把党建设得更加坚强有力。\n（四）这是适应党的队伍结构性变化、巩固党的长期执政地位的现实需要。现在，改革开放后出生的党员、干部比例越来越大。截至2025年底，1亿多党员中45岁及以下的占43.8%，大专及以上学历的占59%；干部队伍中60后陆续退休，70后、80后已经成为主体，90后逐步成长起来。年轻同志普遍接受过高等教育，思维活跃、视野开阔、精力充沛，但相对缺乏严格的党内政治生活锻炼和大风大浪考验，党性问题日益凸显。加之世界百年未有之大变局加速演进，数字化、网络化、智能化快速发展，各种思想和价值观念交织碰撞，意识形态领域斗争尖锐复杂，如果不重视增强党性，就会有祸起萧墙、堡垒从内部被攻破的危险。要针对党的队伍的状况和特点，有的放矢地加强党性锤炼，引导党员、干部传承红色基因、勇担时代重任，始终做到不畏浮云遮望眼、乘风破浪不迷航。\n二、深刻领会把握增强党性的基本内涵和实践要求\n《决定》提出，必须推动全体党员、干部增强党的意识、党员意识、先锋队意识，在坚定理想信念、铸牢对党忠诚、厚植为民情怀、坚持实事求是、纯正道德品质、保持清正廉洁等方面下功夫。这凝练概括了共产党人的党性要求，是加强党性修养必须把握的重要着力点。\n（一）坚定理想信念。习近平总书记指出，革命理想高于天，理想信念是中国共产党人的精神支柱和政治灵魂。有了坚定理想信念，才能坚持正确政治方向，经得住各种考验；没有理想信念，或者理想信念不坚定，就会成为庸俗的功利主义者和精致的利己主义者，甚至导致政治上变质、经济上贪婪、道德上堕落、生活上腐化。坚定理想信念，就要牢记中国共产党是什么、要干什么这个根本问题，补足精神之钙，坚定对马克思主义的信仰、对共产主义的信念、对中国特色社会主义的信心，做到虔诚而执着、至信而深厚。\n（二）铸牢对党忠诚。对党忠诚是共产党人首要的政治品质，对党不忠诚就半点党性也没有。党章规定党员必须“对党忠诚老实，言行一致”，入党誓词中就有“对党忠诚”、“永不叛党”的要求。对党忠诚不能停留在一般性要求上，必须是绝对的，也就是唯一的、彻底的、无条件的、不掺任何杂质的、没有任何水分的。有的党员、干部顺风顺水时表现还可以，一旦遇到沟沟坎坎就心生杂念、打小算盘，就不能说是绝对忠诚。铸牢对党忠诚，就要始终把党摆在心头正中，忠诚党的信仰、忠诚党的组织、忠诚党的事业，铁心跟党走、九死而不悔，任何时候任何情况下都不改其心、不移其志、不变其节。\n（三）厚植为民情怀。党性和人民性从来都是一致的、统一的。我们党根基在人民、血脉在人民、力量在人民，始终代表最广大人民根本利益，没有任何自己特殊的利益，从来不代表任何利益集团、权势团体、特权阶层的利益。以百姓心为心，与人民同呼吸、共命运、心连心，是党的初心，也是党的恒心。厚植为民情怀，就要牢记江山就是人民、人民就是江山，搞清楚“我是谁、为了谁、依靠谁”，树立和践行正确政绩观，走好新时代党的群众路线，用心用情解决群众急难愁盼问题，不断实现人民对美好生活的向往。\n（四）坚持实事求是。习近平总书记指出，共产党人是唯物主义者，务实是必备品格，也是成事之要，讲实话、干实事最能检验和锤炼党性。一些党员、干部出这样那样的问题，很多是立场走偏、动机不纯，也有的主观愿望是好的，但方法不对头，以致好心办了坏事。只有一切从实际出发，按客观规律办事，敬畏历史、敬畏文化、敬畏生态，才能创造经得起实践、人民、历史检验的实绩。坚持实事求是，就要把干事热情和科学精神结合起来，察实情、出实招、求实效，力戒形式主义、官僚主义，在真抓实干中不断打开事业发展新天地。\n（五）纯正道德品质。我们党一路走来，涌现出无数先进模范。从张思德、雷锋、焦裕禄，到谷文昌、杨善洲、孔繁森，再到这些年“七一勋章”获得者，他们用大公无私、拼搏奉献的实际行动，生动展现了共产党人的党性光辉。共产党人拥有人格力量，才能树立形象、赢得民心；如果修身不严、失德失范，就配不上共产党员这个光荣称号。纯正道德品质，就要正心明道、怀德自重，涵养政治品德、职业道德、社会公德、家庭美德，努力做一个高尚的人、一个纯粹的人、一个有道德的人、一个脱离了低级趣味的人、一个有益于人民的人。\n（六）保持清正廉洁。公生明，廉生威。党员、干部以身作则、廉洁自律，群众就会赞许你、拥护你、追随你，反之就会痛恨你、反对你、疏远你。党的十八大以来，以习近平同志为核心的党中央以雷霆之势正风肃纪反腐，锲而不舍落实中央八项规定精神，坚定不移“打虎”、“拍蝇”、“猎狐”，党风政风和社会风气焕然一新，党心军心民心高度凝聚。清则正气充盈，廉则百毒不侵。保持清正廉洁，就要勤掸“思想尘”，多思“贪欲害”，常破“心中贼”，清清白白做人、干干净净做事、规规矩矩履职，永葆共产党人政治本色。\n三、把增强党性的要求落实到全面从严治党各方面全过程\n增强党性是党的建设的永恒课题，也是党员、干部的终身课题。要按照《决定》部署，扎实推动增强党性任务举措的落实落地，引导党员、干部在常修常炼中加强党性修养、提升境界觉悟。\n（一）坚持把对党忠诚摆在党性修养的突出位置，推动全党坚定拥护“两个确立”、坚决做到“两个维护”。增强党性，从根本上说是解决好立场问题，做到政治上绝对可靠、对党绝对忠诚。要强化对党忠诚教育，教育引导党员、干部深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”，始终在思想上政治上行动上同以习近平同志为核心的党中央保持高度一致。要强化组织观念和宗旨意识，教育引导党员、干部在党爱党、在党言党、在党忧党、在党为党，相信组织、依靠组织、服从组织，坚持人民至上、事业第一，为党和人民积极工作。要加强政治历练，教育引导党员、干部提高政治判断力、政治领悟力、政治执行力，不折不扣贯彻落实党中央决策部署。要严明党的政治纪律和政治规矩，决不允许搞“七个有之”，坚决反对思想上的自由主义、政治上的投机主义、组织上的宗派主义、工作上的本位主义、履责上的好人主义，准确识别、坚决清除两面人，持续净化党内政治生态。\n（二）始终把学习、领悟、运用党的创新理论作为加强党性修养的根本途径，坚持用习近平新时代中国特色社会主义思想凝心铸魂。政治上的成熟、党性上的坚强，源于理论上的清醒。要加强马克思主义学习型政党建设，丰富理论学习教育方式，突出党的创新理论在教育培训中的主课地位，引导党员、干部读原著、学原文、悟原理，筑牢理想根基，锤炼政治品格，解决好世界观、人生观、价值观这个总开关问题。要弘扬马克思主义学风，推动党员、干部运用党的创新理论分析和解决实际问题，深入学习贯彻习近平党建思想，做到学思用贯通、知信行统一。要坚持和完善“第一议题”制度，提高党委（党组）理论学习中心组学习和基层党组织理论学习质量，深化党的创新理论体系化学理化研究阐释，更好推动全党统一思想、统一意志、统一行动。\n（三）用党的优良传统和中华优秀传统文化涵养党性，赓续共产党人精神血脉。党的优良传统和中华优秀传统文化是加强党性修养的精神富矿。要深化党史、新中国史、改革开放史、社会主义发展史教育，弘扬以伟大建党精神为源头的中国共产党人精神谱系。要挖掘用好中华优秀传统文化，深化政德教育，引导党员、干部明大德、守公德、严私德，培养家国情怀，涵养浩然正气。要加强和改进新形势下思想政治工作，发挥党校（行政学院）、干部学院在党性教育中的重要作用，增强针对性实效性。\n（四）注重实际斗争考验和党内政治生活淬炼，在实践中锤炼党性。增强党性是具体的、实践的，需要靠实实在在的修养和历练。要推动党员、干部在贯彻落实党中央决策部署、完成急难险重任务、应对重大风浪考验中锤炼党性，在处理是和非、公和私、得和失等关系中磨砺党性。要落实党内政治生活准则，用好批评和自我批评武器，加强党性分析，增强党内政治生活的政治性、时代性、原则性、战斗性。要坚持集中教育和经常教育相结合，发挥先进典型榜样作用，引导党员、干部见贤思齐、创先争优。\n（五）加强党性鉴别，树立讲党性、重党性、强党性的鲜明导向。党性不是抽象的、空洞的，而是可衡量、可检验的。要把党性作为干部考察和党员民主评议的重要内容，重点了解和评议境界格局和忠诚度廉洁度。要健全组织部门与纪检监察机关和巡视巡察、审计、信访等部门沟通机制，对领导班子成员、拟提拔干部、年轻干部等进行党性综合分析研判。要注重从应对挑战、抵御风险、克服困难、解决矛盾的表现识别党性，从日常工作、个人言行、社会交往、家教家风研判党性，通过听上级评价、同级互评、下级反映、群众口碑等了解党性。要用好党性鉴别结果，让党性坚强的人受褒奖、受重用，让党性不强的人受警醒、受惩戒，使讲党性、重党性、强党性在全党蔚然成风。\n2.打开浏览器访问即可下载文件\n京ICP备12024993号-1","organized_by":"rule"},{"id":20,"title":"始终把生态环境保护挺在前头","column_name":"求是","publish_date":"2026-11-04","source":"求是网","source_url":"https://www.qstheory.cn/20261104/819b0f478fde47c2a43c17c53dfef680/c.html","core_view":"2026年10月16日，习近平总书记在内蒙古乌兰察布市考察时，强调要统筹高质量发展和高水平保护，坚持山水林田湖草沙一体化保护和系统治理，协同推进降碳、减污、扩绿、增长，坚定不移走生态优先、绿色发展之路。","golden_sentences":["把生态环境保护挺在前头，是立足内蒙古国家战略定位、服务全国发展大局的必然要求，蕴藏着深厚的历史逻辑、理论逻辑与实践逻辑。","我们需要从理论层面把握好系统思维、根本价值立场与科学工作方法，并处理好其辩证关系。","始终把生态环境保护挺在前头，既是落实习近平总书记对内蒙古各族干部群众的殷切嘱托，更是内蒙古必须扛起的重大政治责任。","把生态环境保护挺在前头，既有明确的价值取向，也是一套完备的实践方略。","第二，必须把握“以人民为中心”价值立场。","始终把生态环境保护挺在前头，在历史逻辑、理论逻辑与实践逻辑中把握其必然性"],"argument_structure":"全文由事及理提出观点，层层展开论证，最后收束于启示与行动。","topics":["green_development"],"writing_angles":["以“绿水青山就是金山银山”立论，论证生态优先","从“双碳目标”切入，写绿色转型与高质量发展协同","把“生态惠民”作为落脚点，体现民生温度"],"summary":"2026年10月16日，习近平总书记在内蒙古乌兰察布市考察时，强调要统筹高质量发展和高水平保护，坚持山水林田湖草沙一体化保护和系统治理，协同推进降碳、减污、扩绿、增长，坚定不移走生态优先、绿色发展之路。“十五五”开局起步阶段，也是内蒙古推动高质量发展、加快闯新路的关键时期，习近平总书记专程到乌兰察布市考察，饱含着以习近平同志为核心的党中央对内蒙古各族干部群众的深切关怀和深情厚爱，为内蒙古坚定不移走","original_content":"2026年10月16日，习近平总书记在内蒙古乌兰察布市考察时，强调要统筹高质量发展和高水平保护，坚持山水林田湖草沙一体化保护和系统治理，协同推进降碳、减污、扩绿、增长，坚定不移走生态优先、绿色发展之路。“十五五”开局起步阶段，也是内蒙古推动高质量发展、加快闯新路的关键时期，习近平总书记专程到乌兰察布市考察，饱含着以习近平同志为核心的党中央对内蒙古各族干部群众的深切关怀和深情厚爱，为内蒙古坚定不移走生态优先、绿色发展之路指明了前进方向、提供了根本遵循、注入了强大动力。\n始终把生态环境保护挺在前头，在历史逻辑、理论逻辑与实践逻辑中把握其必然性\n把生态环境保护挺在前头，是立足内蒙古国家战略定位、服务全国发展大局的必然要求，蕴藏着深厚的历史逻辑、理论逻辑与实践逻辑。\n从历史逻辑来看，党的十八大以来，习近平总书记4次考察内蒙古、5次参加全国人代会内蒙古代表团审议，作出系列重要讲话重要指示，始终高度关切内蒙古生态文明建设事业。从2014年考察时提出“要努力把内蒙古建成我国北方重要的生态安全屏障”，到2021年参加内蒙古代表团审议时明确“统筹山水林田湖草沙系统治理，这里要加一个‘沙’字”，再到2023年考察时强调“筑牢我国北方重要生态安全屏障，是内蒙古必须牢记的‘国之大者’”，总书记对生态优先、绿色发展的要求始终是一以贯之的。此次在乌兰察布市提出“统筹高质量发展和高水平保护”，“协同推进降碳、减污、扩绿、增长”，正是这一要求在内蒙古新发展阶段的进一步确证与具象化。\n从理论逻辑来看，这一原则植根于习近平生态文明思想的理论根基与价值指向。习近平生态文明思想是新时代生态实践的价值标尺，立足于对人与自然关系的客观认知与价值选择，植根于对历史的理性认识与价值反思，是一套完整的理论建构与方法论体系，集成了实践理念、实践目标、实践方法、实践方案、实践策略与实践路径等核心要素，本质上要求在处理人与自然关系时，把尊重自然、顺应自然、保护自然摆在优先位置。习近平总书记强调，“良好生态环境是最公平的公共产品，是最普惠的民生福祉”。把生态环境保护挺在前头，说到底就是把保障最普惠的民生福祉摆在突出位置，把回应人民群众对优美生态环境的现实诉求作为出发点和落脚点，在保护与发展的动态平衡之中推进美丽内蒙古建设，实现人与自然和谐共生的现代化。\n从实践逻辑来看，内蒙古地处祖国北疆，横跨“三北”，肩负着建设我国北方重要生态安全屏障的重大使命。特殊的战略定位，决定了内蒙古绝对不能走以牺牲生态换取短期经济增长的旧式发展道路。坚持把生态环境保护挺在前头，筑牢我国北方重要生态安全屏障，既能够守牢国家生态安全底线，也可以为地区高质量发展积蓄动能，为各族群众安居乐业夯实生存发展根基。\n始终把生态环境保护挺在前头，把握生态治理的系统性、人民性与科学性的辩证关系\n把生态环境保护挺在前头，既有明确的价值取向，也是一套完备的实践方略。我们需要从理论层面把握好系统思维、根本价值立场与科学工作方法，并处理好其辩证关系。\n第一，必须恪守“生命共同体”系统治理理念。人与自然构成了不可分割的生命整体。内蒙古集森林、草原、湿地、河流、湖泊、沙漠等多元自然形态为一体，并历经长期演化形成了复合生态系统。因此，内蒙古走高质量发展之路，必须统筹好保护与发展的关系，以综合治理、系统治理、源头治理的整体思维践行山水林田湖草沙一体化保护和系统治理。尊重生态系统内部整体性和关联性规律，客观审视生态系统各类构成要素的关系，推动实现山上山下、地上地下、流域上下游协同一体的系统性保护修复。\n第二，必须把握“以人民为中心”价值立场。开展生态治理，根本目的在于维护各族人民群众的切身利益。新时代我区各族人民群众对美好生态环境的需要日益增长。内蒙古要坚持以生态惠民、生态利民、生态为民为导向，深入持久实施蓝天、碧水、净土保卫战，始终把提升人民群众获得感、幸福感摆在突出位置，让良好生态转化为全民共享的公共产品，让各族人民群众依托绿水青山共享改革发展成果，过上更加富足美好的生活。\n第三，必须用好“科学施策”工作方法论。生态治理属于复杂的系统工程，应当牢固树立系统观念，聚焦重点领域攻坚，坚持一切从地域实际出发，因地制宜。面对复杂多变的生态本底条件，既要严守以水定绿、以水定地、以水定人、以水定产的原则，将水资源约束作为刚性前提，也要因地制宜推广经过实践检验的治理模式，做到由点及面、标本兼顾，坚决摒弃形式主义、教条主义，杜绝脱离现实、华而不实的治理举措。\n生态治理的系统性、人民性、科学性之间辩证统一，三者相互支撑、互为条件，共同构成把生态环境保护挺在前头原则的内在逻辑。系统性是生态治理的认识前提，推动保护修复由单一分散向全域协同转变；人民性是生态治理的价值归宿，决定生态保护为了谁、依靠谁、成果由谁共享；科学性则是把系统治理理念和人民立场转化为治理效能的关键，要求尊重自然规律和社会发展规律，三者结合形成实践合力，为筑牢我国北方重要生态安全屏障提供坚实支撑。\n始终把生态环境保护挺在前头，以生态优先引领高质量发展实践\n坚持把生态环境保护挺在前头的实践原则，最终要转化为实实在在的行动举措，并接受具体实践成效的检验。内蒙古要在以下几个方面务实笃行、狠抓落实。\n推进山水林田湖草沙一体化保护和系统治理。要抓实抓细黄河流域、“一湖两海”、察汗淖尔、黄旗海等重点区域生态修复治理工作，全力攻坚“三北”工程攻坚战三大标志性战役，协同推进降碳、减污、扩绿、增长各项任务；要严守生态保护红线，坚持自然恢复为主、人工修复为辅的原则，科学有序修复退化受损生态系统，不断提升生态系统质量和稳定性，维护区域生物多样性和生态系统的整体性，筑牢我国北方重要生态安全屏障。\n统筹高水平保护同高质量发展协同共进。绿色发展本身就是高质量发展的内在组成部分。要立足绿电资源、气候条件、区位条件等比较优势，遵循高效、绿色、安全发展准则推动算力产业提质升级，扎实推进算电协同、算水协同，延伸并完善上下游产业链条，把算力资源禀赋转化为现实发展优势，加强数字经济和实体经济深度融合，为我国加快培育和发展新质生产力贡献内蒙古力量。\n树立和践行正确政绩观，因地制宜推动区域高质量发展。正确政绩观要求坚决摒弃“简单以GDP增长率论英雄”的考核惯性，不以牺牲生态换取短期增长，不搞急功近利的“政绩工程”。同时把生态保护置于发展评价的突出位置，真正认识到生态保护和建设也是政绩。要立足自身资源禀赋和比较优势，持续提升国家重要农畜产品生产基地建设水平，做大做强农畜产品精深加工产业，打通产销对接渠道，带动农牧民稳定增收，推动生态产业化和产业生态化良性循环。\n坚持党的全面领导，凝聚起全社会团结奋斗的强大合力。要坚定把铸牢中华民族共同体意识贯穿生态兴区的全过程与各环节，以民族团结为纽带调动各族群众的力量共同参与生态治理；持之以恒推进全面从严治党，夯实基层党组织政治功能与组织功能，以高质量党建保障高质量发展，涵养风清气正的政治生态，确保各项决策部署落地生根、见到实效。\n生态兴则文明兴。始终把生态环境保护挺在前头，既是落实习近平总书记对内蒙古各族干部群众的殷切嘱托，更是内蒙古必须扛起的重大政治责任。在推动高质量发展、加快闯新路的关键时期，内蒙古将把总书记的关怀和厚爱转化为拼搏的动力，坚定不移走生态优先、绿色发展之路，在祖国北疆构筑起更为坚固的万里绿色长城，不断丰富和拓展习近平新时代中国特色社会主义思想“内蒙古篇”，奋力书写中国式现代化的内蒙古答卷。\n本文系国家社科基金西部项目“习近平生态文明思想在内蒙古的贯彻与实践研究”(24XKS001)的成果\n（作者单位：卢艳芹，内蒙古生态文明研究基地、内蒙古自治区中国特色社会主义理论体系研究中心；梁乐，内蒙古大学马克思主义学院）","organized_by":"rule"},{"id":21,"title":"吉林以省级示范班为牵引加强党员教育培训 坚持政治引领 分级分类施训","column_name":"党员教育","publish_date":"2026-10-28","source":"共产党员网","source_url":"https://www.12371.cn/2026/10/28/ARTI1793153638193581.shtml","core_view":"2026年以来，吉林聚焦学习贯彻习近平新时代中国特色社会主义思想首要任务，以分领域举办12期省级党员教育培训示范班为牵引，推动理论教育系统化、能力培养精准化、培育方法实战化、贯通联动一体化，不断提升党员教育培训质效。","golden_sentences":["注重典型引路，深化“学习身边榜样”活动，以榜样力量激励党员奋力担当作为、笃行不怠。","邀请“七一勋章”获得者吴亚琴开展访谈式教学，近距离为城市社区党员传授社区工作法，把实事做到群众心坎上。","突出“干而论道”，选派16名先进典型、基层干部讲政策、教方法，深入镇村、企业、新兴领域一线实践教学。","举办全省国有企业基层党务工作者培训示范班，重点深入讲授国有企业党建工作、如何与企业经营管理深度融合等内容。","邀请全国劳动模范韩丽现场分享实践经验，组织农村党员交流抓党建促乡村振兴、发展乡村产业等实招。","坚持体现鲜明实践导向，提升教学内容、方式、环节的关联度和融合度。"],"argument_structure":"全文开门见山提出观点，层层展开论证，最后收束于启示与行动。","topics":["law_enforcement"],"writing_angles":["从“治理效能”切入，论证制度优势如何转化为基层治理实效","以“为民服务”为价值主线，构建“问题—原因—对策”的分论点","把“作风建设”作为破题点，落到干部担当与群众获得感"],"summary":"2026年以来，吉林聚焦学习贯彻习近平新时代中国特色社会主义思想首要任务，以分领域举办12期省级党员教育培训示范班为牵引，推动理论教育系统化、能力培养精准化、培育方法实战化、贯通联动一体化，不断提升党员教育培训质效。将党的创新理论作为首课、必修课，贯穿培训全过程各方面，组织读原著、学原文、悟原理，系统讲授《习近平党建文选》《习近平关于树立和践行正确政绩观论述摘编》等。","original_content":"2026年以来，吉林聚焦学习贯彻习近平新时代中国特色社会主义思想首要任务，以分领域举办12期省级党员教育培训示范班为牵引，推动理论教育系统化、能力培养精准化、培育方法实战化、贯通联动一体化，不断提升党员教育培训质效。\n将党的创新理论作为首课、必修课，贯穿培训全过程各方面，组织读原著、学原文、悟原理，系统讲授《习近平党建文选》《习近平关于树立和践行正确政绩观论述摘编》等。深入学习领会习近平总书记关于东北全面振兴和吉林工作的系列重要指示精神，综合运用专题授课、研讨交流、案例解读等方式教学，用好习近平总书记视察吉林6条精品教学路线，开展“追循足迹学思想、牢记嘱托担使命”现场教学，深学细悟真理力量、循迹体悟实践伟力。\n针对农村、城市社区、机关、事业单位、企业、新兴领域6个领域特点，细化到每个领域党员和党员教育工作者2类重点培训对象，深入开展训前需求调研，注重将强理论与增本领有机统一，完善科学精准差异化教学设计，优化培训主题和内容。比如，举办全省边境地区农村骨干党员培训示范班，设置国门边境戍边、边境村产业培育等专题理论课和实践课；举办全省国有企业基层党务工作者培训示范班，重点深入讲授国有企业党建工作、如何与企业经营管理深度融合等内容。\n注重典型引路，深化“学习身边榜样”活动，以榜样力量激励党员奋力担当作为、笃行不怠。邀请“七一勋章”获得者吴亚琴开展访谈式教学，近距离为城市社区党员传授社区工作法，把实事做到群众心坎上。邀请全国劳动模范韩丽现场分享实践经验，组织农村党员交流抓党建促乡村振兴、发展乡村产业等实招。\n坚持体现鲜明实践导向，提升教学内容、方式、环节的关联度和融合度。用好红色资源，依托吉林杨靖宇干部学院、省级党性教育现场教学点，采取重温入党誓词、重走抗联路、品读红色家书等形式，开展继承和发扬党的优良传统和作风教育、东北抗联精神教育。突出“干而论道”，选派16名先进典型、基层干部讲政策、教方法，深入镇村、企业、新兴领域一线实践教学。坚持教育者先受教育，举办全省党员教育工作者队伍建设培训示范班，实行教练评一体化教学模式，模拟实景开展教学演练，现场点评参训学员成果。\n强化省级统筹指导，年初制定全年省级党员教育专题培训示范班计划，纳入全省党员、干部教育培训整体安排，为各级分类开展党员教育提供指导参考。举办全省党员教育工作业务培训班，作为12期示范培训的首班，“省主课堂+各地分课堂”视频直播直达乡镇（街道）、基层一线，促进上下协同贯通。每期示范班同步选调部分市、县党委组织部负责党员教育培训工作的干部参训，从培训设计、组织和保障全流程作出示范，层层带动落实。把分级分类开展党员教育培训，作为贯彻落实党员教育培训工作规划重点任务，纳入高质量发展政绩考核体系。\n2.打开浏览器访问即可下载文件\n京ICP备12024993号-1","organized_by":"rule"},{"id":22,"title":"雪域羌塘党旗红——西藏那曲各级党组织和党员干部奋战抗震救灾一线","column_name":"党旗在基层一线高高飘扬","publish_date":"2026-10-26","source":"共产党员网","source_url":"https://www.12371.cn/2026/10/26/ARTI1792984886762320.shtml","core_view":"10月22日22时33分许，西藏那曲市巴青县发生7.0级地震。震区平均海拔近4800米，夜间温度低、高寒缺氧、余震频发，那曲市各级党组织和广大党员干部第一时间响应，迎难而上，冲锋在前，用心守护群众平安，为灾区群众筑起坚不可摧的红色堡垒。","golden_sentences":["”索朗旺加说：“地震后，驻村工作队及时安全转移所有群众，搭建了帐篷、拉了电线、分发了柴火，把我们照顾得特别好。","市卫生健康委党组第一时间启动市、县、乡三级医疗救治应急响应，139名党员医务人员组成医疗救援队紧急驰援灾区。","索县组派400余名党员干部先遣队，冒着余震、滚石、滑坡、塌方危险挺进灾区，为灾区群众运送帐篷、棉被、棉大衣等物资。","10月22日22时33分许，西藏那曲市巴青县发生7.0级地震。","在临时安置点推行“一帐篷一标牌、一帐篷一干部”包联机制，实行包联干部对负责的帐篷包人头清、包安全查、包需求办、包情绪稳“四包”，做到群众找得到人、干部对得上户。","震区乡镇、村（居）党员干部、驻村工作队、普通党员就地转化为抢险救灾队伍，迅速开展灾情核查、搜救排险、伤员救治、群众转移安置等工作，让党旗在抢险救灾一线高高飘扬。"],"argument_structure":"全文由事及理提出观点，层层展开论证，最后收束于启示与行动。","topics":["law_enforcement"],"writing_angles":["从“治理效能”切入，论证制度优势如何转化为基层治理实效","以“为民服务”为价值主线，构建“问题—原因—对策”的分论点","把“作风建设”作为破题点，落到干部担当与群众获得感"],"summary":"10月22日22时33分许，西藏那曲市巴青县发生7.0级地震。震区平均海拔近4800米，夜间温度低、高寒缺氧、余震频发，那曲市各级党组织和广大党员干部第一时间响应，迎难而上，冲锋在前，用心守护群众平安，为灾区群众筑起坚不可摧的红色堡垒。","original_content":"10月22日22时33分许，西藏那曲市巴青县发生7.0级地震。震区平均海拔近4800米，夜间温度低、高寒缺氧、余震频发，那曲市各级党组织和广大党员干部第一时间响应，迎难而上，冲锋在前，用心守护群众平安，为灾区群众筑起坚不可摧的红色堡垒。\n面对灾情，那曲市委组织部第一时间下发紧急通知，动员各级党组织和党员干部紧急行动、挺膺担当，在抗震救灾大战大考中亮身份、作表率、践初心、担使命。第一时间将习近平总书记和党中央的关心关怀传达到灾区群众中，紧急从代市委管理的党费中划拨100万元，用于慰问受灾困难党员、群众和战斗在一线的党员干部和群众，坚定党员干部群众战胜困难险阻的信心和决心。\n第一时间派出工作组赶赴灾区，积极参与抗震救灾工作，协助巴青县35个集中安置点设立临时党支部，统筹整合机关下沉干部、驻村队员、村干部、医护人员等力量，驻点开展情绪疏导、心理安抚、老幼托管、医疗救治等暖心服务，做到群众看得到党旗、遇事情找得到党员。在临时安置点推行“一帐篷一标牌、一帐篷一干部”包联机制，实行包联干部对负责的帐篷包人头清、包安全查、包需求办、包情绪稳“四包”，做到群众找得到人、干部对得上户。\n市县两级同步联动，组建党员突击队、党员先锋队、党员志愿服务队奔赴地震重灾区、物资转运点、集中安置区开展清障抢险、物资运送、帐篷搭建、御寒衣物及食品饮水分发工作。震区乡镇、村（居）党员干部、驻村工作队、普通党员就地转化为抢险救灾队伍，迅速开展灾情核查、搜救排险、伤员救治、群众转移安置等工作，让党旗在抢险救灾一线高高飘扬。\n巴青县玛如乡迅速启动应急处置预案，党员干部全员到岗到位，不惧居住分散、部分区域断网断电等复杂情况，履行分片包保责任，下沉网格，逐区域核查灾情，逐点位排查风险。索县组派400余名党员干部先遣队，冒着余震、滚石、滑坡、塌方危险挺进灾区，为灾区群众运送帐篷、棉被、棉大衣等物资。\n中国邮政那曲分公司组织40余名党员组建突击队，震后半小时内调集16辆邮车、装卸搬运物资8200余件，奔赴300多公里，直达重灾区。市交通运输系统党员干部连夜开展抢险救援和道路排查，统筹投入货运车辆、客运车辆、机械，排查涵洞、桥梁、公路，消除隐患，保通交通干线。市卫生健康委党组第一时间启动市、县、乡三级医疗救治应急响应，139名党员医务人员组成医疗救援队紧急驰援灾区。\n巴青县玛如乡二村群众沙珠激动地说：“托共产党的福，我们都能搬进帐篷里，然后又发了生火炉、煤气灶和棉被，还给我们分发了食物。”索朗旺加说：“地震后，驻村工作队及时安全转移所有群众，搭建了帐篷、拉了电线、分发了柴火，把我们照顾得特别好。”\n2.打开浏览器访问即可下载文件\n京ICP备12024993号-1","organized_by":"rule"},{"id":23,"title":"习近平：在纪念中国工农红军长征胜利90周年大会上的讲话","column_name":"重要讲话","publish_date":"2026-10-22","source":"重要讲话","source_url":"https://www.12371.cn/2026/10/22/ARTI1792649104399392.shtml","core_view":"中共中央总书记、国家主席、中央军委主席习近平发表重要讲话。","golden_sentences":["历史雄辩地证明，革命理想、革命信念能够迸发出克顽敌、撼山岳的无穷力量，具有崇高理想和坚定信念的队伍是不可战胜的。","历史雄辩地证明，马克思主义基本原理只有同中国具体实际紧密结合，才能解决中国的问题，才能展现出强大生命力。","沿途群众深切感到“红军是工农群众自己的军队”，纷纷做军衣、筹粮款，冒死救伤员、送情报，很多人踊跃参军、生死相随。","就是紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗的精神。","——弘扬伟大长征精神、走好新的长征路，必须坚定不移推动高质量发展、不断满足人民日益增长的美好生活需要。","——弘扬伟大长征精神、走好新的长征路，必须加快把人民军队建成世界一流军队。"],"argument_structure":"全文由事及理提出观点，“问题—对策”结构，最后收束于启示与行动。","topics":["cultural_confidence","law_enforcement"],"writing_angles":["以“文化自信是更基础更广泛更深厚的自信”立论","从“中华优秀传统文化创造性转化”切入","用“讲好中国故事”作升华，联系文化出海"],"summary":"10月22日，纪念中国工农红军长征胜利90周年大会在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平发表重要讲话。今天，我们隆重集会，纪念中国工农红军长征胜利90周年。90多年前，我们的国家和民族内忧外患，日寇加紧对华侵略，国民党反动派向中国共产党领导的革命根据地接连发动大规模“围剿”。","original_content":"10月22日，纪念中国工农红军长征胜利90周年大会在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平发表重要讲话。\n今天，我们隆重集会，纪念中国工农红军长征胜利90周年。\n90多年前，我们的国家和民族内忧外患，日寇加紧对华侵略，国民党反动派向中国共产党领导的革命根据地接连发动大规模“围剿”。由于“左”倾教条主义在党内的错误领导，中央革命根据地第五次反“围剿”失败，其他革命根据地也遭受挫折，党和红军到了生死存亡的危急关头。\n在这样的严峻形势下，从1934年10月至1936年10月，我们党领导红军第一、第二、第四方面军和第二十五军，进行了震撼世界、彪炳史册的伟大长征。红军长征纵横十余省，长驱二万五千里，跨越近百条江河，翻越皑皑雪山，穿过茫茫草地，进行600余次战役战斗，粉碎上百万敌军围追堵截，宣告国民党反动派消灭中国共产党和红军的图谋彻底失败，胜利实现北上抗日的战略转移，成功开创了中国革命新局面。\n主力红军长征后，留在革命根据地的红军队伍和游击队、西北地区红军、东北抗日联军、国民党统治区的党组织以及党领导的其他各方面力量，在极端困难的环境中坚持斗争，都为长征胜利作出了不可磨灭的贡献。\n红军长征这一惊天动地的革命壮举，在我们党、国家、军队历史上具有伟大意义，对中华民族伟大复兴进程产生了深远影响。这一气壮山河的英雄史诗，永远镌刻在中国革命丰碑上，永远铭记在亿万人民心中。\n在这里，我代表党中央、国务院、中央军委，代表全党全军全国各族人民，向领导红军创造这一历史伟业的毛泽东、周恩来、朱德同志等老一辈革命家，向在长征中浴血奋战和在各地坚持革命斗争的红军指战员，向当年支援红军长征的各族人民特别是各革命根据地人民，向所有健在的红军老战士，致以崇高的敬意！\n我提议，全体起立，为在长征途中和在各地革命斗争中英勇牺牲的革命烈士默哀！\n我们重温历史，是为了汲取奋进的智慧和力量。90年后的今天，再次回望那段苦难辉煌，我们更加深刻认识到，长征胜利是必然的，其中蕴含着党和人民军队铿锵前进的制胜之道。\n——红军长征的伟大胜利之路，是依靠党的正确领导走出来的。长征初期，“左”倾路线的错误给党和红军造成极大损失。1935年1月，中央政治局举行遵义会议，事实上确立了毛泽东同志在党中央和红军的领导地位，开始确立以毛泽东同志为主要代表的马克思主义正确路线在党中央的领导地位，开始形成以毛泽东同志为核心的党的第一代中央领导集体，开启了党独立自主解决中国革命实际问题新阶段，在最危急关头挽救了党、挽救了红军、挽救了中国革命。遵义会议后，党和红军获得新的生命，一路闯关夺隘并战胜张国焘的分裂主义，最终取得长征胜利。历史雄辩地证明，党的正确领导和毛泽东同志核心地位的确立，对于红军长征胜利具有决定性意义。\n——红军长征的伟大胜利之路，是依靠坚定的革命意志走出来的。长征期间，面对异乎寻常的艰难曲折，党和红军信念如磐，在枪林弹雨中向死而生，在生存极限中绝境求生，在千锤百炼中浴火重生，展现出百折不挠、一往无前、英勇战斗、视死如归的崇高革命精神。用钢铁意志武装起来的共产党员和红军将士，挨饿受冻不拿群众一针一线，截掉伤腿还誓要爬到陕北，奏响了一曲曲感天动地的英雄凯歌。历史雄辩地证明，革命理想、革命信念能够迸发出克顽敌、撼山岳的无穷力量，具有崇高理想和坚定信念的队伍是不可战胜的。\n——红军长征的伟大胜利之路，是依靠独立自主、实事求是走出来的。长征的过程，也是我们党艰辛探索革命道路的过程。面对党内一度存在的把马克思主义教条化的错误倾向，面对“强渡湘江血如注，三军今日奔何处”的惨痛和迷茫，我们党在血的教训中深刻认识中国革命的规律，逐步摆脱教条主义束缚，开始独立自主、实事求是地解决路往哪里走、仗要怎么打等重大问题。正是在党的正确路线指引下，红军作战指挥实行了一系列符合实际、机动灵活的战略战术，从而成功突破敌人层层封锁，不断走向新生、走向胜利。历史雄辩地证明，马克思主义基本原理只有同中国具体实际紧密结合，才能解决中国的问题，才能展现出强大生命力。\n——红军长征的伟大胜利之路，是依靠广大人民群众支持走出来的。长征途中，党和红军所到之处秋毫无犯，一路打土豪、分田地、开仓放粮、救济穷苦百姓，以实际行动赢得群众、赢得民心。沿途群众深切感到“红军是工农群众自己的军队”，纷纷做军衣、筹粮款，冒死救伤员、送情报，很多人踊跃参军、生死相随。从“十送红军”的不舍、于都夜渡的守护，到“半条被子”的温暖、“彝海结盟”的誓言，无不生动诠释军民鱼水情深。长征一路走来，宣传了党的主张，播撒下革命火种，极大增强了党和红军的凝聚力战斗力。历史雄辩地证明，人民群众永远是党和人民军队的力量源泉和坚强后盾，只要我们深深植根人民、始终保持同人民群众的血肉联系，党的事业就无往而不胜。\n红军长征创造了非凡的人间奇迹，铸就了伟大长征精神。伟大长征精神，就是把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利的精神；就是为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲的精神；就是坚持独立自主、实事求是，一切从实际出发的精神；就是顾全大局、严守纪律、紧密团结的精神；就是紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗的精神。\n精神所在，就是力量所在。伟大长征精神充分彰显了忠诚的力量、真理的力量、正义的力量、团结的力量，它作为中国共产党人精神谱系的重要组成部分，跨越时空、历久弥新，永远是激励我们战胜困难、勇往直前的宝贵财富和强大动力。\n长征的历史从未远去，长征的路在不断延伸。长征胜利90年以来，党团结带领人民在革命、建设、改革各个历史时期进行了一次又一次伟大长征，夺取了一个又一个伟大胜利。\n党的十八大以来，中国特色社会主义进入新时代。经过全党全军全国各族人民共同努力，全面建成小康社会的第一个百年奋斗目标已如期实现，党和国家事业取得历史性成就、发生历史性变革，我们正在新征程上致力于全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。\n新征程是充满光荣和梦想的远征，是党和人民的新长征。抚今追昔、展望未来，我们要大力弘扬伟大长征精神，同心协力走好新的长征路。\n——弘扬伟大长征精神、走好新的长征路，必须坚守党的理想信念宗旨。理想信念宗旨是共产党人的“魂”，始终指引我们前进的方向。新征程上，我们要全面贯彻新时代中国特色社会主义思想，坚定对马克思主义的信仰、对社会主义和共产主义的信念，坚定道路自信、理论自信、制度自信、文化自信，牢记初心使命，坚持全心全意为人民服务的根本宗旨，紧紧依靠人民创造新的历史伟业。\n——弘扬伟大长征精神、走好新的长征路，必须坚定不移推动高质量发展、不断满足人民日益增长的美好生活需要。我们党立志于中华民族千秋伟业，首先要完成好新时代新征程党的使命任务。新征程上，我们要统筹推进“五位一体”总体布局，协调推进“四个全面”战略布局，完整准确全面贯彻新发展理念，加快构建新发展格局，坚持稳中求进工作总基调，推动经济实现质的有效提升和量的合理增长，促进社会全面进步，坚持发展为了人民、发展依靠人民、发展成果由人民共享，促进全体人民共同富裕。\n——弘扬伟大长征精神、走好新的长征路，必须勇于进行具有许多新的历史特点的伟大斗争。奔向理想的道路从来都不平坦，伟大胜利都是依靠顽强斗争取得的。新征程上，面对错综复杂的国际国内形势，我们要敢于斗争、善于斗争，不断增强全党全军全国各族人民的志气、骨气、底气，更好统筹发展和安全，随时准备经受风高浪急甚至惊涛骇浪的重大考验，以历史主动精神克难关、战风险、迎挑战，确保中华复兴号巨轮劈波斩浪、行稳致远。\n——弘扬伟大长征精神、走好新的长征路，必须加快把人民军队建成世界一流军队。人民军队永远是捍卫党和国家事业的钢铁长城。新征程上，我们要全面贯彻新时代党的强军思想，始终坚持党对人民军队的绝对领导，全面推进政治建军、改革强军、科技强军、人才强军、依法治军，推动人民军队赓续红色血脉、永葆纯洁本色，如期实现建军一百年奋斗目标，高质量推进国防和军队现代化，谱写无愧于革命前辈、无愧于百年基业、无愧于新时代的强军兴军新篇章。\n——弘扬伟大长征精神、走好新的长征路，必须坚持党的领导、加强党的建设。党的领导和党的建设是事业发展的根本保证。新征程上，我们要深入贯彻新时代党建思想，落实新时代党的建设总要求，坚持党的全面领导和党中央集中统一领导，持之以恒推进全面从严治党，不断实现党的自我净化、自我完善、自我革新、自我提高，持续增强党的政治领导力、思想引领力、群众组织力、社会号召力，确保党始终成为中国特色社会主义事业的坚强领导核心。\n铭记历史方能开创未来。全党全军全国各族人民要更加紧密地团结在党中央周围，大力弘扬伟大长征精神，接续奋斗、砥砺前行，把革命前辈开创的伟大事业不断推向前进，在新的长征路上奋力创造新的辉煌！\n2.打开浏览器访问即可下载文件\n京ICP备12024993号-1","organized_by":"rule"},{"id":29,"title":"以政策协同破解供强需弱矛盾","column_name":"《求是》杂志评论员","publish_date":"2026-10-15","source":"求是网","source_url":"https://www.qstheory.cn/20261015/9d952f955fd34b64bcc90ed192e0f523/c.html","core_view":"强化政策协同，发挥政策合力，是提高政策实施效能、做好经济工作的内在要求。","golden_sentences":["强化政策协同，发挥政策合力，是提高政策实施效能、做好经济工作的内在要求。","7月30日召开的中央政治局会议强调要高度重视经济运行中的困难挑战，对“加力扩大内需、优化供给”作出系统部署。","习近平总书记指出：“经济活动需要各种生产要素的组合在生产、分配、流通、消费各环节有机衔接，从而实现循环流转。","要把产业转型与促进就业结合起来，做好职业培训、就业服务和劳动者权益保障，增强产业发展的就业带动力。","”当前我国出现的供强需弱矛盾，是多重因素作用于这些环节的结果。","从流通看，地方保护、市场分割等阻碍资源要素流动的因素尚未完全消除，影响供需有效对接。"],"argument_structure":"全文开门见山提出观点，“问题—对策”结构；递进升华（不仅……更……），最后收束于启示与行动。","topics":["business_environment","industrial_upgrading"],"writing_angles":["从“有效市场+有为政府”切入，论证营商环境优化","以“高水平对外开放”为背景，写统一大市场与制度型开放","把“经营主体信心”作为观察窗口，落到稳预期政策"],"summary":"强化政策协同，发挥政策合力，是提高政策实施效能、做好经济工作的内在要求。今年以来，以习近平同志为核心的党中央牢牢把握扩大内需这一战略基点，坚持供需两侧协同发力，打出一系列政策“组合拳”，加快补上内需特别是消费短板，不断增强供给与需求的适配性、平衡性，有力推动我国经济持续向新向优向好发展。","original_content":"强化政策协同，发挥政策合力，是提高政策实施效能、做好经济工作的内在要求。今年以来，以习近平同志为核心的党中央牢牢把握扩大内需这一战略基点，坚持供需两侧协同发力，打出一系列政策“组合拳”，加快补上内需特别是消费短板，不断增强供给与需求的适配性、平衡性，有力推动我国经济持续向新向优向好发展。同时也要清醒看到，当前供强需弱矛盾仍然突出，破解供强需弱矛盾进而稳定经济运行仍然面临不少挑战。7月30日召开的中央政治局会议强调要高度重视经济运行中的困难挑战，对“加力扩大内需、优化供给”作出系统部署。各地区各部门要深入贯彻落实党中央决策部署，进一步加强政策协调配合和工作协同联动，把各方面力量凝聚起来，扎实做好各项工作，形成促进供需高水平动态平衡的合力，确保经济稳定运行。\n习近平总书记指出：“经济活动需要各种生产要素的组合在生产、分配、流通、消费各环节有机衔接，从而实现循环流转。”当前我国出现的供强需弱矛盾，是多重因素作用于这些环节的结果。从生产看，长期以来投资驱动形成的生产能力不断积累，但部分领域供给结构调整未能及时适应消费需求品质化、多样化的发展趋势，中低端供给过剩和优质供给短缺并存。从分配看，促进居民增收、优化收入分配的体制机制仍需完善，社会保障和基本公共服务还存在短板，制约了居民消费能力和意愿。从流通看，地方保护、市场分割等阻碍资源要素流动的因素尚未完全消除，影响供需有效对接。从消费看，部分居民受就业收入预期和家庭支出负担等因素影响，消费潜力尚未充分释放。由此可见，供强需弱矛盾涉及社会再生产全过程，其中既有总量问题，也有结构问题；既有短期问题，也有长期问题，是周期性、体制性、结构性因素相互交织、相互影响形成的，不可能单靠某一方面某一领域的政策加以解决。要深刻把握供强需弱矛盾的性质，坚持系统观念，把生产发展、分配改善、流通畅通和消费扩大贯通起来，加强政策制定和实施的系统性、整体性、协同性，坚决防止政策的“碎片化”、“分散化”和相互掣肘等问题，有效打通经济循环中的卡点堵点，努力实现国民经济良性循环。\n强化财政金融政策协同。财政具有扩大总需求和定向调结构的优势，金融能够为消费和投资提供资金支持，二者有效配合有利于放大政策效应。破解供强需弱矛盾，要实施好更加积极的财政政策和适度宽松的货币政策，统筹好财政政策和货币政策两类政策的总量匹配、结构平衡和节奏契合，提高二者在调控力度、时机等方面的协调程度，保持调控节奏和基调的一致性。优化实施财政金融协同促内需政策，组合运用贷款贴息、担保补偿等工具，通过财政资金牵引金融资源，降低融资成本，合理分担风险，促进居民消费，激发民间投资。优化财政支出安排，综合运用并适时调整货币政策工具，推出一批务实管用的增量政策，推动“十五五”规划、“六张网”实施方案等明确的重大工程项目尽早开工建设。\n强化宏观政策和改革举措协同。宏观政策重在逆周期调节、稳定经济大盘，但如果缺乏改革举措支撑，政策效应会逐步递减。改革创新致力于破除体制机制障碍、增强经济内生动力，但若没有政策托底稳定经济基本盘，改革也难以持续有效推进。破解供强需弱矛盾，既要加大逆周期调节力度，也要在合理引导消费、储蓄、投资等方面进行有效制度安排，实现短期宏观调控同中长期制度建设的有机结合。要形成促进居民收入稳步增长的体制机制，清理消费领域不合理限制措施，建立健全适应消费新业态新模式新场景的管理办法，充分释放消费潜力。深化投资审批制度改革，健全投融资体制机制，完善激发民间投资活力机制，形成市场主导的有效投资内生增长机制。加快形成同新质生产力更相适应的生产关系，建设现代化产业体系，增强供给体系对国内需求的适配性。纵深推进全国统一大市场建设，努力营造公平有序的市场竞争环境，推动资源配置实现效率最优化和效益最大化。\n强化经济发展和民生改善协同。经济发展是居民收入增长、消费水平提升的源泉，居民消费能力的增强又为经济发展提供更加强劲的内需主动力。破解供强需弱矛盾，必须把发展经济和改善民生有机统一起来，制定经济发展政策同步嵌入改善民生的要求，制定民生政策同步考虑促进经济发展的效应。当前，随着新旧动能加快转换，岗位结构和技能需求发生深刻变化，部分劳动者面临就业转岗和收入增长压力，公共服务和社会保障需要更好适应人口结构及就业形态变化。要把产业转型与促进就业结合起来，做好职业培训、就业服务和劳动者权益保障，增强产业发展的就业带动力。完善劳动者工资决定、合理增长、支付保障机制，推动劳动报酬提高与劳动生产率提高基本同步，使发展成果更好转化为居民消费能力。坚持投资于物和投资于人紧密结合，在满足教育、医疗、养老、托育等需求中拓展投资空间、创造就业机会，促进产业发展、居民增收和消费扩大良性互动。\n强化政策实施和预期引导协同。市场经济条件下，经济主体的决策和行为不仅受到现实经济条件的影响，更强烈受到其对未来预期的影响。经济主体预期稳、信心强，消费和投资等经济活动才会更加活跃。破解供强需弱矛盾，必须高度关注消费和投资行为背后的市场预期和社会心理变化，着力促进社会预期稳定向好，坚定社会发展信心。要把经济政策和非经济政策统一纳入宏观政策取向一致性评估，加强部门间有效沟通、协商反馈，统筹政策制定和执行全过程，防止出现“合成谬误”或“分解谬误”。做好政策的主动精准阐释，加强政策实施效果跟踪，及时回应企业和群众关切，增强政策透明度，减少政策误读空间，稳定企业投资经营和居民就业收入预期。坚持正确舆论导向，强化对外宣传和国际舆论引导，及时有效回击各种错误论调，唱好中国经济光明论。","organized_by":"rule"},{"id":28,"title":"文化根魂何以铸","column_name":"评论员观察","publish_date":"2026-10-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202610/15/content_30185803.html","core_view":"学习《习近平文化文选》第一卷、第二卷，能真切感悟习近平文化思想的鲜明立场、价值追求、实践伟力，以及蕴含其中的思想方法和工作方法。即日起，本版推出系列评论，与大家一起体悟真理力量、汲取经验智慧，为更好担负起新的文化使命凝心聚力。","golden_sentences":["正是在党的领导下，左翼文化运动取得文化反“围剿”斗争的胜利，让长征壮举冲破国民党的封锁，传向五洲四海。","把文化比作民族的“根”与“魂”，是中国共产党人独有的清醒和坚定。","今年国庆假期，在北京、西安两座城市之间切换，留下了难忘的“文旅记忆”。","“中华民族在几千年历史中创造和延续的中华优秀传统文化，是中华民族的根和魂。","习近平总书记深刻指出，“掌握思想领导是掌握一切领导的基础”。","回望那场“无与伦比的史诗般远征”，上海虽不是主战场，却是长征的文化传播枢纽。"],"argument_structure":"全文由事及理提出观点，层层展开论证，最后收束于启示与行动。","topics":["cultural_confidence"],"writing_angles":["以“文化自信是更基础更广泛更深厚的自信”立论","从“中华优秀传统文化创造性转化”切入","用“讲好中国故事”作升华，联系文化出海"],"summary":"学习《习近平文化文选》第一卷、第二卷，能真切感悟习近平文化思想的鲜明立场、价值追求、实践伟力，以及蕴含其中的思想方法和工作方法。即日起，本版推出系列评论，与大家一起体悟真理力量、汲取经验智慧，为更好担负起新的文化使命凝心聚力。","original_content":"学习《习近平文化文选》第一卷、第二卷，能真切感悟习近平文化思想的鲜明立场、价值追求、实践伟力，以及蕴含其中的思想方法和工作方法。即日起，本版推出系列评论，与大家一起体悟真理力量、汲取经验智慧，为更好担负起新的文化使命凝心聚力。\n——编  者\n今年国庆假期，在北京、西安两座城市之间切换，留下了难忘的“文旅记忆”。\n打卡燃灯塔、大光楼等地标，沉浸式体验“运上行”大运河水景诗乐演出，沿开放步道感受滨水之美……千年运河焕发新生、串联文脉，为北京城市副中心带来旺盛人气。\n看兵马俑、游华清宫、参观碑林，除了逛传统景区，还可欣赏各类演出，看《梦长安》复刻盛唐礼仪文化、《驼铃传奇》再现丝路壮阔……以文塑旅、以旅彰文，十三朝古都绽放时代新韵。\n这样的场景，正是“以文化滋养精神家园”的生动缩影，写照着“中华优秀传统文化得到创造性转化、创新性发展，文化事业日益繁荣”。\n“中华民族在几千年历史中创造和延续的中华优秀传统文化，是中华民族的根和魂。”文化根魂何以铸？\n“经济建设是党的中心工作，意识形态工作是党的一项极端重要的工作”；\n“中国共产党从成立之日起，既是中国先进文化的积极引领者和践行者，又是中华优秀传统文化的忠实传承者和弘扬者”；\n“我们党是具有高度文化自觉的马克思主义政党，始终站在时代前列，引领文化发展进步，带领人民走出了中国特色社会主义文化发展道路。这条道路最本质的特征，就是坚持党的领导”；\n…………\n深入学习《习近平文化文选》第一卷、第二卷，答案，就写在坚持和加强党的领导之中。\n习近平总书记深刻指出，“掌握思想领导是掌握一切领导的基础”。\n回望105年奋斗历程，我们党历来高度重视文化建设，以文化发展凝聚奋斗力量。\n譬如长征。回望那场“无与伦比的史诗般远征”，上海虽不是主战场，却是长征的文化传播枢纽。正是在党的领导下，左翼文化运动取得文化反“围剿”斗争的胜利，让长征壮举冲破国民党的封锁，传向五洲四海。\n新时代以来，文化建设在正本清源、守正创新中取得历史性成就，文化强国建设步履铿锵。\n今日中华大地，文化“火”起来、历史“活”起来，凝聚起更为主动的精神力量。\n世界遗产再添新员，“景德镇手工瓷业遗存”列入《世界遗产名录》，“千年瓷都”名片擦得更亮；\n平陆运河通江达海，不仅把百余年前《建国方略》中的设想变为现实，也让山水、滨海、人文景观串联成片，汇成流动的文旅长廊；\n丝绸、茶叶、瓷器、中药、酿造，历史经典产业在政策扶持下加速奔跑，“老字号”闯出新赛道……\n把文化比作民族的“根”与“魂”，是中国共产党人独有的清醒和坚定。“根”，向下扎进历史；“魂”，向上立起精神。\n新征程上，坚持和加强党的集中统一领导，守护“根”与“魂”，正是文化强国建设的“定盘星”。其伟力，迸发于文化创新创造，彰显于亿万人民热气腾腾、可感可及的日常。\n“外卖诗人”王计兵、“菜场作家”陈慧等草根创作者“出圈”，“新大众文艺”被写入《政府工作报告》。\n《给阿嬷的情书》《八仙！》《欢迎来龙餐馆》等叫好又叫座，电影市场新片焕彩、类型多元。\n微短剧用户规模超8亿、市场规模逾千亿元，网文、网剧、网游文化“新三样”扬帆出海。\n外国游客爱上深度“中国游”，“Chinamaxxing”（极致中国化）火爆海外社交媒体。\n亲历新时代伟大变革，更加深刻认识到，我国宣传思想文化事业之所以取得历史性成就，意识形态领域形势之所以发生全局性、根本性转变，根本在于“两个确立”，在于始终坚持党的领导。\n文运同国运相牵，文脉同国脉相连。\n高扬文化主体性，中华文化立得住、行得远；秉持开放包容，中华文明纳百川、成其大。\n以文明交流超越文明隔阂、文明互鉴超越文明冲突、文明共存超越文明优越，在中国共产党引领下，中国理念与智慧为世界注入稳定性力量。\n“新征程是新的长征。”进行具有许多新的历史特点的伟大斗争，既包括硬实力的斗争，也包括软实力的较量。\n更好担负起新的文化使命，建设中华民族现代文明，让中华文化绽放新的时代光彩，不断丰富和发展人类文明新形态，这是我们对历史最好的致敬，也是面向未来应有的担当。\n——赓续文脉启新程①","organized_by":"rule"},{"id":27,"title":"让更多中国故事跨越山海","column_name":"中国道路中国梦","publish_date":"2026-10-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202610/15/content_30185805.html","core_view":"中国网络文学在海外有多火？两次亲身经历，至今想起仍心头滚烫。","golden_sentences":["“传得广”，持续通过平台创新、技术升级与产业合作，让好故事不受限于语言、渠道和形态，规模化走向世界。","记得藏书仪式后，一名英国大学生告诉我，他追更这些小说已经好几年了，现在“感觉像是‘自己人’的东西被世界看见了”。","比如“人定胜天”的抗争思想，是玄幻小说的经典内核。","有个比利时读者阅读《斗破苍穹》后留言：“作品让我在快节奏的生活中，能以更好心态面对挑战。","今天，中国网文不再只是“中国的”，它成了一种世界性的创作语言。","他们写的小说，有的把中医、阴阳融入本土奇幻，有的把“系统流”“无限流”移植嫁接，既蕴含中国网文叙事滋味，又葆有当地文化别样风味。"],"argument_structure":"全文由事及理提出观点，层层展开论证，最后收束于启示与行动。","topics":["cultural_confidence"],"writing_angles":["以“文化自信是更基础更广泛更深厚的自信”立论","从“中华优秀传统文化创造性转化”切入","用“讲好中国故事”作升华，联系文化出海"],"summary":"中国网络文学在海外有多火？两次亲身经历，至今想起仍心头滚烫。2024年冬天，大英图书馆，一场特殊的藏书仪式举行——《斗罗大陆》《庆余年》等10部作品正式入藏。这是继2022年首次收录后，中国网文再度走进这座图书馆。2025年初秋，新加坡环球影城，《道诡异仙》主题探险屋前排起数百米长队。","original_content":"中国网络文学在海外有多火？两次亲身经历，至今想起仍心头滚烫。\n2024年冬天，大英图书馆，一场特殊的藏书仪式举行——《斗罗大陆》《庆余年》等10部作品正式入藏。这是继2022年首次收录后，中国网文再度走进这座图书馆。\n2025年初秋，新加坡环球影城，《道诡异仙》主题探险屋前排起数百米长队。不同肤色的游客，为中国文化IP而来。\n中国的新大众文艺已融入越来越多海外年轻人的生活。记得藏书仪式后，一名英国大学生告诉我，他追更这些小说已经好几年了，现在“感觉像是‘自己人’的东西被世界看见了”。这样的感慨，并非孤例。截至2025年底，中国网文累计向海外推出超13万部作品，海外注册用户约2.5亿人，覆盖200多个国家和地区。\n回头看，中国网文出海之路，始于热爱。对故事的渴望，是人类的一种本能。从洞穴壁画到史诗吟唱，从话本说书到网络连载，载体在变，人们对好故事的渴求从未改变。海外读者自发翻译、传播作品。好内容自己长出腿，漂洋过海。随着越走越远，这艘远航的巨轮需要更强劲的引擎。2017年，起点国际上线，把正版内容成规模地送出去。2023年，我们探索AI（人工智能）翻译，同步建立网络文学与传统文化术语库。到今年6月底，阅文集团已推出超3万部AI翻译作品，涵盖10余种语言。\n中国网文何以引发共鸣？语言有国界，但情感没有。比如“人定胜天”的抗争思想，是玄幻小说的经典内核。有个比利时读者阅读《斗破苍穹》后留言：“作品让我在快节奏的生活中，能以更好心态面对挑战。”外壳不同，内核相通。中国故事跨越山海，靠的是心与心的共振。这或许才是文化出海最深刻的意义：伟大的文化从来不固守边界，而是在流动中焕发新的生机。\n今天，中国网文不再只是“中国的”，它成了一种世界性的创作语言。我们推动海外作家生态建设，助力读者变作者，“追更”成“共创”。现在，阅文集团海外作者已超53万名。他们写的小说，有的把中医、阴阳融入本土奇幻，有的把“系统流”“无限流”移植嫁接，既蕴含中国网文叙事滋味，又葆有当地文化别样风味。\n网文的合作交流促进文化的和合共生。用东方的叙事方式，回应人类共通的精神需求；用开放的创作生态，容纳不同文化的自我表达。走出去，更扎下根、长出芽，当下的中国网文，已成为文化“新三样”之一，架起联通中外的桥梁，写下“美美与共、交流互鉴”的生动注脚。\n网络文学的事业还很年轻，往前走，要靠文化力、故事力、传播力的互促共进。“讲得好”，激发新大众文艺创造活力，鼓励深耕传统文化，传递天人合一、仁义礼智信等价值理念；“走出去”，善用流行元素，创新叙事表达，把文化内涵转化为易读懂、能共情的故事；“传得广”，持续通过平台创新、技术升级与产业合作，让好故事不受限于语言、渠道和形态，规模化走向世界。\n从翻译出海、模式出海，走向IP生态出海；从网文的单点爆款，到影视、游戏多点开花，当全球共读共创成常态，新时代的中国故事便有了穿越山海、超越时间的力量——不是征服，而是共融；不是独白，而是合唱。\n（作者为阅文集团首席执行官兼总裁）","organized_by":"rule"},{"id":26,"title":"极端低价不通吃","column_name":"人民时评","publish_date":"2026-10-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202610/15/content_30185804.html","core_view":"不只是惩罚极端低价，还要防止“竞价误伤”","golden_sentences":["不只是惩罚极端低价，还要防止“竞价误伤”","作为医保战略购买的重要工具，集采不再仅仅承担“价格发现”功能，而是日益成为推进医保改革的重要支点。","三者联动，才能让医保基金每一分钱都花在能真正改善健康的地方，让“以健康为中心”落到实处。","极端低价显著低于常规水平甚至生产成本，既扰乱良性竞价秩序，也变相导致企业拼价格、“向下卷”，是集采“反内卷”的治理重点所在。","医保集采不再“唯低价”，更加注重形成合理的竞价规则，能够让“卷价格”无机可乘。","换言之，在规则上将极端低价与带量拆开，让“赔本赚吆喝”的极端低价无利可图。"],"argument_structure":"全文开门见山提出观点，层层展开论证，最后收束于启示与行动。","topics":["business_environment"],"writing_angles":["从“有效市场+有为政府”切入，论证营商环境优化","以“高水平对外开放”为背景，写统一大市场与制度型开放","把“经营主体信心”作为观察窗口，落到稳预期政策"],"summary":"让价格竞争回归理性，不是给竞争设限，而是让竞争更有章法；不只是惩罚极端低价，还要防止“竞价误伤”近期，药品和医用耗材集采“低价不通吃”引发关注。9月份，第七批国家组织高值医用耗材集中带量采购，设置“双标准差”价格锚点，在规则设计上进一步突出“反内卷”，释放出“畸高价要出局，畸低价不带量”的信号。","original_content":"让价格竞争回归理性，不是给竞争设限，而是让竞争更有章法；不只是惩罚极端低价，还要防止“竞价误伤”\n近期，药品和医用耗材集采“低价不通吃”引发关注。9月份，第七批国家组织高值医用耗材集中带量采购，设置“双标准差”价格锚点，在规则设计上进一步突出“反内卷”，释放出“畸高价要出局，畸低价不带量”的信号。\n此前，第十二批国家组织药品集采在上海开标，同样明确“反内卷”导向，要求报出极端低价的企业提供“报价合理性声明”，同时不分配采购量，也不占用入围名额。\n何谓极端低价？以内镜止血夹的报价为例，有企业在开标现场报出7.4元的价格，而该产品一般报价至少在20元，企业实际出货价大多在26—30元区间。极端低价显著低于常规水平甚至生产成本，既扰乱良性竞价秩序，也变相导致企业拼价格、“向下卷”，是集采“反内卷”的治理重点所在。\n医保集采不再“唯低价”，更加注重形成合理的竞价规则，能够让“卷价格”无机可乘。第十二批药品集采中，在规则上明确当最低报价比“入围均价下浮两个标准差”还低时，虽然会接受其中选，但不再给予“量”的保证。换言之，在规则上将极端低价与带量拆开，让“赔本赚吆喝”的极端低价无利可图。可见，医保集采正在走出“价格主导”阶段，推动企业转向“拼质量、拼效率、拼保供”。\n让价格竞争回归理性，不是给竞争设限，而是让竞争更有章法；不只是惩罚极端低价，还要防止“竞价误伤”。本次耗材集采新增了“不带量复活”机制，临床需求量大的产品，即使未按正常竞价直接中选，接受不高于熔断价格1.5倍的条件后，仍有机会获得中选资格，只是不获得约定采购量。这样既保留了医生对主流产品的使用选择，也为医药企业留下了合理利润空间。\n作为医保战略购买的重要工具，集采不再仅仅承担“价格发现”功能，而是日益成为推进医保改革的重要支点。《全民医疗保障“十五五”规划》明确，促进公立医院改革、医保支付、药耗集采等重点改革协同。这意味着集采不再孤立地追求降价，而是嵌入“三医”协同的治理框架中：支付端管住“花多少”，采购端（集采）管住“买多贵”，医疗端管住“怎么用”。三者联动，才能让医保基金每一分钱都花在能真正改善健康的地方，让“以健康为中心”落到实处。\n健康中国建设是一项系统性工程。推动集采完成从价格导向到价值导向、从分散治理到全国协同、从成本竞争到创新竞争的深刻转型，在保障民生、促进创新、规范市场之间找到更优平衡，有利于实现“患者得实惠、医保提效率、企业促转型”的共赢，为健康中国建设贡献更大力量。","organized_by":"rule"},{"id":25,"title":"“多说两句”的深意","column_name":"现场评论","publish_date":"2026-10-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202610/15/content_30185808.html","core_view":"不久前，在上海市黄浦区市民新村居民区采访，聊完起身，被一名经历过旧房改造的居民一把拉住，“我要多说两句”。","golden_sentences":["不久前，在上海市黄浦区市民新村居民区采访，聊完起身，被一名经历过旧房改造的居民一把拉住，“我要多说两句”。","难点不仅在资金、土地、规划的统筹调度，更在这项工作直面“家家那本难念的经”。","习近平总书记深刻指出：“衡量干部业绩好不好，关键要看老百姓口碑好不好。","创业绩也不是党员干部的“独角戏”，而是“大合唱”，须充分调动大家的积极性、主动性、创造性。","动迁搬走的，如何做到遇到急难事情还有人管……一桩桩、一件件，具体细微，关乎群众的切身利益与感受。","旧改，从工作角度看，是“难中之难”，但从涉改群众的视角看，是心之所盼。"],"argument_structure":"全文由事及理提出观点，分层论证（从底线、发展、民生等多个维度展开）；递进升华（不仅……更……），最后收束于启示与行动。","topics":["law_enforcement"],"writing_angles":["从“治理效能”切入，论证制度优势如何转化为基层治理实效","以“为民服务”为价值主线，构建“问题—原因—对策”的分论点","把“作风建设”作为破题点，落到干部担当与群众获得感"],"summary":"不久前，在上海市黄浦区市民新村居民区采访，聊完起身，被一名经历过旧房改造的居民一把拉住，“我要多说两句”。说啥呢？原来，改造期间，他家两位年近90岁的老人住进郊区养老院，居民区党总支书记张蔚坚持去探望，转了好几趟车，亲眼看到老人生活就医都好才放心，“就为这件事，我打心里认可张书记”。","original_content":"不久前，在上海市黄浦区市民新村居民区采访，聊完起身，被一名经历过旧房改造的居民一把拉住，“我要多说两句”。\n说啥呢？原来，改造期间，他家两位年近90岁的老人住进郊区养老院，居民区党总支书记张蔚坚持去探望，转了好几趟车，亲眼看到老人生活就医都好才放心，“就为这件事，我打心里认可张书记”。\n无独有偶。在黄浦区普育东路101弄旧改项目采访时，一户居民，父女两人，谈了新房让人满意的地方，也说了一些客观不足。采访快结束，他们同样要多说两句，表扬物业工作人员张隽昊，“光为房间里一扇门的安装，小张前后跑了七八趟，不管新房有没有百分百合心意，就看这一点，也满意了！”\n在上海，旧改一度被称为“天下第一难”。难点不仅在资金、土地、规划的统筹调度，更在这项工作直面“家家那本难念的经”。亲属不和的，如何平衡不同的诉求；动迁搬走的，如何做到遇到急难事情还有人管……一桩桩、一件件，具体细微，关乎群众的切身利益与感受。办实办好这些小事，关系着旧改给群众带来的获得感，考验着基层干部的能力与担当。\n增强这份获得感，离不开相互信任、密切联系的干群关系。旧改，从工作角度看，是“难中之难”，但从涉改群众的视角看，是心之所盼。一堵墙、一扇窗，砌得合不合适、装得好不好用，群众心里都有忖度、都会在乎。把这项工作干好不容易，想获得群众的夸赞更难。唯有把群众当“自家人”，将心比心，多听群众怎么说、愿同群众坐一起，切实把“表态”变成“行动”，件件有回音、事事有着落，群众才会信任你、靠近你。\n“多说两句”，是对潜绩的肯定。旧改过程中，一幢残破小楼被推平，一幢崭新住宅建起，社会大多关注这些外在变化，细致繁琐的沟通协调工作却不易被“看见”。可没有下在背后的苦功夫，就不可能破心墙、筑心桥，赢得群众的交口称赞。\n习近平总书记深刻指出：“衡量干部业绩好不好，关键要看老百姓口碑好不好。”面对人民过上更好生活的新期待，我们不能有丝毫自满和懈怠，需要久久为功的努力。始终把群众的安危冷暖记在心里、扛在肩上、落在行动上，定能以实绩赢得群众认可。\n干事业、创政绩，为了造福人民，更要依靠群众。在上海的旧改工作中，依靠群众来做群众工作是一条行之有效的路径。放宽视野看，无论是各地火热的群众性体育赛事，还是文旅活动中的群众志愿者，抑或是融入社会治理实践的快递员、外卖员，群众的智慧与力量愈发凸显。\n创新绩不能“闭门造车”，须坚持问政于民、问需于民、问计于民；创业绩也不是党员干部的“独角戏”，而是“大合唱”，须充分调动大家的积极性、主动性、创造性。人人出力、时时上心、处处用心，每做成一件实事好事，都能助力党和国家事业向前发展。\n走出上海的街巷里弄，“我要多说两句”言犹在耳。一枝一叶总关情，为群众多想一些、多做一些，实打实的政绩定会留在群众心中。\n（作者为本报上海分社记者）","organized_by":"rule"},{"id":24,"title":"“大师”摘牌的三重启示","column_name":"微观","publish_date":"2026-10-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202610/15/content_30185807.html","core_view":"“大师”摘牌，餐饮业靠什么留客？前不久，中国烹饪协会全面清理历年评定颁发的“中国烹饪大师（名师）”“中国餐饮服务大师（名师）”等各类含“大师”“名师”的称号、证书与服装，推动餐饮业从“卷头衔”向“比品质”转变。","golden_sentences":["整治注水“大师”，纠正行业协会乱象，正是要斩断利益链条、维护良好市场秩序。","“高质量”的要求落实到各个行业，意味着要有更好发展环境、更高质量效益、更佳专业水准、更优产品服务。","评选“大师”，本来是为了褒奖行业里深耕技艺、守正创新、传承文脉的优秀代表，以发挥示范引领作用。","从这个角度讲，纵容注水“大师”名利双收，是对那些精耕细作、埋头打磨的真正匠人的不公平，是对工匠精神、实干精神的无形消解。","中国整形美容协会、中国建筑防水协会等行业协会，相继宣布撤销多个“大师”“传承大师”等称号。","然而，一些“大师”评比泛滥，日益偏离初衷，实行暗箱操作、形成灰色产业链。"],"argument_structure":"全文由事及理提出观点，层层展开论证，最后落脚到时代主题与价值升华。","topics":["law_enforcement","sci_tech_innovation"],"writing_angles":["从“治理效能”切入，论证制度优势如何转化为基层治理实效","以“为民服务”为价值主线，构建“问题—原因—对策”的分论点","把“作风建设”作为破题点，落到干部担当与群众获得感"],"summary":"“大师”摘牌，餐饮业靠什么留客？前不久，中国烹饪协会全面清理历年评定颁发的“中国烹饪大师（名师）”“中国餐饮服务大师（名师）”等各类含“大师”“名师”的称号、证书与服装，推动餐饮业从“卷头衔”向“比品质”转变。今年以来，整治注水“大师”持续加码。","original_content":"“大师”摘牌，餐饮业靠什么留客？前不久，中国烹饪协会全面清理历年评定颁发的“中国烹饪大师（名师）”“中国餐饮服务大师（名师）”等各类含“大师”“名师”的称号、证书与服装，推动餐饮业从“卷头衔”向“比品质”转变。\n今年以来，整治注水“大师”持续加码。中国整形美容协会、中国建筑防水协会等行业协会，相继宣布撤销多个“大师”“传承大师”等称号。“大师”纷纷退场，有何深层考虑？\n摘虚名治乱，为行业评价标准正名。\n评选“大师”，本来是为了褒奖行业里深耕技艺、守正创新、传承文脉的优秀代表，以发挥示范引领作用。然而，一些“大师”评比泛滥，日益偏离初衷，实行暗箱操作、形成灰色产业链。\n“头衔论高低、名号定优劣”的背后，往往有利益驱使，“大师”“名家”的“帽子”一戴，寻常作品也能卖出高价。当对头衔和虚名的关注超过对品质的重视，容易导致“劣币驱逐良币”。从这个角度讲，纵容注水“大师”名利双收，是对那些精耕细作、埋头打磨的真正匠人的不公平，是对工匠精神、实干精神的无形消解。\n清理虚假名号、摒弃浮华噱头，建立规范化行业标准和评价体系，品质、实力、服务、口碑、创新才能成为经营主体的共同追求。\n摘虚名纠偏，为良好市场秩序筑基。\n行业协会本应是市场公平竞争的维护者，一旦把颁发“大师”头衔作为创收门路，就异化了自身定位，更扭曲了公平竞争；一些投机分子用“票子”换“帽子”、再用“帽子”换“票子”，污染了整个行业生态。\n整治注水“大师”，纠正行业协会乱象，正是要斩断利益链条、维护良好市场秩序。从二十届中央纪委五次全会将“学会协会”作为反腐败重点领域，到《社会组织评比表彰活动管理办法》实施项目清单管理，都是通过加强监管来维护市场秩序、优化发展生态，有助于实现经济发展和社会治理互促共进。\n摘虚名固本，为高质量发展蓄力。\n高质量发展是对经济社会发展方方面面的总要求。“高质量”的要求落实到各个行业，意味着要有更好发展环境、更高质量效益、更佳专业水准、更优产品服务。靠虚名造势、靠噱头引流，忽视品质打磨和实干积淀，已成为一种顽瘴痼疾。\n摘牌注水“大师”，正是要强化实干实绩导向，激励各行业从业者沉下心来打磨品质，提升产品质量和服务水准，汇聚起实现高质量发展的合力。\n祛虚名之弊，非一日之功；扬实干之风，须持之以恒。转变发展理念、堵住监管漏洞、扎紧制度笼子、涵养行业清风，把虚名清扫一空，让实干蔚然成风，方能匡正市场秩序、净化发展环境，在激发社会活力中增强高质量发展动力。","organized_by":"rule"},{"id":30,"title":"着力提高干部队伍现代化建设本领","column_name":"《求是》杂志评论员","publish_date":"2026-09-30","source":"求是网","source_url":"https://www.qstheory.cn/20260930/7954896185e440418eb2aa25a2628aac/c.html","core_view":"在新征程上奋力谱写强党强国新篇章，就要深入学习贯彻习近平党建思想，持之以恒推进全面从严治党，特别是锻造一支政治过硬、适应新时代要求、具备领导现代化建设能力的干部队伍。","golden_sentences":["习近平总书记指出：“党和国家事业涉及面很广，领导干部也不是总在一个岗位上工作，都要学过了、学好了再来干是不现实的。","实践反复证明，遵规守纪和干事创业从来不是非此即彼的“单选题”，遵规守纪才能拥有干事创业的充分自由和广阔空间。","领导干部本领大小不仅仅是自己的事情，而是关乎党和国家事业发展的大事情。","习近平总书记指出：“改革发展稳定、内政外交国防、治党治国治军，样样是政治，样样离不开政治。","”现在，国内外环境正在发生深刻复杂变化，对干部政治上的考验是很现实、很严峻的。","推进中国式现代化，干部既要政治过硬、本领高强，也要作风优良、清正廉洁，而且本领越强，越要严于律己、守好底线。"],"argument_structure":"全文开门见山提出观点，“问题—对策”结构，最后落脚到时代主题与价值升华。","topics":["law_enforcement","sci_tech_innovation"],"writing_angles":["从“治理效能”切入，论证制度优势如何转化为基层治理实效","以“为民服务”为价值主线，构建“问题—原因—对策”的分论点","把“作风建设”作为破题点，落到干部担当与群众获得感"],"summary":"金秋十月，中华人民共和国喜迎77周年华诞，我们正阔步行进在以中国式现代化全面推进强国建设、民族复兴伟业的壮阔征程上。77年来我国发展取得的伟大成就，是党带领人民一道拼出来、干出来、奋斗出来的。治国必先治党，党兴才能国强。","original_content":"金秋十月，中华人民共和国喜迎77周年华诞，我们正阔步行进在以中国式现代化全面推进强国建设、民族复兴伟业的壮阔征程上。77年来我国发展取得的伟大成就，是党带领人民一道拼出来、干出来、奋斗出来的。治国必先治党，党兴才能国强。在新征程上奋力谱写强党强国新篇章，就要深入学习贯彻习近平党建思想，持之以恒推进全面从严治党，特别是锻造一支政治过硬、适应新时代要求、具备领导现代化建设能力的干部队伍。\n党的十八大以来，以习近平同志为核心的党中央把坚持建设堪当民族复兴重任的高素质干部队伍作为全面从严治党的重要任务，作出一系列重要部署。习近平总书记先后提出增强“八种本领”、提高“七种能力”等一系列重要要求，强调全面提升与推进中国式现代化相适应的政治能力、领导能力、工作能力，引领推动干部队伍能力素质在全面从严治党实践中不断提升。当前，基本实现社会主义现代化进入夯实基础、全面发力的关键时期，世界百年变局加速演进，新一轮科技革命和产业变革加速突破，战略机遇和风险挑战并存、不确定难预料因素增多，经济发展中周期性、结构性、体制性问题相互交织，前进道路上还会遇到大量从未出现过的全新课题，对干部队伍的能力素质提出了新的更高要求。现在干部队伍总体素质是好的，但也存在一些与新征程新任务不适应的现象。有的政治站位不高、政治能力不强，贯彻党中央决策部署变形走样甚至只表态不落实；有的身子进了新时代、思想还停留在过去，习惯于老观念、老套路、老办法；有的虽有做好工作的真诚愿望，但由于不懂规律、缺乏本领，一遇到复杂局面就束手无策、心里发怵。领导干部本领大小不仅仅是自己的事情，而是关乎党和国家事业发展的大事情。我们处在前所未有的变革时代，干着前无古人的伟大事业，惟有一刻不停地学习、实践、提高，与时俱进增强现代化建设本领，做到忠诚干净担当，才能不断开创中国式现代化建设新局面。\n在现代化建设所需的各种能力中，政治能力是第一位的。习近平总书记指出：“改革发展稳定、内政外交国防、治党治国治军，样样是政治，样样离不开政治。”现在，国内外环境正在发生深刻复杂变化，对干部政治上的考验是很现实、很严峻的。倘若政治上拎不清，私心杂念丛生，关键时刻经不起风吹浪打，本事再大也难堪大用，甚至给党和人民事业造成危害。要坚持不懈用习近平新时代中国特色社会主义思想武装头脑、指导实践、推动工作，自觉在思想上政治上行动上同以习近平同志为核心的党中央保持高度一致，以实际行动践行“两个维护”，不断增强政治判断力、政治领悟力、政治执行力，使自己的政治能力与担任的领导职责相匹配。要严守政治纪律和政治规矩，坚决防止在思想上搞自由主义、政治上搞投机主义、组织上搞宗派主义、工作上搞本位主义、履责上搞好人主义，决不能阳奉阴违、我行我素甚至有令不行、有禁不止，决不当两面派、做两面人，决不搞“七个有之”那一套。\n“褚小者不可以怀大，绠短者不可以汲深。”高质量发展是全面建设社会主义现代化国家的首要任务，领导干部是否具备推动高质量发展的本领，直接关系现代化建设的成色和实效。要准确把握党中央对本地区本部门本领域改革发展的目标定位和部署要求，完整、准确、全面贯彻新发展理念，加快构建新发展格局，确保党中央重大决策部署不折不扣落到实处。当前，我国经济社会发展中老问题、新挑战仍然不少，在市场建设、科技创新、创业就业、收入分配等方面还存在制约高质量发展的障碍。面对这些问题，刻舟求剑不行，穿新鞋走老路也不行，必须聚焦高质量发展的卡点瓶颈，结合本地区本部门实际，研究解决好如何有效破解供强需弱矛盾、如何加快高水平科技自立自强、如何巩固壮大实体经济根基、如何因地制宜发展新质生产力、如何纵深推进全国统一大市场建设等重大问题。人工智能正日益成为经济增长的新引擎和新旧动能转换的加速器，要深入研究其对科研范式、产业形态、经济结构、社会治理等方面的广泛深刻影响，确保技术赋能始终服务于高质量发展。面对人民群众对美好生活的更高期待和社会利益格局的深刻调整，要走好新时代党的群众路线，增强服务群众本领，解决好就业、增收、入学、就医、住房、办事、托幼养老等群众急难愁盼问题。针对能源安全、产业链供应链稳定、金融和房地产市场、地方政府债务等重点领域风险隐患，要增强防范化解风险本领，统筹好发展和安全。\n实践是最好的磨刀石。习近平总书记指出：“党和国家事业涉及面很广，领导干部也不是总在一个岗位上工作，都要学过了、学好了再来干是不现实的。”当前，地方领导班子换届正在有序推进，一批干部陆续走上新的领导岗位。要主动适应新岗位新要求，扑下身子、沉到一线，把情况摸清、把问题找准、把对策提实，使新环境新实践成为增强现代化建设本领的新起点。要巩固拓展树立和践行正确政绩观学习教育成果，教育引导干部一任接着一任干、一张蓝图绘到底，防止新官不理旧账、政策规划“翻烧饼”。伴随现代化建设进程，各方面工作越来越专业化、专门化、精细化，要加快知识更新、提高专业素养，努力成为本职工作的行家里手。要树立重实干重实绩的选人用人导向，坚持严管厚爱结合、激励约束并重，既针对“佛系”、“躺平”心态和知识结构老化固化问题靶向施治，又为开拓进取、敢于担当的干部撑腰鼓劲，形成能者上、优者奖、庸者下、劣者汰的良好局面，激发干部队伍内生动力和整体活力。\n推进中国式现代化，干部既要政治过硬、本领高强，也要作风优良、清正廉洁，而且本领越强，越要严于律己、守好底线。实践反复证明，遵规守纪和干事创业从来不是非此即彼的“单选题”，遵规守纪才能拥有干事创业的充分自由和广阔空间。广大党员、干部要保持对“腐蚀”、“围猎”的警觉，经得起诱惑、稳得住心神、守得住清白，坚决不踩红线、不碰高压线，做到既管住身心又放开手脚，以自身正、自身廉、自身硬营造风清气正的干事环境。","organized_by":"rule"},{"id":35,"title":"以“规则之治”守护网络舆论场","column_name":"评论","publish_date":"2026-09-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202609/15/content_30181102.html","core_view":"“被导师压榨延期毕业”网帖，实为论文代写的引流信息；一些混淆视听的股市“小作文”，竟由AI（人工智能）批量生成；","golden_sentences":["值得警惕的是，一些写手深谙网络传播规律，撰写“小作文”的出发点就是博眼球、牟取私利，因而真相与理性自然被漠视。","网络“小作文”现象本质上是现实利益矛盾与个体情绪在互联网空间的投射。","对个人而言，避免被“小作文”裹挟，关键在于提升媒介素养，学会在情绪化叙事面前保持审慎，主动交叉验证信息，不做盲信盲从者。","在遇到问题时，更要懂得用法律武器保护自己，既不被“小作文”带节奏，也不在沉默中纵容恶行。","遏制“小作文”乱象，绝不能仅靠道德呼吁，必须将法治思维和法治方式贯穿于管网治网全过程。","越来越多的案例证明，虚构事实、恶意引流、操纵舆论等行为，今后只会受到依法处置。"],"argument_structure":"全文由事及理提出观点，“问题—对策”结构；递进升华（不仅……更……），最后收束于启示与行动。","topics":["law_enforcement","digital_economy"],"writing_angles":["从“治理效能”切入，论证制度优势如何转化为基层治理实效","以“为民服务”为价值主线，构建“问题—原因—对策”的分论点","把“作风建设”作为破题点，落到干部担当与群众获得感"],"summary":"“被导师压榨延期毕业”网帖，实为论文代写的引流信息；一些混淆视听的股市“小作文”，竟由AI（人工智能）批量生成；一女子发布视频谎称电梯内遭“猥亵殴打”，因涉嫌虚构事实扰乱公共秩序被立案调查……。近期，一些网络“小作文”频繁引发热议。","original_content":"“被导师压榨延期毕业”网帖，实为论文代写的引流信息；一些混淆视听的股市“小作文”，竟由AI（人工智能）批量生成；一女子发布视频谎称电梯内遭“猥亵殴打”，因涉嫌虚构事实扰乱公共秩序被立案调查……\n近期，一些网络“小作文”频繁引发热议。相关内容主打“控诉”“爆料”，在社交平台扩散速度极快，有的甚至声量惊人，干扰正常的公共讨论秩序。\n网络“小作文”现象本质上是现实利益矛盾与个体情绪在互联网空间的投射。如果说谣言侧重猎奇或捏造事实，“小作文”往往裹挟强烈的个人情绪，刻意铺陈曲折的叙事，主观色彩比较鲜明。很多时候，文中事实细节也难以求证。\n值得警惕的是，一些写手深谙网络传播规律，撰写“小作文”的出发点就是博眼球、牟取私利，因而真相与理性自然被漠视。这类“小作文”一旦成为网络焦点，不仅真假难辨、滋生戾气，侵蚀人与人之间的基本信任，也占用公众注意力资源，无益于构建良性舆论生态。\n“小作文”往往还自带“舆论审判”基因。信息一经发布，伤害便已发生，被指控者的名誉可能在短时间内遭受严重损害，而维权和救济之路却艰难漫长，甚至无法彻底消除影响。如果任由这种精心编排的叙事影响舆论，不仅对当事人不公，也会消解法治精神和公共理性。\n遏制“小作文”乱象，绝不能仅靠道德呼吁，必须将法治思维和法治方式贯穿于管网治网全过程。互联网不是法外之地，随着法律法规不断完善，网络内容发布者的法律责任更趋明晰。越来越多的案例证明，虚构事实、恶意引流、操纵舆论等行为，今后只会受到依法处置。\n营造清朗网络空间，符合互联网用户的根本利益，也是社会共识。但这一目标无法自动实现，需要凝聚多元主体的共治智慧与力量。\n从强化穿透式监管、压实平台责任，到互联网平台建立更高效的内容审核、谣言标注和投诉响应机制，再到自媒体和网络大V自觉校准公共讨论基调，以理性、客观的态度对冲偏激情绪，引导公众回归事实本身……共同将法治精神内化为行为准则，才能以“规则之治”不断优化网络舆论生态。\n对个人而言，避免被“小作文”裹挟，关键在于提升媒介素养，学会在情绪化叙事面前保持审慎，主动交叉验证信息，不做盲信盲从者。在遇到问题时，更要懂得用法律武器保护自己，既不被“小作文”带节奏，也不在沉默中纵容恶行。\n数智时代，尤须营造良好网络舆论环境，以清晰边界守护人的尊严与安全感。这不仅是治理之策，更是文明之需。","organized_by":"rule"},{"id":34,"title":"文学，扎根群众才更有力量","column_name":"人民时评","publish_date":"2026-09-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202609/15/content_30181098.html","core_view":"在互联网和数字技术赋能下，大众与文艺的距离不是更远了，而是更近了。同时，有助于提升生活品质的文化活动不是太多了，而是远远不够","golden_sentences":["习近平总书记指出：“人民的需要是文艺存在的根本价值所在。","文学或文艺，不像粮、不是水，算不上生活刚需，但只要对精神生活有所追求，就不可或缺。","“十五五”规划纲要提出：“让人民享受更高品质的文化生活。","当文学评奖适应时代，成为一个个触点融入日常、助力美好生活，鲁迅文学周让人们看到了新的可能。","今年是鲁迅先生诞辰145周年、逝世90周年。","新大众文艺兴起，文学奖也不应止于一次评奖、一场仪式。"],"argument_structure":"全文由事及理提出观点，层层展开论证，最后收束于启示与行动。","topics":["cultural_confidence"],"writing_angles":["以“文化自信是更基础更广泛更深厚的自信”立论","从“中华优秀传统文化创造性转化”切入","用“讲好中国故事”作升华，联系文化出海"],"summary":"在互联网和数字技术赋能下，大众与文艺的距离不是更远了，而是更近了。同时，有助于提升生活品质的文化活动不是太多了，而是远远不够。今年是鲁迅先生诞辰145周年、逝世90周年。在“遇见大先生”鲁迅文创市集上当小推介官，在左联会址纪念馆种下文学“火种之树”，在北外滩滨江海事塔旁的“江畔炬火”留下文学感悟……“2026中国文学盛典·鲁迅文学周”前不久在上海收官，一场场嵌入日常、蕴藏惊喜的“偶遇”，让读者在可","original_content":"在互联网和数字技术赋能下，大众与文艺的距离不是更远了，而是更近了。同时，有助于提升生活品质的文化活动不是太多了，而是远远不够\n今年是鲁迅先生诞辰145周年、逝世90周年。\n在“遇见大先生”鲁迅文创市集上当小推介官，在左联会址纪念馆种下文学“火种之树”，在北外滩滨江海事塔旁的“江畔炬火”留下文学感悟……“2026中国文学盛典·鲁迅文学周”前不久在上海收官，一场场嵌入日常、蕴藏惊喜的“偶遇”，让读者在可感可及的生活现场与文学同频共振。\n作为评奖后续，本届鲁迅文学奖通过配套活动由“夜”拓展为“周”，不仅时间上得到延伸，空间上也由剧院向展馆、书店、公园、社区拓展。\n新大众文艺兴起，文学奖也不应止于一次评奖、一场仪式。评奖的初衷，在于通过褒奖，引导阅读和创作风尚，为好作品链接读者与市场。如今，这些功能已非文学评奖独有。方便快捷的网络社交平台，快速迭代的大语言模型，在筛选海量作品、给出精准推荐等方面，能力不断得到验证。\n因应变化，必须寻找新的价值空间。文学或文艺，不像粮、不是水，算不上生活刚需，但只要对精神生活有所追求，就不可或缺。近期发布的《网络文学与微短剧融合发展研究报告》显示，国内网络文学用户规模达5.5亿，累计作品超4400万部；截至2025年底，网络文学累计改编短视频、微短剧作品数量已经超过1.2万部。就像“外卖诗人”王计兵、“菜场作家”陈慧等草根创作者一样，今天，依然有许多人锲而不舍地把情感和想象力编织成故事、输出为文字，获得精神上的满足与共鸣。\n文化，蕴含着深层而持久的力量。观察如今的城市发展，拼地区生产总值增长、拼产业很重要，从长远看还要拼文化。“十五五”规划纲要提出：“让人民享受更高品质的文化生活。”当审美越来越包容、需求越来越多元，文学在引领潮流、服务社会方面的潜力也与日俱增。\n习近平总书记指出：“人民的需要是文艺存在的根本价值所在。”在互联网和数字技术赋能下，大众与文艺的距离不是更远了，而是更近了。同时，有助于提升生活品质的文化活动不是太多了，而是远远不够。当文学评奖适应时代，成为一个个触点融入日常、助力美好生活，鲁迅文学周让人们看到了新的可能。比如，市民在生活场景中偶遇“大先生”时，或许能不断重温以鲁迅为代表的前辈作家们“为人生”的文学主张，并从个体生命体验出发体悟新的意蕴。\n新的“为人生”，还是“为人生”。鲁迅生前最后近10年，定居于上海，以《故事新编》《朝花夕拾》与数部杂文集等大量经典创作、出版和活动，将文学与社会实践推向顶峰。以前辈名家名字命名的文学奖，借用着先贤的历史信用，也承担着延续审美理想和精神品格的责任。这也带来启示，文学，扎根群众才更有力量，融入城市烟火才更有生命力。\n“无穷的远方，无数的人们，都和我有关。”1936年，鲁迅先生在一篇杂文中如此写道。在这个意义上，折桂鲁迅文学奖的获奖者值得关注，如何让文学超越创作本身、升华为一种生活方式，进而为繁荣新大众文艺助力、为高品质生活赋能，同样值得思索探求。","organized_by":"rule"},{"id":33,"title":"深圳校服何以“出圈”","column_name":"微观","publish_date":"2026-09-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202609/15/content_30181099.html","core_view":"开学季，有关深圳校服的话题引发关注。据媒体报道，在深圳，中小学校服实行全市统一款式，家长无需通过学校统一订购，校服销售网点覆盖学校周边文具店、社区商铺、商超和线上平台，价格从几十元到100多元不等，购买方便，省心省钱。","golden_sentences":["无论“统”，还是“分”，用改革方式解决问题的路径始终清晰，做好顶层设计、注重统筹兼顾的方法论一以贯之。","现实中，诸如怎样以柔性管理守护夜市“烟火气”、城市更新如何提升公共空间品质等问题，也需从实际出发，让群众出招。","打开视野看，这也为深化改革、优化治理带来启示。","深圳校服走红背后，是当地整体谋划、长周期动态完善政策的持续努力。","比如，《深圳市中小学生校服颜色》团体标准近期发布，让校服有了“色彩标尺”。","近年来，校服治理成效明显，但围绕设计、价格、质量、招标采购等，问题不时浮现，群众满意度还有提升空间。"],"argument_structure":"全文由事及理提出观点，层层展开论证，最后收束于启示与行动。","topics":["cultural_confidence","law_enforcement"],"writing_angles":["以“文化自信是更基础更广泛更深厚的自信”立论","从“中华优秀传统文化创造性转化”切入","用“讲好中国故事”作升华，联系文化出海"],"summary":"开学季，有关深圳校服的话题引发关注。据媒体报道，在深圳，中小学校服实行全市统一款式，家长无需通过学校统一订购，校服销售网点覆盖学校周边文具店、社区商铺、商超和线上平台，价格从几十元到100多元不等，购买方便，省心省钱。校服看似事小，却与不少家庭息息相关。","original_content":"开学季，有关深圳校服的话题引发关注。据媒体报道，在深圳，中小学校服实行全市统一款式，家长无需通过学校统一订购，校服销售网点覆盖学校周边文具店、社区商铺、商超和线上平台，价格从几十元到100多元不等，购买方便，省心省钱。\n校服看似事小，却与不少家庭息息相关。近年来，校服治理成效明显，但围绕设计、价格、质量、招标采购等，问题不时浮现，群众满意度还有提升空间。深圳校服“出圈”，提供了一种解题思路。打开视野看，这也为深化改革、优化治理带来启示。\n善用改革破解治理难题，既树立系统思维，也坚持长期主义。\n深圳校服走红背后，是当地整体谋划、长周期动态完善政策的持续努力。2002年，深圳通过校服设计大赛选出中小学校服全市统一款式，并于次年印发管理办法，推动中小学生统一着装；2011年，确定校服指导价；2018年，停止校服统一招标，自此逐步培育并规范校服市场。\n无论“统”，还是“分”，用改革方式解决问题的路径始终清晰，做好顶层设计、注重统筹兼顾的方法论一以贯之。“三医联动”改革，户籍制度改革，统筹推进教育科技人才体制机制一体改革……新时代以来，一项项改革之所以次第开花、成效卓然，关键就在于避免头痛医头、脚痛医脚，系统全面推进、久久为功。\n以目标为牵引，处理好政府和市场的关系，“两只手”协同发力。\n回看深圳校服治理历程，随着改革深化，相关部门从“采购者”向制定标准、强化监管转身，打出“校服行业协会备案约束+政府加强质量监管”等组合拳，激发了市场力量。比如，《深圳市中小学生校服颜色》团体标准近期发布，让校服有了“色彩标尺”。\n为学校减轻校服采购压力，使其专注教育事业，把生产流通交给市场，让家庭拥有自主选择权，这是有效市场和有为政府良性互动的生动案例。从纵深推进全国统一大市场建设，到深化科技评价体系改革，再到完善扩大消费长效机制……让“看得见的手”和“看不见的手”各展其长，加快形成既“放得活”又“管得好”的经济秩序，就能为高质量发展添动力。\n以民生幸福为旨归，让群众可感可及。\n深圳推行全市统一款式、家长自行购买、市场化充分竞争的校服管理机制，也曾面临个性化不足、给家庭添麻烦等质疑，通过问需于民、问计于民，打好政策补丁，群众获得感增强。教育部前不久印发《中小学校服管理十条》，明确制度规范和红线，提出“学校应成立多方参与的校服选用组织，其中家长和学生代表比例不得低于80%”等要求，初衷也在于守护群众利益。\n校服治理不能“一刀切”。因怕违规、怕投诉就停购缓购，或频繁更换校服款式，都与服务民生相悖。现实中，诸如怎样以柔性管理守护夜市“烟火气”、城市更新如何提升公共空间品质等问题，也需从实际出发，让群众出招。正如网友所说：“民生无小事，细微见初心。愿越来越多城市，能从一件校服开始，读懂普惠治理真正的意义。”","organized_by":"rule"},{"id":32,"title":"练出“巧身段”的应变力","column_name":"纵横","publish_date":"2026-09-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202609/15/content_30181101.html","core_view":"光靠蛮力不行，既要扛得动，也要走得稳、转得灵。","golden_sentences":["这样的“巧身段”，是一种能及时调整、快速适应的韧性。","练好“大块头”的硬功夫，练出“巧身段”的应变力，才能在变化中站稳脚跟、踩准市场节奏，在激烈的行业角逐中牢牢掌握发展主动。","光靠蛮力不行，既要扛得动，也要走得稳、转得灵。","企业打开市场，靠的同样不是一味拼“蛮力”，而是顺着需求变化不断调整、迭代。","因需求而变、随市场而变，靠的是把技术积累转化为适配新需求、打开新市场的能力。","练出“巧身段”，就要善于从细微需求中找准赛道，把“小场景”做成“大市场”。"],"argument_structure":"全文由事及理提出观点，层层展开论证，最后收束于启示与行动。","topics":["industrial_upgrading"],"writing_angles":["从“实体经济是根基”切入，论证制造业高端化","以“产业链韧性”为线索，写补短板与锻长板","用“向新而行”作主题，落到新旧动能转换"],"summary":"千吨重物怎么搬？光靠蛮力不行，既要扛得动，也要走得稳、转得灵。最近，天津造出了一对灵巧的“大力士”——天津市沃尔德智能机器人有限公司生产的无人重载智能运输车：单车载重500吨，双车联动可负载1000吨，能横移、转弯、全向行走，两车协同也能步调一致，可谓“块头不小，身段灵巧”。","original_content":"千吨重物怎么搬？光靠蛮力不行，既要扛得动，也要走得稳、转得灵。\n最近，天津造出了一对灵巧的“大力士”——天津市沃尔德智能机器人有限公司生产的无人重载智能运输车：单车载重500吨，双车联动可负载1000吨，能横移、转弯、全向行走，两车协同也能步调一致，可谓“块头不小，身段灵巧”。\n“大块头”的“巧身段”，映照产品特性，更折射企业的应变之道。企业打开市场，靠的同样不是一味拼“蛮力”，而是顺着需求变化不断调整、迭代。\n市场越细分、需求越多元，企业越难凭一款产品、一个优势“包打天下”。因需求而变、随市场而变，靠的是把技术积累转化为适配新需求、打开新市场的能力。“硬功夫”与“巧身段”兼备，才能在市场变化中开辟发展新空间。\n练出“巧身段”，就要善于从细微需求中找准赛道，把“小场景”做成“大市场”。伽利略（天津）技术有限公司聚焦工业级特种机器人，针对化工、煤矿、电力等行业推出多款巡检机器狗；天津望圆智能科技股份有限公司深耕泳池清洁机器人领域，产品畅销海外……这些企业没有扎堆“内卷”，而是以需求牵引产品设计，寻求差异化发展。可见，企业善用巧劲、错位竞争，也能在细分领域闯出一片天地。\n“巧身段”要有一技之长打底，更要能将“独门绝技”灵活转化，拓展到更多领域。菲特（天津）检测技术有限公司从汽车行业起家，将机器视觉、光学、人工智能等技术沉淀为通用能力，公司业务从零部件检测拓展至整车漆面、化纤丝锭、医药灯检等领域。从“做一个项目”到“解一类问题”，看似只是服务范围在扩大，实质上是企业技术转化能力的跃升。如此一来，企业就能不断培育新的增长点。\n这样的“巧身段”，是一种能及时调整、快速适应的韧性。在浙江，一些服装企业改造柔性产线，实现了潮流服装“一件起订”；在山西，一卷卷薄如蝉翼的“手撕钢”，成为折叠屏、精密仪器、航空航天装备等领域的关键材料。订单有变化，产线能自如切换；需求有升级，产品能及时迭代。这种灵活应变的“巧劲”，正是企业勇立市场潮头的底气。\n市场的起伏并不可怕，怕的是企业停在原地、不知变通，甚至把过往经验奉为不变的教条。练好“大块头”的硬功夫，练出“巧身段”的应变力，才能在变化中站稳脚跟、踩准市场节奏，在激烈的行业角逐中牢牢掌握发展主动。\n（摘编自《天津日报》，原题为《“大块头”也要有“巧身段”》）","organized_by":"rule"},{"id":31,"title":"环保为民，口碑为证","column_name":"连线评论员","publish_date":"2026-09-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202609/15/content_30181097.html","core_view":"对话人：","golden_sentences":["《规划》专门提出“加强群众身边水体保护治理”，就是把治理落到了群众天天看得见、摸得着的生活空间里。","生态环境保护、美丽中国建设是复杂的系统工程，既要注重“看得见的成效”，也要苦下“看不见的功夫”。","“十五五”时期，我国生态环保工作要做到“四个更加注重”，第一位就是“更加注重环保为民”。","“环保为民”，就是把工作的坐标系，真正锚定在群众的获得感上，这是初心所在，也是现实所需。","依托“美丽中国，我是行动者”等系列活动，更多人从自己做起、从身边点滴做起，把绿色低碳理念融入日常。","将“环保为民”落到实处，既要治大动脉也要通微循环，既要做显功也要做潜功。"],"argument_structure":"全文由事及理提出观点，层层展开论证，最后落脚到时代主题与价值升华。","topics":["green_development","law_enforcement"],"writing_angles":["以“绿水青山就是金山银山”立论，论证生态优先","从“双碳目标”切入，写绿色转型与高质量发展协同","把“生态惠民”作为落脚点，体现民生温度"],"summary":"对话人：。谢佳沥中国环境报理论评论部主任。周珊珊：习近平总书记强调：“生态文明建设最能给老百姓带来获得感，环境改善了，老百姓体会也最深。”从“美丽中国建设取得新的重大进展”成为“十五五”时期经济社会发展主要目标之一，到《美丽中国建设“十五五”规划》（以下简称《规划》）印发，再到生态环境法典施行，“环保为民”的理念一以贯之。","original_content":"对话人：\n谢佳沥  中国环境报理论评论部主任\n周珊珊：习近平总书记强调：“生态文明建设最能给老百姓带来获得感，环境改善了，老百姓体会也最深。”从“美丽中国建设取得新的重大进展”成为“十五五”时期经济社会发展主要目标之一，到《美丽中国建设“十五五”规划》（以下简称《规划》）印发，再到生态环境法典施行，“环保为民”的理念一以贯之。\n谢佳沥：生态环保工作的成效，最终要靠群众感受来印证。江苏南京市民经常能看到长江里的江豚；中华斑羚在北京百望山森林公园露面；今年1—7月，全国PM2.5平均浓度同比下降6.2%，地表水水质优良断面比例达到86.5%……变化背后，是鲜明的价值导向：“良好生态环境是最公平的公共产品，是最普惠的民生福祉。”\n“十五五”时期，我国生态环保工作要做到“四个更加注重”，第一位就是“更加注重环保为民”。当前，生态环境质量距离美丽中国建设目标、人民群众期待、高质量发展要求还存在一定差距。“环保为民”，就是把工作的坐标系，真正锚定在群众的获得感上，这是初心所在，也是现实所需。\n周珊珊：理念的落地，离不开制度的保障。从《规划》到法典，如何为“环保为民”筑牢制度根基、巩固长期成效？\n谢佳沥：生态环境法典系统整合各类生态环境法律制度规范，对新兴领域作出引领性规定。群众对良好生态环境的期盼，不只是政策宣示，更是可主张、可救济的权利。《规划》则把群众感受最直接的PM2.5浓度、优良水体比例等纳入约束性指标考核，还谋划了美丽蓝天、美丽河湖等重点任务和重大工程，群众感受成了发展“硬杠杠”。\n良法固根本，规划利长远。二者结合，让短期整治成效转化为常态化、制度化的生态红利。\n周珊珊：相关新闻发布会上提到，美丽中国建设是“口碑工程”，不是“口号工程”。将“环保为民”落到实处，既要治大动脉也要通微循环，既要做显功也要做潜功。\n谢佳沥：过去，治理大江大河，成效可以从数据中看出来；但老百姓房前屋后、田间道旁的坑塘沟渠，往往是数据无法体现之处。《规划》专门提出“加强群众身边水体保护治理”，就是把治理落到了群众天天看得见、摸得着的生活空间里。\n生态环境保护、美丽中国建设是复杂的系统工程，既要注重“看得见的成效”，也要苦下“看不见的功夫”。比如产业结构、能源结构调整，见效周期长，却深刻影响着绿色发展的进展和成效。很多工作都不是朝夕之功，却在为未来筑牢基底。\n只做显功，容易变成盆景式治理、运动式执法，成绩好看但容易反弹；只做潜功，群众长期看不到变化，信心和参与热情会慢慢降低。表里兼修、长短兼顾，口碑才能从“一时好”变成“一直好”。\n周珊珊：生态环境的公共属性，决定了它从来不是单一部门能完成的任务。生态治理没有旁观者，美丽中国建设人人皆是责任人。\n谢佳沥：以往，生态环保工作更多的是政府干、群众看。如今，强调共建共享，其实是把群众从治理反馈的“末端”，请到治理过程的“前台”。\n从单兵作战到合力监督。重庆把排污口监管升级为“拍污口”监管，让群众监督；中央生态环保督察高度重视群众身边的“烦心事”，10年间受理转办超过38万件群众信访举报。\n从被动受益到主动参与。依托“美丽中国，我是行动者”等系列活动，更多人从自己做起、从身边点滴做起，把绿色低碳理念融入日常。当绿色生活从“要我做”变成“我要做”，美丽中国就有了最深厚的根基。\n说到底，“口碑工程”的验收，从来不在文件、会议里，而在绿水青山间、群众心坎上。\n周珊珊：美丽中国建设不只是守护绿水青山的生态工程，更是回应群众期盼、增进民生福祉、凝聚社会共识的民心工程。《规划》印发、法典施行只是起点，真正体现治理成色的，是制度能否长出牙齿、承诺能否兑现实效、群众能否持续受益。深入贯彻落实习近平生态文明思想，把人民满意作为最终标尺，让每一片蓝天、每一泓碧水、每一抹绿色都成为老百姓可感可知的幸福底色，美丽中国就一定能成为你我共同建设、共同守护、共同享有的家园。","organized_by":"rule"},{"id":36,"title":"在激发社会活力中增强高质量发展动力","column_name":"《求是》杂志评论员","publish_date":"2026-08-31","source":"求是网","source_url":"https://www.qstheory.cn/20260831/55155cd732b545f89e406bd344f2c539/c.html","core_view":"7月30日召开的中央政治局会议，强调要“增强发展动力、激发社会活力”并作出重要部署，充分彰显了以习近平同志为核心的党中央对社会活力问题的高度重视，具有很强的现实针对性和长远指导性。","golden_sentences":["社会活力的强弱，根本上取决于生产关系和生产力、上层建筑和经济基础、国家治理和社会发展是否相适应。","习近平总书记强调，“推进中国式现代化，必须进一步全面深化改革开放，不断解放和发展社会生产力、解放和增强社会活力”。","政府只有在自身职责领域更好发挥作用，才能使市场在资源配置中起决定性作用。","公平有序的市场竞争环境，是促进商品要素资源畅通流动，让各类生产要素活力竞相迸发，推动资源高效配置的基本保障。","超大规模市场的需求潜力持续释放，特别是服务消费、绿色消费、新型消费亮点纷呈，旅游、演艺、体育赛事人气旺盛，经常一票难求。","一方面，随着经济发展模式的调整转换，过去熟悉的生产方式、盈利模式、就业形态等正在发生变化，部分企业和劳动者一时难以适应。"],"argument_structure":"全文由事及理提出观点，辩证分析（一方面……另一方面……）；“问题—对策”结构，最后落脚到时代主题与价值升华。","topics":["industrial_upgrading","business_environment"],"writing_angles":["从“实体经济是根基”切入，论证制造业高端化","以“产业链韧性”为线索，写补短板与锻长板","用“向新而行”作主题，落到新旧动能转换"],"summary":"社会活力是观察一个国家发展动力的窗口。7月30日召开的中央政治局会议，强调要“增强发展动力、激发社会活力”并作出重要部署，充分彰显了以习近平同志为核心的党中央对社会活力问题的高度重视，具有很强的现实针对性和长远指导性。我们要深刻把握发展动力与社会活力的内在联系，充分激发全社会干事创业、创新创造的活力，为高质量发展注入更加强大的内生动力，推动我国经济持续向新向优向好发展。","original_content":"社会活力是观察一个国家发展动力的窗口。7月30日召开的中央政治局会议，强调要“增强发展动力、激发社会活力”并作出重要部署，充分彰显了以习近平同志为核心的党中央对社会活力问题的高度重视，具有很强的现实针对性和长远指导性。我们要深刻把握发展动力与社会活力的内在联系，充分激发全社会干事创业、创新创造的活力，为高质量发展注入更加强大的内生动力，推动我国经济持续向新向优向好发展。\n今年上半年，我国经济顶压前行，国内生产总值同比增长4.7%，在全球主要经济体中继续位居前列。经济动能向新、结构向优的发展态势更加明显，以高端制造等为代表的新动能对经济增长的贡献率超过四成，拥有核心技术的链主型创新企业、聚焦细分行业的专精特新企业加速涌现、茁壮成长。超大规模市场的需求潜力持续释放，特别是服务消费、绿色消费、新型消费亮点纷呈，旅游、演艺、体育赛事人气旺盛，经常一票难求。人流、物流、信息流、资金流高度活跃，一天的快递量有5.5亿多件，超过其他国家总和。面对外部环境变乱交织、国内新情况老问题叠加的复杂局面，我国经济能够展现出强大韧性，一个重要原因就在于我们扎实推进重点领域改革，纵深推进全国统一大市场建设，着眼增强供给和需求的适配性、平衡性，更加全面地完善制度体系，更加有效地畅通经济循环，有力激发了高质量发展的澎湃动力和创新活力。\n社会有活力，发展就有动力。实践充分表明，经济发展的内生动力与社会活力息息相关，只有让一切劳动、知识、技术、管理、资本等要素的活力竞相迸发，让一切创造社会财富的源泉充分涌流，发展动力才可能持久、强劲、源源不断。反之，如果社会活力不足，过于谨慎和求稳的
