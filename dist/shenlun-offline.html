我革命必须展现新气象","column_name":"人民观点","publish_date":"2025-02-14","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202502/14/content_30056647.html","core_view":"党领导的社会革命迈上新征程，党的自我革命必须展现新气象，全面从严治党既要有新的认识，也要有新的作为","golden_sentences":["必须深刻把握深入推进全面从严治党的战略部署和最新要求，保持“永远在路上”的坚韧执着，坚决清除一切侵蚀党的健康肌体的病毒。","全面从严治党是各级党组织的职责所在，党委要主动抓、主动管，纪委要把专责监督履行好。","人民群众最痛恨腐败现象，只有把整治群众身边不正之风和腐败问题作为重要任务常态化地抓，才能让老百姓可感可及，持续提高满意度、获得感。","党领导的社会革命迈上新征程，党的自我革命必须展现新气象，全面从严治党既要有新的认识，也要有新的作为","一体推进不敢腐、不能腐、不想腐，是新时代全面从严治党的重要方略。","“三不腐”同时发力、同向发力、综合发力，才能确保党永葆生机活力、走好新的赶考之路。"],"argument_structure":"全文由事及理提出观点，“问题—对策”结构，最后收束于启示与行动。","topics":["law_enforcement","cultural_confidence"],"writing_angles":["从“治理效能”切入，论证制度优势如何转化为基层治理实效","以“为民服务”为价值主线，构建“问题—原因—对策”的分论点","把“作风建设”作为破题点，落到干部担当与群众获得感"],"summary":"党领导的社会革命迈上新征程，党的自我革命必须展现新气象，全面从严治党既要有新的认识，也要有新的作为。以“同查”严惩风腐交织问题，以“同治”铲除风腐共性根源，为提升正风反腐效能拓展了思路方法，让反腐败斗争更加科学长效。反腐败一步不能停歇，全面从严治党须臾不可放松。","original_content":"党领导的社会革命迈上新征程，党的自我革命必须展现新气象，全面从严治党既要有新的认识，也要有新的作为\n以“同查”严惩风腐交织问题，以“同治”铲除风腐共性根源，为提升正风反腐效能拓展了思路方法，让反腐败斗争更加科学长效\n反腐败一步不能停歇，全面从严治党须臾不可放松。\n1月17日，国家烟草专卖局原副局长张天峰涉嫌违纪违法被查。1月23日，十四届全国政协常委、农业和农村委员会副主任齐扎拉涉嫌严重违纪违法被查。\n2025甫一开年，“打虎”信息密集发布，展现出全面从严治党一刻不停歇的坚强决心，刻印下“反腐败是最彻底的自我革命”的有力注脚。\n没有彻底的自我革命精神，哪有坚决同一切损害党的先进性和纯洁性的因素作斗争的底气和决心？没有全面从严治党的革命性锻造，哪有今天这样一个高度团结、坚强有力的中国共产党？\n在二十届中央纪委四次全会上，习近平总书记着眼于实现新时代新征程党的使命任务，对深入推进全面从严治党作出战略部署，就一体推进不敢腐、不能腐、不想腐提出最新要求。“保持战略定力和高压态势”“一步不停歇、半步不退让”“始终坚持零容忍”“坚持打铁必须自身硬”……字里行间，彰显将自我革命进行到底的魄力与定力，为坚决打好反腐败斗争攻坚战、持久战、总体战凝心聚力。\n办好中国的事情，关键在党、关键在全面从严治党。坚持用改革精神和严的标准管党治党，确保全党在思想上、政治上、行动上同以习近平同志为核心的党中央保持高度一致，始终保持党的强大创造力、凝聚力、战斗力，我们就能战胜前进道路上的一切风险和挑战。\n维护党中央权威和集中统一领导，不能停留在口头上，必须落实到行动上。推进政治监督向具体聚焦、向精准问效、向常态落实，解决好“对‘国之大者’不关心，对政治要求、政治规矩、政治纪律不上心，对各种问题的政治危害性不走心，对贯彻落实党中央的大政方针不用心”等问题，才能以全党的思想统一、方向一致，确保党中央各项决策部署落地见效。\n管党治党只能紧不能松。腐败是危害党的生命力和战斗力的最大毒瘤，反腐败是最彻底的自我革命。必须清醒认识到，腐败存量尚未清除，增量还在持续发生，铲除腐败滋生土壤和条件任务仍然艰巨繁重。反腐败如果回头驻足、松懈不前、心慈手软，先前的努力就会半途而废。必须深刻把握深入推进全面从严治党的战略部署和最新要求，保持“永远在路上”的坚韧执着，坚决清除一切侵蚀党的健康肌体的病毒。\n一体推进不敢腐、不能腐、不想腐，是新时代全面从严治党的重要方略。因敬畏而不敢腐，靠的是利剑高悬，震慑常在，坚持受贿行贿一起查，坚持有案必查、有腐必惩；因监督而不能腐，靠的是铁规发力，禁令生威，制度的笼子越扎越紧，纪法之网越织越密；因觉悟而不想腐，靠的是涵养文化，正心修身，扎实推进新时代廉洁文化建设。“三不腐”同时发力、同向发力、综合发力，才能确保党永葆生机活力、走好新的赶考之路。\n党领导的社会革命迈上新征程，党的自我革命必须展现新气象，全面从严治党既要有新的认识，也要有新的作为。让全面从严治党的思路举措更加科学、更加严密、更加有效，才能确保党永远不变质、不变色、不变味。\n经过实践熔炉的淬炼，我们党对反腐败斗争的规律性认识越来越深刻、反腐败的机制越来越完善、举措越来越精准。不正之风和腐败问题互为表里、同根同源。只治腐不纠风，腐败滋生的土壤仍在。以“同查”严惩风腐交织问题，以“同治”铲除风腐共性根源，为提升正风反腐效能拓展了思路方法，让反腐败斗争更加科学长效。\n政贵有恒，治须有常。全面从严治党，重在坚持、难在坚持、贵在坚持。反腐败斗争必须坚定不移，不能有任何犹豫动摇、松懈手软或半途而废。加强党的纪律建设是一项经常性工作，建立常态化长效化的纪律教育机制，有助于引导党员干部心无旁骛改革创新、干事创业。全面从严治党是各级党组织的职责所在，党委要主动抓、主动管，纪委要把专责监督履行好。人民群众最痛恨腐败现象，只有把整治群众身边不正之风和腐败问题作为重要任务常态化地抓，才能让老百姓可感可及，持续提高满意度、获得感。\n新时代全面从严治党的伟大实践，开辟了百年大党自我革命新境界。管党有方、治党有力、建党有效，必能以全党的强大正能量在全社会凝聚起推动中国发展进步的磅礴力量，引领中国式现代化行稳致远。\n（本系列评论到此结束）\n——以党的自我革命引领社会革命③","organized_by":"rule"},{"id":111,"title":"小切口改善大民生","column_name":"评论员观察","publish_date":"2025-01-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202501/15/content_30052081.html","core_view":"城市更新关系城市面貌和居住品质的提升，是扩大内需的重要抓手。","golden_sentences":["治理者多些换位思考，把“小而美”理念贯穿于施工全过程、各环节，更新项目才能更好惠及民生、得到支持","习近平总书记强调，“城市建设必须把让人民宜居安居放在首位，把最好的资源留给人民”。","任务越是复杂，实施越要精细，越需小处着手、实处着力，稳扎稳打提升百姓获得感。","城市更新往往不能一蹴而就，而是在持续“小步快走”中，让城市变得更加宜居、智慧、有韧性。","顺应群众期待，因地制宜、找准切口，瞄准痛点难点，着力惠民生、补短板、促发展，定能让群众更好感受到城市生活的美好","城市更新也是扩大内需、提升发展能级的重要抓手。"],"argument_structure":"全文由事及理提出观点，层层展开论证，最后落脚到时代主题与价值升华。","topics":["law_enforcement","business_environment"],"writing_angles":["从“治理效能”切入，论证制度优势如何转化为基层治理实效","以“为民服务”为价值主线，构建“问题—原因—对策”的分论点","把“作风建设”作为破题点，落到干部担当与群众获得感"],"summary":"城市更新关系城市面貌和居住品质的提升，是扩大内需的重要抓手。习近平总书记多次对城市更新行动提出要求、作出部署。2024年底举行的中央经济工作会议，将“大力实施城市更新”列为2025年的重点任务。2025年的首次国务院常务会议，也把推进城市更新工作列为研究议题。","original_content":"城市更新关系城市面貌和居住品质的提升，是扩大内需的重要抓手。习近平总书记多次对城市更新行动提出要求、作出部署。2024年底举行的中央经济工作会议，将“大力实施城市更新”列为2025年的重点任务。2025年的首次国务院常务会议，也把推进城市更新工作列为研究议题。面对新一轮城市更新，怎样总结经验、补齐短板，在实践中取得实效？本版今起推出系列评论，与广大读者一起聚焦城市更新。\n——编  者\n治理者多些换位思考，把“小而美”理念贯穿于施工全过程、各环节，更新项目才能更好惠及民生、得到支持\n顺应群众期待，因地制宜、找准切口，瞄准痛点难点，着力惠民生、补短板、促发展，定能让群众更好感受到城市生活的美好\n跨年之夜，北京长辛店老镇城市更新项目样板区正式亮灯。曹家口路，青灰、砖红的老建筑营造怀旧氛围，灯光秀、非遗展、特色小吃带火国潮消费，逛街凑趣的老住户喜笑颜开：“看着老街有人气儿，又不失老味儿，心里特舒坦！”\n漫步北京，钟楼湾胡同旧貌展新颜，亮马河变身80万平方米滨河公园，南中轴“腾笼换鸟”、告别传统业态……城市之变、街景之美让人心旷神怡。作为全国首个减量发展的超大城市，首都正用一笔一画描绘高品质生活新画卷，生动印证城市更新的魅力。\n近年来，从酝酿准备，到实施行动，再到不断深化，我国城市更新迈入可持续发展的新阶段。城市更新关系城市面貌，“里子”则是生活品质的升级。当前，我国常住人口城镇化率已逾66%，城市发展逐步从增量扩张进入存量优化阶段。加力推进城市更新，解决好“城市病”，更好满足人民群众美好生活需要，势在必行。\n城市更新是改善民生的重要切口。习近平总书记强调，“城市建设必须把让人民宜居安居放在首位，把最好的资源留给人民”。生活是否便利、设施是否好用，居民最有发言权。目前，我国已实施超过6.6万个城市更新项目，累计新开工改造25万个城镇老旧小区，1亿多人从中受益。\n为老楼更换上下水管道、加装电梯，社区里建起老年食堂，在街角新增口袋公园、立体绿化，加宽自行车道……这样的改变，老百姓感受最真切，增强的是人们对城市的归属感。\n城市更新也是扩大内需、提升发展能级的重要抓手。河北石家庄活化利用河钢集团石钢公司旧厂区遗址，突出音乐演出特色，打造以重金属工业风为主题的摇滚聚集地，吸引众多乐迷和游客。江苏苏州坚持“轻扰动、微更新，步行化、以人为先”，通过清理空间、挖掘文化资源、鼓励多元参与等措施，让十全街“移步换景”，成为热门景点。\n无论是加快推进城镇老旧小区、街区、厂区和城中村等改造，还是加强城市基础设施建设改造；无论是完善城市功能、修复城市生态系统，还是保护和传承城市历史文化，这些项目点多面广，蕴含巨大投资潜力，能够扩大有效投资，为城市经济打造新的增长点。\n城市更新不是集中力量搞一些样板间供人参观，而是涉及多领域的系统工程。任务越是复杂，实施越要精细，越需小处着手、实处着力，稳扎稳打提升百姓获得感。\n少一点“居高临下”，多一些群众视角。以笔者生活的小区为例，近期，借着燃气管道更新维护，重新铺装了柏油路面，施划了新的道路标线。在施工过程中，除了必要的公告说明，也在开挖的地方铺上了醒目的红色“地毯”，防止扬尘、便于通行；整修路面时，也并非简单地打补丁，而是综合整治道路“病害”。再好的民生工程，实施过程中也难免扰民。治理者多些换位思考，把“小而美”理念贯穿于施工全过程、各环节，更新项目才能更好惠及民生、得到支持。\n城市更新往往不能一蹴而就，而是在持续“小步快走”中，让城市变得更加宜居、智慧、有韧性。重庆民主村社区，黄葛树下，老人们围坐讨论棋局；咖啡厅、火锅店里，人们乐享消费时光；充满设计感的街巷，吸引游人驻足打卡。得益于两期城市更新项目接力，老社区补齐设施短板，激发新活力。不求“功成在我”，唯求“功成有我”，一茬接着一茬干，把“让人民过上幸福生活是头等大事”落实到位，城市更新就能赢得人心、行稳致远。\n人民城市为人民。2025年，我国将大力实施城市更新，谋划实施一批城市更新改造项目，全面完成2000年底前建成的城镇老旧小区改造任务。顺应群众期待，因地制宜、找准切口，瞄准痛点难点，着力惠民生、补短板、促发展，定能让群众更好感受到城市生活的美好。\n——因地制宜实施城市更新①","organized_by":"rule"},{"id":110,"title":"交流互鉴，扩大国际影响力","column_name":"评论","publish_date":"2025-01-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202501/15/content_30052085.html","core_view":"习近平总书记强调：“要深入推动教育对外开放，统筹‘引进来’和‘走出去’，不断提升我国教育的国际影响力、竞争力和话语权。","golden_sentences":["传媒类高校既是人才培养的重要基地，也是国际传播的研究高地，理应统筹做好“引进来”和“走出去”。","习近平总书记强调：“要深入推动教育对外开放，统筹‘引进来’和‘走出去’，不断提升我国教育的国际影响力、竞争力和话语权。","国际中文教育作为面向海外母语非汉语者的中文教学，是我国教育“走出去”的重要媒介。","推动中华文化更好走向世界，让中国声音传得更广更远，国际中文教育工作者理应挺膺担当、主动作为。","教识字、学读音、练写字……在许多国家，“汉语热”持续升温。","中文承载着中华民族数千年的文明智慧，是中国贡献给世界的重要公共文化产品。"],"argument_structure":"全文由事及理提出观点，层层展开论证，最后落脚到时代主题与价值升华。","topics":["business_environment","cultural_confidence"],"writing_angles":["从“有效市场+有为政府”切入，论证营商环境优化","以“高水平对外开放”为背景，写统一大市场与制度型开放","把“经营主体信心”作为观察窗口，落到稳预期政策"],"summary":"国际影响力是教育强国的显著标志。习近平总书记强调：“要深入推动教育对外开放，统筹‘引进来’和‘走出去’，不断提升我国教育的国际影响力、竞争力和话语权。”本期大家谈，围绕持续扩大我国教育的国际影响力展开探讨。——编者。不断提升我国教育的国际影响力、竞争力和话语权，需要重视并善于讲好中国教育故事、传播中国教育经验、发出中国教育声音，向世界展现真实、立体、全面的中国教育。","original_content":"国际影响力是教育强国的显著标志。习近平总书记强调：“要深入推动教育对外开放，统筹‘引进来’和‘走出去’，不断提升我国教育的国际影响力、竞争力和话语权。”本期大家谈，围绕持续扩大我国教育的国际影响力展开探讨。\n——编  者\n不断提升我国教育的国际影响力、竞争力和话语权，需要重视并善于讲好中国教育故事、传播中国教育经验、发出中国教育声音，向世界展现真实、立体、全面的中国教育。\n传媒类高校既是人才培养的重要基地，也是国际传播的研究高地，理应统筹做好“引进来”和“走出去”。如中国传媒大学在品牌传播和设计等研究领域，积极扩大国际学术交流，加强与海外高校、企业的教学科研合作，有效提升学校的国际声誉，吸引了大批留学生前来留学。同时，学校还推动中外合作办学在海南自贸港落地，探索以特色办学提升国际影响力的有效路径。在国际学术交流、中外合作办学中培育国际传播人才，本身就是一个讲好中国故事的过程，在春风化雨、润物无声中增强中华文化影响力。\n发力国际传播人才培养，加强国际学术平台建设，以交流互鉴谋发展，将推动国际传播能力建设取得新进展，让更多海外人士听到、听清、听懂中国教育的声音。\n（作者为中国传媒大学广告学院院长、教授）\n教识字、学读音、练写字……在许多国家，“汉语热”持续升温。中文承载着中华民族数千年的文明智慧，是中国贡献给世界的重要公共文化产品。做好国际中文教育，既能传授语言知识，也能促进文明交流互鉴。\n语言是文化文明的重要载体，是了解一个国家最好的钥匙。国际中文教育作为面向海外母语非汉语者的中文教学，是我国教育“走出去”的重要媒介。目前，世界上有85个国家把中文纳入了国民教育体系，国际中文学习者和使用者累计已经超过2亿人。作为中文母语国，积极开展中文教育是义不容辞的责任。世界中文大会、“中文日”、汉教英雄会……源自中国的国际中文教育活动日趋丰富，吸引力、影响力不断扩大。2024年10月，天津师范大学积极牵头“汉语桥”落地，吸引参赛选手和国际友人齐聚天津，在走街串巷中沉浸式感受中国文化。从实践看，不断丰富教学形式，有助于中文教育发挥文化之桥、友谊之桥、心灵之桥的作用。\n推动中华文化更好走向世界，让中国声音传得更广更远，国际中文教育工作者理应挺膺担当、主动作为。\n（作者为世界汉语教学学会会长、天津师范大学部校共建国际中文教育发展研究院院长）\n中国教育发展离不开世界，世界教育发展也离不开中国。扩大高水平教育对外开放，提高国际影响力，用好教育国际合作平台是一个重要途径。\n随着教育事业发展、综合国力增强，中国积极提供全球教育治理方略，搭建全球性高端教育合作平台，为全球教育治理贡献智慧和力量。多年来，广西以中国—东盟命运共同体建设为契机，立足地缘优势，积极建设、打造各类教育合作平台。广西财经学院牵头发起中国—东盟统计教育联盟，参与发起并承办澜沧江—湄公河流域治理与发展青年创新设计大赛，积极承办中国—东盟传媒教育合作国际论坛、中国—东盟统计论坛等高水平学术论坛。这些尝试不仅拓展了国际交流合作的广度，同时也积极融入全球教育治理，不断提升我国的教育国际影响力和话语权。\n高质量教育对外开放，是推进教育强国建设的重要引擎。得益于广阔的合作平台，我国已成为世界最大的国际学生生源国和亚洲最大的留学目的地国，教育“朋友圈”越来越大。以更加积极的姿态参与全球教育治理和区域教育合作，将为推动全球教育事业发展贡献更多中国力量。\n（作者为广西财经学院副校长）","organized_by":"rule"},{"id":109,"title":"春节留人用“薪”更要用“心”","column_name":"纵横","publish_date":"2025-01-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202501/15/content_30052084.html","core_view":"临近春节，一些地方快递、家政等服务行业出现不同程度的用工紧张。为保障节日用工需求，人力资源社会保障部近日联合多部门开展多种形式的岗位对接活动，很多企业开出高薪留人。","golden_sentences":["实打实的物质保障，让不少劳动者选择留岗过年、错峰返乡，有效缓解了“用工荒”，确保春节服务“不断档”。","这也意味着，不仅应在物质层面保障劳动者待遇，还应在城市生活诸多方面落实以人为本，积极回应各个群体的不同诉求。","期盼更多地方在春节期间，把“招得来、留得住”的工作做得更细致，实现人与城的共赢。","特别是服务行业，外来务工人员占比高、人员流动性较强，本就存在季节性用工缺口，逢年过节更加凸显。","从需求端来看，这些行业与日常生活密切相关，育婴、看护等聚焦“一老一小”，属于刚性需求。","对劳动者来说，薪酬待遇固然是重要考量，物质之外的人文关怀同样不可或缺。"],"argument_structure":"全文开门见山提出观点，递进升华（不仅……更……），最后收束于启示与行动。","topics":["law_enforcement","business_environment"],"writing_angles":["从“治理效能”切入，论证制度优势如何转化为基层治理实效","以“为民服务”为价值主线，构建“问题—原因—对策”的分论点","把“作风建设”作为破题点，落到干部担当与群众获得感"],"summary":"临近春节，一些地方快递、家政等服务行业出现不同程度的用工紧张。为保障节日用工需求，人力资源社会保障部近日联合多部门开展多种形式的岗位对接活动，很多企业开出高薪留人。团圆是春节的主题。不管在哪里工作、从事什么行业，许多人都会选择返乡过年。","original_content":"临近春节，一些地方快递、家政等服务行业出现不同程度的用工紧张。为保障节日用工需求，人力资源社会保障部近日联合多部门开展多种形式的岗位对接活动，很多企业开出高薪留人。\n团圆是春节的主题。不管在哪里工作、从事什么行业，许多人都会选择返乡过年。特别是服务行业，外来务工人员占比高、人员流动性较强，本就存在季节性用工缺口，逢年过节更加凸显。从需求端来看，这些行业与日常生活密切相关，育婴、看护等聚焦“一老一小”，属于刚性需求。为此，每到年关，许多地方都会积极推出稳岗扩岗措施，企业也会拿出真金白银主动留人。实打实的物质保障，让不少劳动者选择留岗过年、错峰返乡，有效缓解了“用工荒”，确保春节服务“不断档”。\n对劳动者来说，薪酬待遇固然是重要考量，物质之外的人文关怀同样不可或缺。稳岗留工举措更好发挥作用，既要提供实实在在的保障，让劳动者更有获得感，也要切实给予他们关爱和尊重，让他们更有幸福感，身在异地亦能感受到温暖。一些城市和企业的暖心举措可圈可点。组织“暖心专车”点对点接送异地务工人员返乡返岗，为留岗家政人员提供免费住宿与体检服务，送上真情实意的春节关怀礼包……无论是完善生活保障，还是丰富精神文化生活，只有拿出有温度、暖人心的举措，将心比心、以心换心，才能让大家打心底里愿意留下来。\n对城市来说，热情留人不能止于春节期间，更要把真心用在平时。人才是激发经济活力、提升城市竞争力的宝贵资源。人们选择一座城市，除了繁华便捷、充满机遇等条件外，还在于一种被尊重、被认可的归属感。这也意味着，不仅应在物质层面保障劳动者待遇，还应在城市生活诸多方面落实以人为本，积极回应各个群体的不同诉求。\n留人用“薪”更要用“心”。期盼更多地方在春节期间，把“招得来、留得住”的工作做得更细致，实现人与城的共赢。\n（摘编自《北京日报》）","organized_by":"rule"},{"id":108,"title":"“鱼渔双授”的中国智慧","column_name":"人民时评","publish_date":"2025-01-15","source":"人民日报","source_url":"http://paper.people.com.cn/rmrb/pc/content/202501/15/content_30052082.html","core_view":"不断走向世界的中国慕课，让中国优质高等教育资源走进更多国家，提升了“全球南方”高等教育的可及性","golden_sentences":["破解当今世界存在的一系列发展不平衡、不充分问题，弥合“知识鸿沟”是当务之急，也是长远之计。","过去是资源出海、活动出海，如今是服务出海、标准出海，“慕课出海”正从“1.0”迈向“2.0”。","让更多师生“云端”相聚，让知识传播“跨山越海”，让国际教育合作的版图不断扩大，中国的脚步坚定向前、不会停歇。","不断走向世界的中国慕课，让中国优质高等教育资源走进更多国家，提升了“全球南方”高等教育的可及性","一块大屏、一个摄像头、一根网线，把远隔万里、不同国家和地区的高校学生，引入中国大学的课堂。","让知识传播无远弗届，让渴望学习的个体不囿于一地一域，这是慕课的独特魅力。"],"argument_structure":"全文由事及理提出观点，递进升华（不仅……更……），最后落脚到时代主题与价值升华。","topics":["business_environment","digital_economy"],"writing_angles":["从“有效市场+有为政府”切入，论证营商环境优化","以“高水平对外开放”为背景，写统一大市场与制度型开放","把“经营主体信心”作为观察窗口，落到稳预期政策"],"summary":"不断走向世界的中国慕课，让中国优质高等教育资源走进更多国家，提升了“全球南方”高等教育的可及性。一块大屏、一个摄像头、一根网线，把远隔万里、不同国家和地区的高校学生，引入中国大学的课堂。“在印尼，我们很难学到这类课程，我很珍惜这次学习机会。","original_content":"不断走向世界的中国慕课，让中国优质高等教育资源走进更多国家，提升了“全球南方”高等教育的可及性\n一块大屏、一个摄像头、一根网线，把远隔万里、不同国家和地区的高校学生，引入中国大学的课堂。\n“在印尼，我们很难学到这类课程，我很珍惜这次学习机会。”印尼特布卡大学的学生迪亚通过在线平台与清华大学的同学一起学习城市环境工程课程。不必留学，便能享受中国顶尖学府的优质教育资源。\n让知识传播无远弗届，让渴望学习的个体不囿于一地一域，这是慕课的独特魅力。截至2024年底，我国智慧高教平台共上线优质在线课程3.1万门，用户覆盖183个国家和地区，超过9300万人次访问；“爱课程”和“学堂在线”平台向全球学习者开放1000余门、14个语种的课程，累计学习人次达67万。从起步之初只有5门课程、上百名用户，到如今走出国门、享誉世界，中国慕课从无到有、从小到大，成为我国教育开放的一张名片。\n知识是人类进步的阶梯，但在一些国家，受制于较为薄弱的高等教育条件，知识成了一项稀缺资源。破解当今世界存在的一系列发展不平衡、不充分问题，弥合“知识鸿沟”是当务之急，也是长远之计。\n作为数字技术与高等教育深度融合的产物，慕课提供了开放共享的知识载体，有助于解决“知识鸿沟”、推动“知识普惠”。西安交通大学设立丝路培训基地，上线数十个培训专题、近百门国际课程，培养了来自100余个国家和地区的超1万名学生及企业人员；西南交通大学落实共建“一带一路”倡议，开展课程、教材建设，培养了来自80余个国家的超5000名轨道交通人才……不断走向世界的中国慕课，让中国优质高等教育资源走进更多国家，提升了“全球南方”高等教育的可及性。\n过去是资源出海、活动出海，如今是服务出海、标准出海，“慕课出海”正从“1.0”迈向“2.0”。完善与国外高校的课程共享、学分互认机制，探索微证书项目等更具吸引力的学习成果转化形式；牵头成立世界慕课与在线教育联盟，与全球30余家知名高校和在线教育机构合作搭建课程引进与输出双向沟通渠道；发布《慕课发展北京宣言》《世界高等教育数字化发展报告》等，与世界分享中国数字教育经验……中国慕课“出海远航”的过程，也是中国主动扩大教育开放、推动全球高等教育数字化发展的过程。\n放在现代化的视角来看，对于一个国家而言，教育是发展的基石。立己达人、携手同行现代化之路，这是中国的追求。授人以鱼不如授人以渔。从“出海远航”的中国慕课，到独具特色的鲁班工坊，再到精准服务当地发展的“海丝学院”“丝路学院”，中国带去的不仅有具体的项目，还有发展的后劲。“慕课出海”折射的，正是中国“鱼渔双授”的独特智慧。\n中国的发展离不开世界，世界的繁荣也需要中国。在中国和世界“双向奔赴”的悠扬交响中，教育是其中一个美妙的音符。让更多师生“云端”相聚，让知识传播“跨山越海”，让国际教育合作的版图不断扩大，中国的脚步坚定向前、不会停歇。","organized_by":"rule"}],"stats":{"total":126,"latest":"2026-11-24","byTopic":[{"key":"law_enforcement","label":"行政执法","count":58},{"key":"rural_revitalization","label":"乡村振兴","count":8},{"key":"business_environment","label <script>
// 申论素材库 前端应用（原生 JS，哈希路由）
const $ = (sel, root = document) => root.querySelector(sel);

const state = {
  user: null,
  topics: [],
  list: { items: [], total: 0, page: 1, params: {} },
};

const TOPIC_COLORS = {}; // 预留

// 离线 PWA 模式：window.__OFFLINE__ + window.__SUCAI__（由 data.js 注入）
const OFFLINE = !!window.__OFFLINE__;
const DATA = window.__SUCAI__ || null;

// ---------- API ----------
async function api(path, opts = {}) {
  if (OFFLINE) return offlineApi(path, opts);
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    ...opts,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `请求失败(${res.status})`);
  return data;
}

// ---------- 离线数据层（PWA / 静态版）----------
const FAV_KEY = 'shenlun_favs_v1';
function readFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch { return []; }
}
function writeFavs(arr) { localStorage.setItem(FAV_KEY, JSON.stringify(arr)); }

function offlineApi(path, opts = {}) {
  if (!DATA) throw new Error('离线数据未加载');
  const [pathname, queryStr] = path.split('?');
  const params = new URLSearchParams(queryStr || '');
  const method = (opts.method || 'GET').toUpperCase();

  if (pathname === '/api/topics') return { topics: DATA.topics };
  if (pathname === '/api/stats') return DATA.stats;
  if (pathname === '/api/archive') return { months: DATA.months };

  if (pathname === '/api/materials') {
    const topic = params.get('topic') || '';
    const month = params.get('month') || '';
    const q = (params.get('q') || '').trim().toLowerCase();
    const page = Number(params.get('page') || 1);
    const limit = Math.min(100, Math.max(1, Number(params.get('limit') || 20)));
    let items = DATA.materials;
    if (topic) items = items.filter((m) => m.topics.includes(topic));
    if (month) items = items.filter((m) => m.publish_date.startsWith(month));
    if (q) {
      items = items.filter((m) => {
        const hay = (m.title + m.summary + (m.golden_sentences || []).join('') + m.original_content).toLowerCase();
        return hay.includes(q);
      });
    }
    items = items.slice().sort((a, b) => b.publish_date.localeCompare(a.publish_date) || b.id - a.id);
    const total = items.length;
    const start = (Math.max(1, page) - 1) * limit;
    return { total, items: items.slice(start, start + limit) };
  }

  const dm = pathname.match(/^\/api\/materials\/(\d+)$/);
  if (dm) {
    const m = DATA.materials.find((x) => x.id === Number(dm[1]));
    if (!m) throw new Error('素材不存在');
    return { material: m };
  }

  if (pathname === '/api/auth/me') return { user: { id: 0, username: '本地用户' } };
  if (pathname === '/api/auth/login' || pathname === '/api/auth/register' || pathname === '/api/auth/logout') {
    return { ok: true, user: { id: 0, username: '本地用户' } };
  }

  if (pathname === '/api/favorites' && method === 'GET') {
    const ids = readFavs();
    const favorites = DATA.materials
      .filter((m) => ids.includes(m.id))
      .map((m) => ({ id: m.id, title: m.title, publish_date: m.publish_date, source: m.source, topics: m.topics, column_name: m.column_name }));
    return { favorites };
  }

  const fm = pathname.match(/^\/api\/favorites\/(\d+)$/);
  if (fm) {
    const id = Number(fm[1]);
    if (method === 'POST') {
      const ids = readFavs();
      if (!ids.includes(id)) ids.push(id);
      writeFavs(ids);
      return { ok: true, favorited: true };
    }
    writeFavs(readFavs().filter((x) => x !== id));
    return { ok: true, favorited: false };
  }

  throw new Error('离线模式不支持该接口');
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (el.hidden = true), 2200);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtDate(d) {
  return d || '';
}

function topicLabel(key) {
  const t = state.topics.find((x) => x.key === key);
  return t ? t.label : key;
}

// ---------- 初始化 ----------
async function init() {
  try {
    state.topics = (await api('/api/topics')).topics;
  } catch (e) {
    console.error(e);
  }
  if (OFFLINE) {
    state.user = { id: 0, username: '本地用户' };
  } else {
    try {
      state.user = (await api('/api/auth/me')).user;
    } catch {}
  }
  renderAuthArea();
  window.addEventListener('hashchange', route);
  $('#search-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('#search-input').value.trim();
    if (q) location.hash = `#/search?q=${encodeURIComponent(q)}`;
  });
  route();
}

function renderAuthArea() {
  const area = $('#auth-area');
  if (OFFLINE) {
    area.innerHTML = `<span class="who">本地收藏</span>`;
    return;
  }
  if (state.user) {
    area.innerHTML = `<span class="who">${esc(state.user.username)}</span>
      <button class="btn-mini" id="logout-btn">退出</button>`;
    $('#logout-btn').onclick = async () => {
      await api('/api/auth/logout', { method: 'POST' });
      state.user = null;
      renderAuthArea();
      toast('已退出登录');
      route();
    };
  } else {
    area.innerHTML = `<button class="btn-mini" id="login-btn">登录 / 注册</button>`;
    $('#login-btn').onclick = () => openAuthModal('login');
  }
}

// ---------- 路由 ----------
function route() {
  const raw = location.hash.slice(1) || '/';
  const [pathPart, queryPart] = raw.split('?');
  const q = new URLSearchParams(queryPart || '');

  window.scrollTo(0, 0);

  // 顶栏高亮
  document.querySelectorAll('.nav a').forEach((a) => a.classList.remove('active'));
  const navMap = { '/': 'home', '/archive': 'archive', '/favorites': 'favorites' };
  if (navMap[pathPart]) document.querySelector(`.nav a[data-nav="${navMap[pathPart]}"]`)?.classList.add('active');

  // 手机底部导航高亮
  document.querySelectorAll('.mobile-nav a').forEach((a) => a.classList.remove('active'));
  const mnavMap = { '/': 'home', '/archive': 'archive', '/favorites': 'favorites', '/search': 'search' };
  if (mnavMap[pathPart]) document.querySelector(`.mobile-nav a[data-mnav="${mnavMap[pathPart]}"]`)?.classList.add('active');

  if (pathPart === '/' || pathPart === '') return renderHome();
  if (pathPart === '/archive') return renderArchive(q.get('month'));
  if (pathPart === '/favorites') return renderFavorites();
  if (pathPart === '/search') return renderSearch(q.get('q') || '');
  const tm = pathPart.match(/^\/topic\/([a-z_]+)$/);
  if (tm) return renderTopic(tm[1]);
  const dm = pathPart.match(/^\/material\/(\d+)$/);
  if (dm) return renderDetail(Number(dm[1]));
  renderNotFound();
}

const app = () => $('#app');

function setLoading() {
  app().innerHTML = `<div class="loading">加载中…</div>`;
}

        <div class="angle-list">

          <span class="badge src">重要讲话</span>
        </div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><b>${statsData.total || 0}</b><span>篇核心素材</span></div>
        <div class="hero-stat"><b>${(statsData.byMonth || []).length}</b><span>个月历史归档</span></div>
        <div class="hero-stat"><b>${fmtDate(statsData.latest) || '—'}</b><span>最新收录</span></div>
      </div>
    </section>

    <div class="section-title"><h2>八大申论主题</h2><span class="count">点击进入分类浏览</span></div>
    <div class="topic-grid" id="topic-grid"></div>

    <div class="section-title"><h2>最新素材</h2><span class="count">按发布日期倒序</span></div>
    <div class="material-list" id="latest-list"></div>
    <div class="pager"><a class="btn-ghost" href="#/archive">查看全部历史归档 →</a></div>
  `;

  $('#topic-grid').innerHTML = state.topics

// ---------- 素材卡片 ----------
function materialCardHtml(m) {
  const tps = (m.topics || []).map((k) => `<span class="mc-topic">${esc(topicLabel(k))}</span>`).join(' ');
  return `
  <article class="material-card" data-id="${m.id}">
    <div class="mc-top">
      <span class="badge src">${esc(m.source.split('·')[0])}</span>
      ${m.column_name ? `<span class="badge">${esc(m.column_name)}</span>` : ''}
      ${tps}

    <h3 class="mc-title">${esc(m.title)}</h3>
    <p class="mc-summary">${esc(m.summary || m.core_view || '')}</p>
    <div class="mc-foot">
      <span>${esc(m.publish_date)}</span>
    </div>
  </article>`;
}

function bindMaterialCards(root) {
  root.querySelectorAll('.material-card').forEach((el) => {
    el.onclick = () => (location.hash = `#/material/${el.dataset.id}`);

// ---------- 分类页 ----------

    .map(
      (m) => `<div class="month-row" data-month="${esc(m.month)}">
        <span class="mr-month">${esc(m.month)}</span>
        <span class="mr-dates">${esc(m.first_date)} ~ ${esc(m.last_date)}</span>
        <span class="mr-count">${m.count} 篇</span>
      </div>`
    )
    .join('');
  $('#month-grid').querySelectorAll('.month-row').forEach((el) => {
    el.onclick = () => (location.hash = `#/archive?month=${el.dataset.month}`);
  });
  if (month) {
    $('#list').innerHTML = listData.items.length ? listData.items.map(materialCardHtml).join('') : emptyHtml();
    bindMaterialCards($('#list'));
  } else {
    $('#list').innerHTML = `<div class="empty">请在上方选择月份查看该月全部素材。</div>`;
  }
}

// ---------- 搜索 ----------
async function renderSearch(q) {
  setLoading();
  const data = await api(`/api/materials?q=${encodeURIComponent(q)}&limit=100`);
  app().innerHTML = `
    <div class="search-hero">
      <h1>关键词检索</h1>
      <p class="muted">在标题、摘要、金句与原文全文中搜索，命中 ${data.total} 篇</p>
      <form class="search-big" id="search-big-form">
        <input id="search-big-input" type="search" value="${esc(q)}" placeholder="输入关键词，如：粮食安全、新质生产力、基层治理…" />
        <button class="btn-primary" type="submit">搜索</button>
      </form>
    </div>
    <div class="material-list" id="list">${data.items.length ? data.items.map(materialCardHtml).join('') : emptyHtml('没有找到相关素材，换个关键词试试。')}</div>`;
  bindMaterialCards($('#list'));
  $('#search-big-form').onsubmit = (e) => {
    e.preventDefault();
    const nq = $('#search-big-input').value.trim();
    location.hash = nq ? `#/search?q=${encodeURIComponent(nq)}` : '#/search';
  };
}

// ---------- 收藏 ----------
async function renderFavorites() {
  if (!state.user) {
    app().innerHTML = `
      <div class="page-head"><h1>我的收藏</h1><p>登录后可收藏重点素材</p></div>
      <div class="empty">
        你还没有登录。<br/><br/>
        <button class="btn-primary" id="go-login">登录 / 注册</button>
      </div>`;
    $('#go-login').onclick = () => openAuthModal('login');
    return;
  }
  setLoading();
  const { favorites } = await api('/api/favorites');
  app().innerHTML = `
    <div class="page-head"><h1>我的收藏</h1><p>共 ${favorites.length} 篇</p></div>
    <div class="material-list" id="fav-list">
      ${favorites.length
        ? favorites
            .map(
              (m) => `<article class="material-card" data-id="${m.id}">
                <div class="mc-top">${(m.topics || []).map((k) => `<span class="mc-topic">${esc(topicLabel(k))}</span>`).join(' ')}</div>
                <h3 class="mc-title">${esc(m.title)}</h3>
                <div class="mc-foot"><span>${esc(m.source.split('·')[0])}</span><span>${esc(m.publish_date)}</span></div>
              </article>`
            )
            .join('')
        : emptyHtml('还没有收藏，去素材详情页点「收藏」吧。')}
    </div>`;
  bindMaterialCards($('#fav-list'));
}

// ---------- 详情 ----------
async function renderDetail(id) {
  setLoading();
  let data;
  try { data = await api(`/api/materials/${id}`); }
  catch { app().innerHTML = `<div class="empty">素材不存在。</div>`; return; }
  const m = data.material;

  let favorited = false;
  let favLoading = false;
  if (state.user) {
    try {
      const favs = (await api('/api/favorites')).favorites;
      favorited = favs.some((f) => f.id === m.id);
    } catch {}
  }

  const golden = (m.golden_sentences || [])
    .map((g) => `<li class="golden-item"><span>${esc(g)}</span></li>`)
    .join('');
  const angles = (m.writing_angles || []).map((a) => `<span class="tag">${esc(a)}</span>`).join('');
  const tags = (m.topics || []).map((k) => `<span class="tag">${esc(topicLabel(k))}</span>`).join('');

  const fullText = m.original_content || '';
  const preview = fullText.length > 300 ? fullText.slice(0, 300) : fullText;
  const paragraphs = (text) =>
    text
      .split(/\n+/)
      .map((p) => p.trim())
      .filter((p) => p.length > 0)
      .map((p) => `<p>${esc(p)}</p>`)
      .join('');

  app().innerHTML = `
    <div class="detail">
      <div class="detail-back" id="back-btn">← 返回列表</div>
      <div class="detail-head">
        <h1 class="detail-title">${esc(m.title)}</h1>
        <div class="detail-meta">
          <span class="badge src">${esc(m.source.split('·')[0])}</span>
          ${m.column_name ? `<span class="badge">${esc(m.column_name)}</span>` : ''}
          ${m.organized_by === 'deepseek' ? '<span class="badge ai">DeepSeek 整理</span>' : ''}
          <span>${esc(m.publish_date)}</span>
          ${tags}
          <button class="btn-mini ${favorited ? 'on' : ''}" id="fav-btn" style="margin-left:auto">
            ${favorited ? '★ 已收藏' : '☆ 收藏'}
          </button>
        </div>
        <div class="src-line">来源：${esc(m.source)} ｜ ${esc(m.source_url)}</div>
      </div>

      <section class="sec">
        <h3>核心观点</h3>
        <div class="core-view">${esc(m.core_view)}</div>
      </section>

      <section class="sec">
        <h3>好词好句 · 金句摘录</h3>
        <ul class="golden-list">${golden || '<li class="muted">（暂无）</li>'}</ul>
      </section>

      <section class="sec">
        <h3>论证结构 / 框架</h3>
        <div class="structure">${esc(m.argument_structure)}</div>
      </section>

      <section class="sec">
        <h3>申论写作角度</h3>
        <div class="angle-list">${angles || '<span class="muted">（暂无）</span>'}</div>
      </section>

      <section class="sec">
        <h3>原文摘要</h3>
        <p>${esc(m.summary)}</p>
      </section>

      <section class="sec">
        <h3>原文全文</h3>
        <div class="original" id="original">
          <div class="original-head">
            <b>原文全文</b>
            <span class="muted" style="font-size:12px">共 ${fullText.length} 字</span>
          </div>
          <div class="original-body" id="original-body">${paragraphs(preview)}<div class="original-fade"></div></div>
          <div class="original-toggle">
            <button class="btn-ghost" id="expand-btn">展开阅读全文 ↓</button>
          </div>
        </div>
      </section>
    </div>
  `;

  $('#back-btn').onclick = () => (history.length > 1 ? history.back() : (location.hash = '#/'));

  $('#fav-btn').onclick = async () => {
    if (!state.user) {
      toast('请先登录后再收藏');
      openAuthModal('login');
      return;
    }
    if (favLoading) return;
    favLoading = true;
    try {
      const nowFav = !favorited;
      await api(`/api/favorites/${m.id}`, { method: nowFav ? 'POST' : 'DELETE' });
      favorited = nowFav;
      const btn = $('#fav-btn');
      btn.textContent = favorited ? '★ 已收藏' : '☆ 收藏';
      btn.classList.toggle('on', favorited);
      toast(favorited ? '已加入收藏' : '已取消收藏');
    } catch (e) {
      toast(e.message);
    } finally {
      favLoading = false;
    }
  };

  // 全文展开 / 收起
  const body = $('#original-body');
  const expandBtn = $('#expand-btn');
  const shortHtml = paragraphs(preview) + '<div class="original-fade"></div>';
  const fullHtml = paragraphs(fullText);
  let expanded = false;
  expandBtn.onclick = () => {
    expanded = !expanded;
    if (expanded) {
      body.innerHTML = fullHtml;
      body.classList.add('expanded');
      expandBtn.textContent = '收起 ↑';
    } else {
      body.innerHTML = shortHtml;
      body.classList.remove('expanded');
      expandBtn.textContent = '展开阅读全文 ↓';
    }
  };
}

function emptyHtml(msg = '暂无数据。') {
  return `<div class="empty">${esc(msg)}</div>`;
}

function renderNotFound() {
  app().innerHTML = `<div class="empty">页面不存在，<a href="#/">返回首页</a></div>`;
}

// ---------- 登录/注册弹窗 ----------
let authMode = 'login';

function openAuthModal(mode) {
  authMode = mode;
  const mask = $('#auth-modal');
  mask.hidden = false;
  updateAuthModal();
  $('#auth-username').focus();
}

function updateAuthModal() {
  const isLogin = authMode === 'login';
  $('#auth-modal-title').textContent = isLogin ? '登录' : '注册';
  $('#auth-modal-sub').textContent = isLogin ? '登录后可收藏重点素材' : '创建一个本地账号即可收藏素材';
  $('#auth-submit').textContent = isLogin ? '登录' : '注册';
  $('#auth-switch-link').textContent = isLogin ? '没有账号？注册一个' : '已有账号？去登录';
  $('#auth-error').textContent = '';
}

function bindAuthModal() {
  $('#modal-close').onclick = () => ($('#auth-modal').hidden = true);
  $('#auth-modal').addEventListener('click', (e) => {
    if (e.target.id === 'auth-modal') $('#auth-modal').hidden = true;
  });
  $('#auth-switch-link').onclick = (e) => {
    e.preventDefault();
    authMode = authMode === 'login' ? 'register' : 'login';
    updateAuthModal();
  };
  $('#auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const username = $('#auth-username').value.trim();
    const password = $('#auth-password').value;
    $('#auth-error').textContent = '';
    try {
      if (authMode === 'register') {
        await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ username, password }) });
        authMode = 'login';
        updateAuthModal();
        toast('注册成功，请登录');
        return;
      }
      const res = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
      state.user = res.user;
      renderAuthArea();
      $('#auth-modal').hidden = true;
      toast('登录成功');
      route();
    } catch (err) {
      $('#auth-error').textContent = err.message;
    }
  };
}

init();
bindAuthModal();

</script>
</body>
</html>
